name: Deploy to purely.website

# Ships the built site to purely.website over rsync-on-SSH.
# GitHub stays the source of truth; this only *copies* the result to the host.
#
# Runs after a push to main. It regenerates the plain HTML mirror itself
# (build_plain_site.py) right before syncing, so the host always ends up with
# plain/ matching the current content — regardless of whether the plain-mirror
# workflow's follow-up commit has landed yet. (That bot commit is pushed with
# the automatic GITHUB_TOKEN, which by design does NOT re-trigger this deploy,
# so we cannot rely on it to ship the regenerated mirror.)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         purely server host or IP (e.g. 89.248.52.130)
#   SSH_USER         your purely SSH username
#   SSH_PRIVATE_KEY  a private key whose public half is in the host's
#                    ~/.ssh/authorized_keys  (SSH into purely once and append it)
#   DEPLOY_PATH      absolute web root on the host (e.g. /home/USER/public_html)
# Optional:
#   SSH_PORT         defaults to 22

on:
  push:
    branches: [main]
    # These paths are excluded from the rsync below, so a commit touching only
    # them cannot change anything the host serves — the run would spend a few
    # minutes rebuilding the mirror and re-stamping version.json to ship
    # nothing. `scripts/` is deliberately NOT in this list even though it is
    # excluded from the upload: the generators run *during* the deploy, so a
    # fix to build_plain_site.py does change the output and has to reach the
    # host. Keep this list a subset of the rsync excludes; anything the deploy
    # actually uploads (CLAUDE.md, .gitignore, the site itself) belongs
    # nowhere near it.
    paths-ignore:
      - 'todo.md'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:            # lets you deploy on demand from the Actions tab

concurrency:                    # never let two deploys overlap
  group: deploy-purely
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Publish subfolder: the site publishes to <web root>/$SUBDIR. Empty means
      # the live root, https://clacktronics.co.uk/ — which is where the site now
      # goes. Set it to a folder name (it used to be `temp`) to stage a build
      # somewhere harmless instead. Both the rsync destination and the
      # canonical/sitemap URLs below follow this one knob.
      SUBDIR: ""
      SITE_ORIGIN: https://clacktronics.co.uk
    steps:
      - uses: actions/checkout@v4
        with:
          # This job rebuilds the mirror before shipping it, and the sitemap's
          # <lastmod> dates come from each page's last commit — which a shallow
          # checkout cannot supply. build_plain_site.py leaves lastmod out
          # entirely rather than emit the same wrong date for every page, so
          # without the full history the deployed sitemap loses its dates even
          # though the committed one has them.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Stamp the build
        # version.json is fetched (no-store) by the About window so ClackOS can
        # show which commit the host is actually serving — handy for spotting a
        # stale cache. The same values stamp the plain mirror below.
        run: |
          echo "SITE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SITE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          # Canonical links, Open Graph URLs, the sitemap and the Sitemap: line
          # in robots.txt all have to be absolute, and must match where these
          # files actually land — otherwise a staged build points crawlers at
          # URLs that are not serving the pages yet.
          echo "SITE_URL=${SITE_ORIGIN%/}${SUBDIR:+/$SUBDIR}/" >> "$GITHUB_ENV"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SITE_BUILT_AT=$BUILT_AT" >> "$GITHUB_ENV"
          printf '{"commit":"%s","short":"%s","builtAt":"%s","ref":"%s","url":"https://github.com/%s/commit/%s"}\n' \
            "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$BUILT_AT" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            > version.json

      - name: Regenerate blog index
        # blog.md / blog-page-N.md / blog-list.md are built from the posts by
        # the blog-index workflow, which commits with the automatic
        # GITHUB_TOKEN — a push that by design does NOT re-trigger this deploy.
        # So the checkout for a "new post" push still carries the *previous*
        # blog windows, and shipping it as-is leaves the new post missing from
        # the blog until some unrelated push happens to come along. Rebuilding
        # here makes the deploy self-sufficient. Tree-only; nothing is committed.
        run: python3 scripts/build_blog_index.py

      - name: Regenerate plain HTML mirror
        # Build the static plain/ pages from the current content so the deploy
        # always ships an up-to-date mirror, even before the plain-mirror
        # workflow commits its copy back to the repo. Reads the SITE_* values
        # set above to stamp the build. Runs against the checked-out tree only;
        # it does not commit anything.
        run: python3 scripts/build_plain_site.py

      - name: Precompress WebAssembly modules
        # The site serves these gzipped (see .htaccess): together they are
        # ~114 MB raw and ~30 MB gzipped, and compressing them per request
        # would cost about a second of CPU each time.
        #
        # They are built here rather than committed so a .gz can never be left
        # behind by a rebuild. That matters because not every module has a
        # content-hashed name — vendor/pyodide/pyodide.asm.wasm and
        # vendor/mupdf/mupdf-wasm.wasm keep the same filename across upgrades,
        # so a stale .gz beside one of those would silently serve the previous
        # module at the same URL. Regenerating on every deploy removes that
        # failure mode entirely.
        run: |
          set -euo pipefail
          find . -name '*.wasm' -not -path './.git/*' -print0 \
            | xargs -0 -r -P 4 -I {} gzip -9 -k -f {}
          echo "Precompressed:"
          find . -name '*.wasm.gz' -not -path './.git/*' -printf '  %10s  %p\n' | sort -k2

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the host key
        # This is the step that makes the deploy flaky. ssh-keyscan gives up
        # after a five-second connect timeout, prints NOTHING when it does, and
        # exits 1 — which under the default `bash -e` shell kills the job before
        # rsync is even attempted. Run 30163207840 (2026-07-25) is exactly that:
        # the step ran for 5.0s flat, produced no output, exit code 1. The host
        # was fine either side of it. On shared hosting one slow moment on
        # port 22 is all it takes, and there was nothing to retry it.
        #
        # So: a longer timeout, and up to five attempts with growing backoff.
        # A keyscan either returns a host key or it doesn't — it changes nothing
        # on the server — so retrying costs only time.
        #
        # Output goes to a temp file and is appended only once the scan has
        # actually succeeded, so a partial read on a failed attempt can't leave
        # half a key in known_hosts for the next attempt to trip over.
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          PORT="${SSH_PORT:-22}"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "$PORT" -H "$SSH_HOST" >/tmp/hostkeys 2>/tmp/keyscan.err \
               && [ -s /tmp/hostkeys ]; then
              cat /tmp/hostkeys >> ~/.ssh/known_hosts
              echo "Host key collected on attempt $attempt."
              exit 0
            fi
            # Empty stderr here is the timeout case, and is worth saying out
            # loud — silence in the log is what made this hard to read before.
            echo "Attempt $attempt failed. ssh-keyscan said:"
            cat /tmp/keyscan.err
            if [ ! -s /tmp/keyscan.err ]; then
              echo "  (nothing — the connection timed out)"
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Could not read the host key from port $PORT after 5 attempts over ~50s. The host is unreachable rather than misconfigured; re-run the job."
          exit 1
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Sync to purely
        # Retried for the same reason as the host key above, and it matters more
        # here: this pushes ~30 MB of gzipped Wasm over a single SSH connection,
        # so it is the step most exposed to a dropped or throttled connection,
        # and a failure means the host keeps serving the previous commit.
        #
        # Retrying is safe because the transfer is idempotent — no --delete (see
        # the note at the bottom), and rsync skips files already matching on the
        # far side, so a second attempt re-sends only what didn't make it.
        #
        # --timeout=60 is what makes a retry possible at all: without it a
        # half-open connection hangs until the job's own limit and there is
        # nothing left to retry with.
        run: |
          set -uo pipefail
          # SUBDIR comes from the job env at the top of this file, so the upload
          # path and the canonical URLs baked into the mirror cannot drift apart.
          DEST="${DEPLOY_PATH%/}${SUBDIR:+/$SUBDIR}"
          for attempt in 1 2 3; do
            if rsync -avz --human-readable --timeout=60 \
                 -e "ssh -p ${SSH_PORT:-22} -o ConnectTimeout=30 -o ServerAliveInterval=15" \
                 --exclude '.git/' \
                 --exclude '.github/' \
                 --exclude 'scripts/' \
                 --exclude 'README.md' \
                 --exclude 'todo.md' \
                 --exclude 'assets/uploads/' \
                 --exclude 'assets/old_assets/' \
                 --exclude 'assets/upload-config.php' \
                 --exclude 'assets/upload-config.example.php' \
                 ./ "${SSH_USER}@${SSH_HOST}:${DEST}/"; then
              echo "Synced on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "rsync attempt $attempt failed. Retrying — files that already made it will be skipped."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::rsync failed 3 times. The host is still serving the previous commit."
          exit 1
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

# NOTE ON --delete
# ----------------
# This job intentionally does NOT pass --delete, so it never removes files on
# the host. That means it will never touch assets/uploads/ (your direct-uploaded
# images/video), assets/old_assets/ (the legacy WordPress-era media the posts
# link to, which lives only on the host) or anything else you keep on the server
# outside Git — but it also won't clean up files you delete from the repo.
#
# If you later want the host to mirror the repo exactly, add --delete AND keep
# the `--exclude 'assets/uploads/'` and `--exclude 'assets/old_assets/'` lines:
# rsync protects excluded paths from deletion, so the media that is not in Git
# survives. Test with `--dry-run` the first time.
