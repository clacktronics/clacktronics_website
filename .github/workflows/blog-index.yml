name: Rebuild blog index

on:
  push:
    paths:
      - 'content/file/blog/**'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate content/file/blog.md
        run: python3 scripts/build_blog_index.py

      - name: Commit the index if it changed
        run: |
          if ! git diff --quiet content/file/blog.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/file/blog.md
            git commit -m "Rebuild blog index"
            git push
          else
            echo "blog.md already up to date"
          fi
