name: Mirror Luma events

# Luma sends no CORS headers, so the Calendar app cannot fetch the profile from
# the browser. This does it here instead and commits the result, which the app
# reads as an ordinary file from its own origin.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write                # to start the deploy below

# Do not allow two manually started refreshes to race each other.
concurrency:
  group: luma-events
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Luma events
        # The script leaves the file alone when nothing has changed, so an
        # unchanged calendar makes no commit.
        run: python3 scripts/fetch_luma_events.py

      - name: Commit the events if they changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain content/applications/calendar/luma.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/applications/calendar/luma.json
            git commit -m "Update the Luma events mirror"
            # the plain-mirror and blog-index workflows may push concurrently
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "the Luma events are already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship it to the host
        # A push made with the automatic GITHUB_TOKEN deliberately does not
        # trigger other workflows, so the commit above cannot start the deploy by
        # itself — without this the new event would sit in the repository until
        # something else happened to push to main.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-purely.yml --ref main
