name: Mirror Luma events

# Luma sends no CORS headers, so the Calendar app cannot fetch the profile from
# the browser. This does it here instead and commits the result, which the app
# reads as an ordinary file from its own origin.

on:
  schedule:
    # Hourly. A new event should show up on the site while it is still news, and
    # a run that finds nothing changed writes nothing and commits nothing, so the
    # cost of asking often is two small HTTP requests.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    # only on the live branch: a push to a feature branch should not land a bot
    # commit on it. Use "Run workflow" to refresh from anywhere.
    branches:
      - main
    paths:
      - 'scripts/fetch_luma_events.py'
      - '.github/workflows/luma-events.yml'

permissions:
  contents: write
  actions: write                # to start the deploy below

# A run started by the schedule must not race one started by a push.
concurrency:
  group: luma-events
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Luma events
        # The script leaves the file alone when nothing has changed, so an
        # unchanged calendar makes no commit.
        run: python3 scripts/fetch_luma_events.py

      - name: Commit the events if they changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain content/applications/calendar/luma.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/applications/calendar/luma.json
            git commit -m "Update the Luma events mirror"
            # the plain-mirror and blog-index workflows may push concurrently
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "the Luma events are already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship it to the host
        # A push made with the automatic GITHUB_TOKEN deliberately does not
        # trigger other workflows, so the commit above cannot start the deploy by
        # itself — without this the new event would sit in the repository until
        # something else happened to push to main. Asking for the deploy directly
        # is the whole point of mirroring on a schedule.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-purely.yml --ref main
