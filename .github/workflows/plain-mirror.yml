name: Rebuild plain HTML mirror

on:
  push:
    paths:
      - 'content/**'
      - 'scripts/build_plain_site.py'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap's <lastmod> for each page is the date its markdown was
          # last committed, so the build needs the history to read it from. The
          # default shallow checkout has one commit and would date every page
          # the same; build_plain_site.py detects that and writes no lastmod at
          # all rather than a wrong one, so without this the dates just vanish.
          fetch-depth: 0

      - name: Regenerate blog index first
        # This job and the blog-index job start from the same push, so the tree
        # checked out here still has the old blog windows: mirroring them would
        # publish a blog listing without the post that triggered the run, and
        # the bot commit that fixes content/file does not re-trigger this
        # workflow. Build them here so the mirror is made from current content,
        # then hand content/file back to the blog-index job, which owns it.
        run: python3 scripts/build_blog_index.py

      - name: Refresh the applications' schema.org blocks
        # Derived from each app's own description and its menu entry, so an
        # edit to either leaves the block behind. Runs before the mirror build
        # because that build reads the application heads to decide which of
        # them belong in the sitemap.
        run: python3 scripts/build_app_metadata.py

      - name: Regenerate plain/
        # No SITE_* env here: the committed mirror stays unstamped ("dev") so
        # about.html doesn't churn on every push. The deploy workflow rebuilds
        # the mirror with the real commit stamp just before it ships to the host.
        run: python3 scripts/build_plain_site.py

      - name: Commit the mirror if it changed
        # sitemap.xml, robots.txt, feed.xml and 404.html are generated alongside
        # the mirror (they list, syndicate and back-stop its pages), so they are
        # committed with it. All four live at the repo root because that is the
        # only place a crawler, a feed reader or Apache's ErrorDocument will
        # look for them.
        run: |
          # Drop the blog windows rebuilt above; committing them here would
          # collide with the blog-index job pushing the same files.
          # (clean too: a changed post count can add a blog-page-N.md, which
          # checkout leaves behind as an untracked file and git pull trips on.)
          git checkout -- content/file
          git clean -fd content/file
          if [ -n "$(git status --porcelain plain sitemap.xml robots.txt feed.xml 404.html content/applications)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add plain sitemap.xml robots.txt feed.xml 404.html content/applications
            git commit -m "Rebuild plain HTML mirror"
            # the blog-index workflow may push concurrently
            git pull --rebase
            git push
          else
            echo "plain/ already up to date"
          fi
