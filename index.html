<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#09140d">
<title>Clacktronics — ClackOS</title>
<meta name="description" content="Clacktronics designs and builds open, hackable electronics from a small workshop in the north of England: Eurorack modules, development boards and RP2350 firmware.">
<!-- This shell has no content of its own — the windows are fetched and built at
     runtime, so every page of the site exists as a URL only in the generated
     static mirror under plain/. Point search engines at the mirror's copy of
     this page rather than letting it compete with an empty desktop. The link is
     relative so it stays right when the site is served from a subfolder. -->
<link rel="canonical" href="plain/index.html">
<!-- Feed autodiscovery. Generated by scripts/build_plain_site.py alongside the
     mirror, and served from the origin root beside sitemap.xml. -->
<link rel="alternate" type="application/rss+xml" title="Clacktronics — blog" href="feed.xml">
<!-- Inline @[model] embeds (assets/js/model-embed.js) and the 3D Model Viewer
     app share one copy of three.js through these bare specifiers. The map costs
     nothing until a module actually imports them, and it has to be in the
     document up front: it cannot be added once module loading has started. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
  }
}
</script>
<!-- Phones get the same desktop as everyone else: the windows shrink to fit the
     screen. The plain mirror is still one tap away in the taskbar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Dosis:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2309140d'/%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%234fae7d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/icons.css">
<link rel="stylesheet" href="assets/css/clackos.css">
<link rel="stylesheet" href="assets/css/content.css">
<style>html.theme-pending body { visibility: hidden; }</style>
<script>
/* Select a browser-saved theme before first paint. If there is no browser
   preference, keep the shell hidden until site.json supplies its default. */
(() => {
  const key = 'clackos-theme';
  const cookieKey = 'clackos-theme-default';
  const safe = value => /^[a-z0-9][a-z0-9._-]*\.css$/i.test(value || '') ? value : '';
  let selected = '';
  try { selected = safe(localStorage.getItem(key)); } catch {}
  if (!selected) {
    const prefix = encodeURIComponent(cookieKey) + '=';
    const item = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix));
    try { selected = safe(item ? decodeURIComponent(item.slice(prefix.length)) : ''); } catch {}
  }
  document.documentElement.classList.add('theme-pending');
  const link = document.createElement('link');
  link.id = 'clackos-theme';
  link.rel = 'stylesheet';
  link.href = `assets/themes/${encodeURIComponent(selected || 'clackos.css')}`;
  if (selected) {
    const reveal = () => document.documentElement.classList.remove('theme-pending');
    link.addEventListener('load', reveal, { once: true });
    link.addEventListener('error', reveal, { once: true });
  }
  document.head.appendChild(link);
})();
</script>
</head>
<body>

<nav id="menubar" aria-label="System menu">
  <div class="logo" aria-hidden="true"><span></span></div>
  <!-- Menus are built from content/site.json + content/<menu>/menu.json, and
       inserted before #menubar-right so they stay left of the date and clock -->
  <div id="menubar-right">
    <button id="events-pill" type="button" aria-expanded="false" aria-controls="events-panel">
      <span class="pill-date">&nbsp;</span><span class="pill-arrow" aria-hidden="true">▾</span>
    </button>
    <div id="clock" aria-live="off">
      <span class="hh">--</span><span class="tick">:</span><span class="mm">--</span>
    </div>
  </div>

  <!-- Upcoming events, pulled down from the date. Filled by clackos.js from
       assets/js/events.js — the same reader the Calendar app uses. -->
  <section id="events-panel" role="dialog" aria-label="Upcoming events" hidden>
    <header>
      <h2>Upcoming events</h2>
      <span id="events-count"></span>
    </header>
    <div id="events-list"></div>
    <footer>
      <button type="button" id="events-open-app">Open Calendar</button>
      <a id="events-source" href="#" target="_blank" rel="noopener noreferrer" hidden>Luma</a>
    </footer>
  </section>
</nav>

<main id="desktop">
  <button class="desktop-icon" type="button" data-window="file/home.md" aria-label="Open Clacktronics">
    <img src="assets/icons/favicon.png" alt="" draggable="false">
    <span>Clacktronics</span>
  </button>
</main>

<div id="taskbar" aria-label="Taskbar">
  <span class="tb-logo" aria-hidden="true"></span>
  <div id="tasks"></div>
  <a id="plain-link" href="plain/index.html" target="_blank" rel="noopener"
     title="Read this site as plain HTML pages, no desktop required">
    <span class="pixel-icon" data-icon="file-text" aria-hidden="true"></span>Plain HTML</a>
  <div id="resource-stats"
       title="Browser telemetry: CPU is a pressure state, not a percentage. RAM is this page's JavaScript heap, not total system memory."
       aria-label="Browser resource telemetry">
    <span><span class="pixel-icon" data-icon="cpu" aria-hidden="true"></span>CPU <strong id="cpu-stat">N/A</strong></span>
    <span><span class="pixel-icon" data-icon="memory-stick" aria-hidden="true"></span>RAM <strong id="ram-stat">N/A</strong></span>
  </div>
  <a id="build-stamp-tb" title="Deployed commit — the build the server is currently serving"
     aria-label="Deployed commit">
    <span class="pixel-icon" data-icon="git-commit" aria-hidden="true"></span><span id="build-sha">dev</span></a>
</div>

<script src="assets/js/highlight.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/image-zoom.js"></script>
<script src="assets/js/backgrounds.js"></script>
<script src="assets/js/events.js"></script>
<script src="assets/js/app-menu.js"></script>
<script src="assets/js/clackos.js"></script>
</body>
</html>
