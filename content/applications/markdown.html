<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Markdown Editor — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- The preview renders the site's own markdown, so an @[model] embed can start
     up in it. Its three.js comes from the same map index.html carries, and an
     import map has to be in the document before any module loads. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="../../vendor/easymde/easymde.min.css">
<!-- after EasyMDE: the preview pane holds real ClackOS page markup, and
     EasyMDE styles .editor-preview at the same specificity -->
<link rel="stylesheet" href="../../assets/css/content.css">
<style>
.app { height: 100%; }
.md-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; }
.md-wrap .EasyMDEContainer {
  flex: 1; min-height: 0; position: relative;
  display: flex; flex-direction: column;
}
.md-wrap .editor-toolbar { flex: none; }
/* the editor and the side-by-side preview live in a row of their own
   (built in JS after init), so the toolbar keeps its natural height */
.mde-row { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.mde-row .CodeMirror { flex: 1; min-width: 0; }
.mde-row .CodeMirror-sided { flex: none !important; width: 50% !important; }
.editor-preview-side {
  position: static !important; flex: none; width: 50%; height: auto;
  min-height: 0; overflow: auto;
}

/* ---- ClackOS skin for EasyMDE ---- */
.EasyMDEContainer .CodeMirror {
  flex: 1; min-height: 0;
  border: 1px solid var(--ink); border-radius: 0 0 8px 8px;
  background: var(--paper); color: var(--ink-soft);
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.7;
}
.CodeMirror-cursor { border-left: 2px solid var(--leaf-deep) !important; }
.CodeMirror-selected { background: rgba(79, 174, 125, 0.25) !important; }
.CodeMirror-focused .CodeMirror-selected { background: rgba(79, 174, 125, 0.35) !important; }
.cm-s-easymde .cm-header { color: var(--heading); }
.cm-s-easymde .cm-quote { color: var(--sage); font-style: italic; }
.cm-s-easymde .cm-link, .cm-s-easymde .cm-url { color: var(--leaf-deep); }
.cm-s-easymde .cm-comment { background: var(--paper-deep); color: var(--leaf-deep); border-radius: 3px; }
.cm-s-easymde .cm-hr { color: var(--paper-line); }
/* frontmatter, coloured by the wrapper mode below — data, not prose */
.cm-s-easymde .cm-def { color: var(--leaf-deep); font-weight: 600; }
.cm-s-easymde .cm-meta { color: var(--sage); }

.editor-toolbar {
  border: 1px solid var(--ink); border-bottom: none; border-radius: 8px 8px 0 0;
  background: var(--paper-deep); opacity: 1;
}
.editor-toolbar button {
  color: var(--control-text) !important; border-radius: 6px;
  font-family: 'IBM Plex Mono', monospace;
}
.editor-toolbar button:hover, .editor-toolbar button.active {
  background: var(--ink); border-color: var(--ink);
}
.editor-toolbar button:hover .pixel-icon, .editor-toolbar button.active .pixel-icon { color: var(--menu-text); }
.editor-toolbar i.separator { border-left: 1px solid var(--paper-line); border-right: none; }
.editor-toolbar button i.fa { display: none; }
.editor-toolbar button .pixel-icon { width: 17px; height: 17px; color: var(--control-text); }

/* The preview holds the same .page / .plain markup a ClackOS window does, so
   assets/css/content.css styles everything inside it — headings, lists, quotes,
   code and the embeds. Only the pane itself is styled here. */
.editor-preview, .editor-preview-side {
  background: var(--paper); color: var(--ink-soft);
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.85;
  padding: 0;
}
.editor-preview-side { border: 1px solid var(--ink); border-left: none; border-radius: 0 0 8px 0; }
/* Window content is centred at a fixed measure; the preview is its own column
   and is often only half a window wide, so let it use the width it has. */
.editor-preview .page, .editor-preview-side .page,
.editor-preview .plain, .editor-preview-side .plain { max-width: none; padding: 24px 28px; }

.md-status { padding: 6px 16px 12px; }
body.dragging .md-wrap { outline: 3px dashed var(--leaf-deep); outline-offset: -8px; }

/* ---- "open from website" browser ---- */
.site-modal {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: rgba(9, 20, 13, 0.35);
  align-items: center; justify-content: center;
}
.site-modal.open { display: flex; }
.site-box {
  width: min(560px, 92vw); max-height: 80vh; display: flex; flex-direction: column;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
  box-shadow: 8px 8px 0 color-mix(in srgb, var(--shadow) 35%, transparent);
}
.site-box header {
  background: var(--ink); color: var(--menu-text); padding: 9px 14px;
  border-radius: 8px 8px 0 0; font-size: 12.5px; display: flex; justify-content: space-between;
}
.site-box header button { all: unset; cursor: pointer; color: var(--menu-text); padding: 0 4px; }
.site-box .site-filter { margin: 12px 14px 0; }
.site-box .site-filter input { width: 100%; }
.site-list { overflow-y: auto; padding: 10px 6px 12px; }
.site-list .grp {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--leaf-deep); padding: 10px 10px 4px;
}
.site-list button {
  all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
  padding: 6px 12px; font-size: 12.5px; color: var(--control-text); border-radius: 6px;
}
.site-list button:hover { background: var(--ink); color: var(--menu-text); }
.site-list button .path { color: var(--sage); font-size: 11px; margin-left: 8px; }
.site-list button:hover .path { color: var(--menu-dim, #8fcaa8); }
.commit-form { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.commit-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--control-text); font-weight: 500; }
.commit-form .hint { font-weight: 400; font-size: 11px; color: var(--sage); }
.commit-form input { width: 100%; }
.commit-actions { display: flex; align-items: center; gap: 14px; }
.rm-dd .sep { height: 1px; background: var(--paper-line); margin: 6px 0; }

/* ---- the inline-video options dialog ---- */
.opt-set { border: 1px solid var(--paper-line); border-radius: 8px; padding: 10px 12px 12px; margin: 0; }
.opt-set legend {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--leaf-deep); padding: 0 6px;
}
.opt-set label {
  flex-direction: row; align-items: baseline; gap: 8px; flex-wrap: wrap;
  padding: 3px 0; cursor: pointer;
}
.opt-set label:has(input:disabled) { cursor: default; opacity: 0.65; }
.opt-set input { width: auto; flex: none; accent-color: var(--leaf-deep); }
.commit-form .snippet {
  margin: 0; font-size: 11.5px; color: var(--sage); overflow-wrap: anywhere;
}
.commit-form .snippet code { color: var(--leaf-deep); }
</style>
</head>

<script src="../../vendor/easymde/easymde.min.js"></script>
<script src="../../assets/js/highlight.js"></script>
<script src="../../assets/js/markdown.js"></script>
<script src="../../assets/js/file-manager.js"></script>
<script>
(() => {
const status = document.getElementById('status');
let fileName = 'untitled.md';
let handle = null;      /* FileSystemFileHandle when the browser supports it */
let dirty = false;
let sitePath = null;    /* repo path when opened via "Open from website" */
let ghToken = null;     /* fine-grained PAT, memory only, per session */
let repoCfg = null;     /* { repo, branch } from content/site.json */

/* The preview is rendered by the site's own renderer (assets/js/markdown.js),
 * not by EasyMDE's, so what you write is previewed as a ClackOS window and the
 * plain mirror will show it: eyebrow headings, button rows, the @[…] embeds and
 * code coloured by the shared highlighter. Frontmatter is read the same way
 * too, so `style: page` previews as the page layout.
 *
 * Links are left inert — window:/app:/action: links have no desktop to act on
 * here, and following an ordinary link would navigate the editor away. */
function renderPreview(plainText) {
  const { meta, body } = ClackMarkdown.parseFrontmatter(plainText);
  const html = ClackMarkdown.render(body, meta);
  requestAnimationFrame(() => document.querySelectorAll('.editor-preview, .editor-preview-side')
    .forEach(pane => {
      ClackMarkdown.populateBuildStamps(pane);
    }));
  return html;
}

const mde = new EasyMDE({
  element: document.getElementById('ed'),
  previewRender: renderPreview,
  autofocus: true,
  spellChecker: false,
  nativeSpellcheck: true,
  autoDownloadFontAwesome: false,
  status: false,
  sideBySideFullscreen: false,
  tabSize: 4,
  toolbar: ['bold', 'italic', 'strikethrough', '|', 'heading', 'quote', 'code', '|',
            'unordered-list', 'ordered-list', 'table', 'horizontal-rule', '|',
            'link', 'image', {
              name: 'insert-video',
              action: insertVideoEmbed,
              title: 'Insert inline video'
            }, {
              name: 'insert-kicanvas',
              action: insertKicanvasEmbed,
              title: 'Insert inline KiCad design'
            }, {
              name: 'insert-model',
              action: insertModelEmbed,
              title: 'Insert inline 3D model'
            }, '|', 'preview', 'side-by-side', 'fullscreen', '|',
            'undo', 'redo'],
  initialValue: `# New document

Write **markdown** here — headings, *emphasis*, ~~strikethrough~~, [links](https://clacktronics.co.uk),
\`inline code\`, and:

- lists
- of
- things

1. or numbered
2. ones

> blockquotes too

| tables | work |
|--------|------|
| yes    | fine |

\`\`\`c
// fenced code blocks
int main(void) { return 0; }
\`\`\`

Use the toolbar or standard shortcuts (Ctrl+B, Ctrl+I…). The preview and split-view buttons change the editor layout. Ctrl+S saves.
`
});

const toolbarIcons = {
  bold: 'letter-b', italic: 'letter-i', strikethrough: 'letter-s',
  heading: 'heading', quote: 'quote-text-inline', code: 'terminal',
  'unordered-list': 'bulletlist', 'ordered-list': 'list-box', table: 'grid-3x3',
  'horizontal-rule': 'minus-box', link: 'link', image: 'image',
  'insert-video': 'video', 'insert-kicanvas': 'circuit-board', 'insert-model': 'box', preview: 'eye',
  'side-by-side': 'align-horizontal-distribute-center', fullscreen: 'expand',
  undo: 'undo', redo: 'reload'
};
Object.entries(toolbarIcons).forEach(([buttonClass, icon]) => {
  const button = document.querySelector(`.editor-toolbar button.${buttonClass}`);
  if (!button) return;
  const marker = document.createElement('span');
  marker.className = 'pixel-icon icon-only';
  marker.dataset.icon = icon;
  marker.setAttribute('aria-hidden', 'true');
  button.appendChild(marker);
});

/* move the editor + side preview into their own flex row so the
   toolbar above them keeps a fixed height */
{
  const container = mde.codemirror.getWrapperElement().parentElement;
  const row = document.createElement('div');
  row.className = 'mde-row';
  container.appendChild(row);
  row.appendChild(mde.codemirror.getWrapperElement());
  const side = container.querySelector('.editor-preview-side');
  if (side) row.appendChild(side);
  mde.codemirror.refresh();
}

const show = () => {
  status.textContent = fileName + (dirty ? ' — unsaved changes' : '') +
    (handle ? '' : '  (saving downloads the file)');
  document.title = fileName + ' — Markdown Editor — ClackOS';
};
mde.codemirror.on('change', () => { if (!dirty) { dirty = true; show(); } });

const fsAccess = 'showOpenFilePicker' in window;
const mdTypes = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }];

async function openFile() {
  if (fsAccess) {
    try {
      const [h] = await window.showOpenFilePicker({ types: mdTypes });
      const f = await h.getFile();
      mde.value(await f.text());
      handle = h;
      sitePath = null;
      fileName = f.name;
      dirty = false;
      show();
    } catch {}
    return;
  }
  picker.click();
}

const picker = document.createElement('input');
picker.type = 'file';
picker.accept = '.md,.markdown,.txt,text/markdown,text/plain';
picker.addEventListener('change', async () => {
  const f = picker.files[0];
  picker.value = '';
  if (!f) return;
  mde.value(await f.text());
  handle = null;
  fileName = f.name;
  dirty = false;
  show();
});

async function writeTo(h) {
  const w = await h.createWritable();
  await w.write(mde.value());
  await w.close();
}

async function saveFile(as) {
  if (fsAccess) {
    try {
      if (as || !handle)
        handle = await window.showSaveFilePicker({ types: mdTypes, suggestedName: fileName });
      await writeTo(handle);
      fileName = (await handle.getFile()).name;
      dirty = false;
      show();
    } catch {}
    return;
  }
  /* fallback: download */
  if (as) {
    const n = prompt('Save as:', fileName);
    if (!n) return;
    fileName = /\.(md|markdown|txt)$/i.test(n) ? n : n + '.md';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([mde.value()], { type: 'text/markdown' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  dirty = false;
  show();
}

function newFile() {
  mde.value('');
  handle = null;
  sitePath = null;
  fileName = 'untitled.md';
  dirty = false;
  show();
}

/* ---- a blog post for today ----
 * Reached from the link at the foot of the blog list (`?new=post`). The blog
 * is built from the filenames in content/file/blog/, so the one thing a new
 * post cannot do without is a correctly dated `YYYY-MM-DD-slug.md` name — it
 * is filled in here, along with a working post around it, so that what lands
 * in the editor renders as-is and only needs its words replaced.
 *
 * The date is the browser's local one, which is the date the person writing
 * the post is having. */
const POST_SLUG = 'new-post';

function todayPost() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  /* the taglines on the existing posts read "9 August 2019" — no leading zero */
  const written = now.toLocaleDateString('en-GB',
    { day: 'numeric', month: 'long', year: 'numeric' });
  return { name: `${stamp}-${POST_SLUG}.md`, body: `---
title: New post
tagline: ${written}
style: plain
---
# New post

![A modular synth](https://clacktronics.co.uk/assets/byom.jpg)

This is where the post goes. Replace the title above (in both places), point
the picture at a real image on \`https://clacktronics.co.uk/assets/\`, and write
the piece. The first paragraph is what search results show, so it is worth
making it a summary rather than a warm-up.

Commit this with **Commit to website…** and the blog pages rebuild themselves.
` };
}

function newPost() {
  const post = todayPost();
  mde.value(post.body);
  handle = null;
  /* left null on purpose: the post is not in the repository yet, and the
     commit dialog already defaults an unsaved file to content/file/blog/ and
     offers "Add …" rather than "Update …" */
  sitePath = null;
  fileName = post.name;
  dirty = false;
  show();
  status.textContent = `New post for ${post.name.slice(0, 10)} — edit, then Commit to website…`;
  /* land the cursor on the title rather than at the top of the frontmatter */
  mde.codemirror.setCursor({ line: 1, ch: 7 });
  mde.codemirror.focus();
}

/* ---- what the editor colours ----
 * EasyMDE colours the source with CommonMark's rules, which are not this
 * renderer's. Two of them are actively misleading:
 *
 *   - Setext headings. CommonMark reads a line of text sitting directly above a
 *     `---` as a heading and underlines it; mdToHtml() has no such rule, so that
 *     is a paragraph followed by a horizontal rule. The frontmatter block at the
 *     top of every page hits this every time — its last key comes out big and
 *     bold, as if `height: 80%` were a section title.
 *   - Frontmatter itself, which is data the renderer reads before the markdown
 *     starts, not markdown.
 *
 * So wrap the gfm mode: colour the frontmatter as metadata (keeping it away from
 * the inner mode, which is what stops the `---` below it reading as an
 * underline) and drop heading styling from anything that is not an ATX `#`
 * heading. Everything else is gfm's, unchanged.
 */
{
  const CodeMirror = window.CodeMirror || mde.codemirror.constructor;
  const gfm = mde.codemirror.getOption('mode');
  const inner = typeof gfm === 'string' ? { name: gfm } : Object.assign({}, gfm);

  const FENCE = /^---[ \t]*$/;
  const ATX_HEADING = /^ {0,3}#{1,6}(?:\s|$)/;
  const SETEXT_UNDERLINE = /^ {0,3}(?:={1,}|-{2,})[ \t]*$/;
  const RULE = /^ {0,3}-{3,}[ \t]*$/;
  const isHeadingStyle = token => token === 'header' || /^header-\d+$/.test(token);

  CodeMirror.defineMode('clackos-markdown', config => {
    const mode = CodeMirror.getMode(config, inner);
    return {
      startState: () => ({
        inner: CodeMirror.startState(mode),
        line: -1, front: 'start', heading: false, underline: false
      }),
      copyState: state => Object.assign({}, state, { inner: CodeMirror.copyState(mode, state.inner) }),
      innerMode: state => ({ state: state.inner, mode }),
      blankLine: state => (mode.blankLine ? mode.blankLine(state.inner) : undefined),
      indent: (state, textAfter, line) =>
        (mode.indent ? mode.indent(state.inner, textAfter, line) : CodeMirror.Pass),

      token(stream, state) {
        if (stream.sol()) {
          state.line += 1;
          /* frontmatter is the `---` fenced block on line 0 and nothing else */
          if (state.front === 'start') state.front = state.line === 0 && FENCE.test(stream.string) ? 'open' : 'none';
          else if (state.front === 'close') state.front = 'none';
          else if (state.front === 'open' && FENCE.test(stream.string)) state.front = 'close';
          state.heading = ATX_HEADING.test(stream.string);
          state.underline = SETEXT_UNDERLINE.test(stream.string);
        }
        if (state.front === 'open' || state.front === 'close') {
          /* `key:` in one colour, its value in another */
          if (state.front === 'open' && stream.sol() && stream.match(/^[^:]+:/)) return 'def';
          stream.skipToEnd();
          return 'meta';
        }

        const style = mode.token(stream, state.inner);
        if (!style || state.heading) return style;
        const kept = style.split(' ').filter(token => !isHeadingStyle(token));
        if (kept.length === style.split(' ').length) return style;
        /* the underline itself is a rule to this renderer; the line above it is
           ordinary prose */
        if (state.underline) return RULE.test(stream.string) ? 'hr' : null;
        return kept.join(' ') || null;
      }
    };
  });

  mde.codemirror.setOption('mode', 'clackos-markdown');
}

/* ---- ClackOS links inserted into Markdown ---- */
const cm = mde.codemirror;

function linkLabel(fallback) {
  const selected = cm.getSelection().trim();
  if (selected) return selected.replace(/\]/g, '\\]');
  const label = prompt('Link text:', fallback);
  return label ? label.replace(/\]/g, '\\]') : null;
}

function insertClackLink(href, fallbackLabel) {
  const label = linkLabel(fallbackLabel);
  if (!label) return;
  cm.replaceSelection(`[${label}](${markdownLinkTarget(href)})`);
  cm.focus();
}

function encodePart(value) {
  /* encodeURIComponent leaves !'()* untouched. Parentheses are meaningful to
     Markdown link syntax, so use strict RFC 3986 encoding for query values. */
  return encodeURIComponent(value.trim()).replace(/[!'()*]/g, character =>
    '%' + character.charCodeAt(0).toString(16).toUpperCase());
}

function markdownLinkTarget(value) {
  return value.trim().replace(/\s|[()]/g, character =>
    [...new TextEncoder().encode(character)]
      .map(byte => '%' + byte.toString(16).toUpperCase().padStart(2, '0')).join(''));
}

function siteFileName(value, folder) {
  const path = value.trim().replace(/\\/g, '/');
  const marker = `/applications/${folder}/`;
  const at = path.toLowerCase().lastIndexOf(marker);
  return (at >= 0 ? path.slice(at + marker.length) : path.replace(/^\/+/, '')).replace(/^.*\//, '');
}

function insertWindowLink() {
  const path = prompt('Markdown path under content/ (for example file/home.md):', 'file/home.md');
  if (path) insertClackLink('window:' + encodeURI(path.trim()), 'Open page');
}

function insertActionLink() {
  const action = prompt('Desktop action: close-front, tidy, plain-html, copy, or restart', 'tidy');
  if (action) insertClackLink('action:' + encodePart(action), action === 'tidy' ? 'Tidy windows' : 'Run action');
}

function markdownEmbedTarget(value) {
  return value.trim().replace(/\s/g, '%20').replace(/[()]/g, character =>
    '%' + character.charCodeAt(0).toString(16).toUpperCase());
}

function markdownEmbedTitle() {
  const selected = cm.getSelection().trim();
  const title = prompt('Optional video title:', selected);
  return title === null ? null : title.trim().replace(/["']/g, '');
}

function insertMarkdownEmbed(kind, source, title, options = '') {
  const label = title ? ` "${title}"` : '';
  const flags = options ? `{${options}}` : '';
  cm.replaceSelection(`@[${kind}](${markdownEmbedTarget(source)}${label})${flags}`);
  cm.focus();
}

function insertYouTubeEmbed() {
  const source = prompt('YouTube URL:', 'https://youtu.be/VIDEO_ID');
  if (!source) return;
  const title = markdownEmbedTitle();
  if (title === null) return;
  insertMarkdownEmbed('youtube', source, title);
}

/* The playback options are four yes/no choices, but the markdown only spells out
 * what differs from the renderer's defaults — a looping clip that plays itself
 * with no controls needs no options at all. So the dialog offers the choices and
 * works out the shortest `{…}` that produces them, showing the line it is about
 * to write so there is no guessing about what the words mean. */
const videoModal = document.getElementById('videoModal');
const videoSrc = document.getElementById('videoSrc');
const videoTitle = document.getElementById('videoTitle');
const videoLoop = document.getElementById('videoLoop');
const videoAutoplay = document.getElementById('videoAutoplay');
const videoMuted = document.getElementById('videoMuted');
const videoControls = document.getElementById('videoControls');
const videoSnippet = document.getElementById('videoSnippet');

function videoEmbedOptions() {
  const loop = videoLoop.checked;
  const autoplay = videoAutoplay.checked;
  const options = [];
  if (!loop) options.push('noloop');
  /* autoplay follows looping unless it is asked for either way */
  if (autoplay !== loop) options.push(autoplay ? 'autoplay' : 'noautoplay');
  if (!autoplay && videoMuted.checked) options.push('muted');
  if (videoControls.checked) options.push('controls');
  return options.join(' ');
}

function videoEmbedMarkdown() {
  const source = videoSrc.value.trim();
  const title = videoTitle.value.trim().replace(/["']/g, '');
  const options = videoEmbedOptions();
  return `@[video](${markdownEmbedTarget(source || 'content/media/demo.mp4')}`
    + `${title ? ` "${title}"` : ''})${options ? `{${options}}` : ''}`;
}

function refreshVideoDialog() {
  /* a clip that plays itself has to be muted, so say so rather than let someone
     pick a combination the browser will refuse */
  videoMuted.disabled = videoAutoplay.checked;
  if (videoAutoplay.checked) videoMuted.checked = true;
  videoSnippet.textContent = videoEmbedMarkdown();
}

function insertVideoEmbed() {
  const selected = cm.getSelection().trim();
  const looksLikeSource = /^(?:https?:\/\/|[\w./-]+\.(?:mp4|webm|ogv|ogg|mov|m4v))/i.test(selected);
  videoSrc.value = looksLikeSource ? selected : '';
  videoTitle.value = looksLikeSource ? '' : selected;
  videoLoop.checked = true;
  videoAutoplay.checked = true;
  videoMuted.checked = true;
  videoControls.checked = false;
  refreshVideoDialog();
  videoModal.classList.add('open');
  videoSrc.focus();
  videoSrc.select();
}

function commitVideoEmbed() {
  const source = videoSrc.value.trim();
  if (!source) { videoSrc.focus(); return; }
  videoModal.classList.remove('open');
  cm.replaceSelection(videoEmbedMarkdown());
  cm.focus();
}

videoModal.addEventListener('change', refreshVideoDialog);
videoModal.addEventListener('input', refreshVideoDialog);
videoModal.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') commitVideoEmbed();
  if (e.key === 'Escape') videoModal.classList.remove('open');
});
document.getElementById('videoGo').addEventListener('click', commitVideoEmbed);
document.getElementById('videoClose').addEventListener('click', () => videoModal.classList.remove('open'));
document.getElementById('videoCancel').addEventListener('click', () => videoModal.classList.remove('open'));

/* ---- Insert → New page… ----
 * Writes a fresh page into the repository, opens it in an editor window of its
 * own, and leaves a `window:` link to it where the cursor was. The page has to
 * exist in the repository before the link makes sense, so this asks for the
 * same fine-grained token File → Commit to website… uses (and reuses it for the
 * rest of the session once it has been accepted).
 *
 * The new window is handed the page's text through its query string rather than
 * being pointed at the file: the commit has only just happened, and the site
 * takes about a minute to rebuild, so fetching it would 404. */
const PAGE_ROOT = 'content/file/';
const pageModal = document.getElementById('pageModal');
const pageName = document.getElementById('pageName');
const pagePath = document.getElementById('pagePath');
const pageToken = document.getElementById('pageToken');
const pageStatus = document.getElementById('pageStatus');
let pagePathEdited = false;   /* stop filling the path in once it is typed in */

function pageSlug(name) {
  return name.trim().toLowerCase().replace(/['’]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'new-page';
}

/* a new page is a sibling of the one being edited, when that is known */
function pageFolder() {
  if (sitePath && sitePath.startsWith('content/') && sitePath.includes('/'))
    return sitePath.slice(0, sitePath.lastIndexOf('/') + 1);
  return PAGE_ROOT;
}

function newPageBody(name) {
  return `---
title: ${name}
style: page
---
# ${name}

This is where the page goes. Write it, then publish it with **Commit to
website…**.
`;
}

/* the same rule the ?repo= query uses: a markdown file, no tricks in the path */
function safeRepoPath(path) {
  const rel = path.replace(/^\/+/, '');
  const parts = rel.split('/');
  return rel && !/[\\?#\0]/.test(rel) && parts.every(part => part && part !== '.' && part !== '..')
    && /\.(?:md|markdown)$/i.test(rel) ? rel : '';
}

function openPageWindow(path, name) {
  const query = `repo=${encodeURIComponent(path)}&new=page&title=${encodeURIComponent(name)}`;
  const id = `app:applications/markdown.html?${query}`;
  if (window.parent !== window) window.parent.postMessage({ type: 'clackos-open-app', id }, location.origin);
  else window.open(new URL(`markdown.html?${query}`, location.href).href, '_blank', 'noopener');
}

async function insertNewPage() {
  try { await getRepoCfg(); } catch (e) { status.textContent = e.message; return; }
  const selected = cm.getSelection().trim();
  pageName.value = selected;
  pagePath.value = selected ? pageFolder() + pageSlug(selected) + '.md' : pageFolder();
  pagePathEdited = false;
  document.getElementById('pageTokenRow').style.display = ghToken ? 'none' : 'flex';
  pageStatus.textContent = `in ${repoCfg.repo} (${repoCfg.branch})`;
  pageModal.classList.add('open');
  (ghToken ? pageName : pageToken).focus();
}

async function createPage() {
  const name = pageName.value.trim();
  const token = ghToken || pageToken.value.trim();
  if (!name) { pageStatus.textContent = 'A page name is needed.'; pageName.focus(); return; }
  if (!token) { pageStatus.textContent = 'A token is needed.'; pageToken.focus(); return; }
  let typed = pagePath.value.trim().replace(/^\/+/, '') || pageFolder();
  if (typed.endsWith('/')) typed += pageSlug(name) + '.md';
  if (!/\.(?:md|markdown)$/i.test(typed)) typed += '.md';
  const path = safeRepoPath(typed);
  if (!path || !path.startsWith('content/')) {
    pageStatus.textContent = 'Pages live in a markdown file under content/.';
    pagePath.focus();
    return;
  }
  pageStatus.textContent = 'Creating…';
  try {
    await putRepoFile(path, newPageBody(name), `Add ${path}`, token, true);
    ghToken = token;             /* keep for the rest of the session */
    pageToken.value = '';
    pageModal.classList.remove('open');
    /* the link this page keeps: window: targets are relative to content/ */
    cm.replaceSelection(`[${name.replace(/\]/g, '\\]')}](`
      + `${markdownLinkTarget('window:' + encodeURI(path.slice('content/'.length)))})`);
    cm.focus();
    openPageWindow(path, name);
    status.textContent = `Created ${path} — link inserted; the page opened in a window of its own.`;
  } catch (e) {
    pageStatus.textContent = e.message;
  }
}

/* the path follows the name until someone types their own */
pageName.addEventListener('input', () => {
  if (!pagePathEdited) pagePath.value = pageFolder() + pageSlug(pageName.value) + '.md';
});
pagePath.addEventListener('input', () => { pagePathEdited = true; });
document.getElementById('pageGo').addEventListener('click', createPage);
document.getElementById('pageClose').addEventListener('click', () => pageModal.classList.remove('open'));
document.getElementById('pageCancel').addEventListener('click', () => pageModal.classList.remove('open'));
pageModal.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') createPage();
  if (e.key === 'Escape') pageModal.classList.remove('open');
});

const insertCommands = {
  'insert-page': insertNewPage,
  'insert-upload': startUpload,
  'insert-window': insertWindowLink,
  'insert-action': insertActionLink,
  'insert-youtube-embed': insertYouTubeEmbed,
  'insert-video-embed': insertVideoEmbed,
  'insert-kicanvas-embed': insertKicanvasEmbed,
  'insert-model-embed': insertModelEmbed,
  'insert-video': insertVideoLink,
  'insert-pdf': insertPDFLink,
  'insert-falstad': insertFalstadLink,
  'insert-circuit': insertCircuitLink,
  'insert-kicad': insertKicadLink,
  'insert-openscad': insertOpenscadLink,
  'insert-openscad-code': insertOpenscadCodeLink,
  'insert-app': insertAppLink
};

/* ---- upload an image/video/audio to the web host ----
 * Sends the file to the endpoint named by "assetUpload" in content/site.json
 * (resolved against the site root, so it is same-origin) with a secret token
 * held only in memory. The server stores it under assets/uploads/ and returns
 * a public URL, which is inserted as the right Markdown for its media type:
 * an image, a video, an inline 3D model, or a plain link. */
const uploadModal = document.getElementById('uploadModal');
const uploadTokenInput = document.getElementById('uploadTokenInput');
const uploadStatus = document.getElementById('uploadStatus');
let uploadToken = null;          /* secret, memory only, per session */
let assetUploadUrl = null;       /* resolved endpoint URL, or '' if unset */
let pendingUpload = null;        /* the File waiting to be sent */

const uploadPicker = document.createElement('input');
uploadPicker.type = 'file';
/* Models have no useful MIME type of their own, so they are listed by
   extension; the server identifies them from their contents either way. */
uploadPicker.accept = 'image/*,video/*,audio/*,.stl,.step,.stp,.obj,.3mf';
uploadPicker.addEventListener('change', () => {
  const f = uploadPicker.files[0];
  uploadPicker.value = '';
  if (f) beginUpload(f);
});

async function getAssetUploadUrl() {
  if (assetUploadUrl !== null) return assetUploadUrl;
  try {
    const site = await (await fetch(contentBase + 'site.json')).json();
    assetUploadUrl = site.assetUpload
      ? new URL(site.assetUpload, new URL('../', contentBase)).href : '';
  } catch { assetUploadUrl = ''; }
  return assetUploadUrl;
}

async function startUpload() {
  const url = await getAssetUploadUrl();
  if (!url) {
    status.textContent = 'Uploads are not configured — add "assetUpload" to content/site.json.';
    return;
  }
  uploadPicker.click();
}

/* Many shared hosts cap uploads around 64 MB (PHP upload_max_filesize /
   post_max_size), so warn before attempting anything larger. */
const UPLOAD_WARN_BYTES = 64 * 1024 * 1024;

function beginUpload(file) {
  if (file.size > UPLOAD_WARN_BYTES) {
    const mb = (file.size / 1048576).toFixed(1);
    if (!confirm(`${file.name} is ${mb} MB. Web hosts often reject uploads larger than 64 MB, so this may fail. Try uploading anyway?`)) {
      status.textContent = 'Upload cancelled — file over 64 MB.';
      return;
    }
  }
  pendingUpload = file;
  if (uploadToken) doUpload();
  else openUploadModal();
}

function openUploadModal() {
  uploadModal.classList.add('open');
  uploadStatus.textContent = pendingUpload ? `Ready: ${pendingUpload.name}` : '';
  uploadTokenInput.focus();
}

async function doUpload() {
  const file = pendingUpload;
  const url = await getAssetUploadUrl();
  if (!file || !url) return;
  const body = new FormData();
  body.append('file', file);
  status.textContent = `Uploading ${file.name}…`;
  uploadStatus.textContent = 'Uploading…';
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'X-Upload-Token': uploadToken }, body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || `server said ${res.status}`);
    insertUploadedMedia(data, file.name);
    uploadModal.classList.remove('open');
    uploadTokenInput.value = '';
    pendingUpload = null;
    status.textContent = `Uploaded ${data.name} — link inserted.`;
  } catch (e) {
    uploadStatus.textContent = e.message;
    status.textContent = `Upload failed: ${e.message}`;
    /* a rejected token is the likely cause — forget it and ask again */
    if (/token/i.test(e.message)) { uploadToken = null; openUploadModal(); }
  }
}

function insertUploadedMedia(data, name) {
  const alt = (name || '').replace(/\.[^.]+$/, '').replace(/\]/g, '\\]') || 'media';
  let snippet;
  /* an uploaded clip gets the ordinary-player treatment — plays once, on
     request, with its sound; Insert → Inline video file… is where the looping
     no-controls animation is chosen deliberately */
  if (data.kind === 'video') snippet = `@[video](${data.url}){noloop controls}`;
  else if (data.kind === 'image') snippet = `![${alt}](${data.url})`;
  else if (data.kind === 'model') snippet = `@[model](${data.url} "${alt.replace(/"/g, '')}")`;
  else snippet = `[${alt}](${data.url})`;
  cm.replaceSelection(snippet + '\n');
  cm.focus();
}

document.getElementById('uploadTokenGo').addEventListener('click', () => {
  const t = uploadTokenInput.value.trim();
  if (!t) { uploadStatus.textContent = 'Enter your upload token.'; return; }
  uploadToken = t;
  doUpload();
});
/* Closing only happens through the title bar × or Cancel: a stray click on the
 * backdrop used to bin a half-typed token. */
document.getElementById('uploadClose').addEventListener('click', () => uploadModal.classList.remove('open'));
document.getElementById('uploadCancel').addEventListener('click', () => uploadModal.classList.remove('open'));
uploadModal.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') document.getElementById('uploadTokenGo').click();
});

/* The shared File Manager exposes the complete repository and keeps legacy
 * media hosted on the live website on a separate read-only drive. Markdown
 * files open as documents; every other file is inserted as a suitable link. */
const contentBase = new URL('../../content/', location.href).href;

function markdownForFile(item) {
  const label = item.name.replace(/\.[^.]+$/, '').replace(/[\[\]]/g, '');
  const target = item.drive === 'github' ? item.path : item.url;
  if (item.kind === 'image') return `![${label}](${target})`;
  if (item.kind === 'video') return `@[video](${target} "${label.replace(/"/g, '')}"){noloop controls}`;
  if (item.kind === 'model') return `@[model](${target} "${label.replace(/"/g, '')}")`;
  return `[${label}](${target})`;
}

async function useManagedFile(item) {
  if (item.drive === 'github' && item.kind === 'markdown') {
    const res = await fetch(item.downloadUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Could not open ${item.path} (${res.status})`);
    mde.value(await res.text());
    handle = null;
    fileName = item.name;
    sitePath = item.path;
    dirty = false;
    show();
    status.textContent = `${item.path} — opened from GitHub; File → Commit to website… publishes your edit`;
    return;
  }
  mde.codemirror.replaceSelection(markdownForFile(item));
  mde.codemirror.focus();
  status.textContent = `Inserted ${item.name} from ${item.drive === 'github' ? 'GitHub' : 'Website Media'}`;
}

async function openRepositoryMarkdown(path) {
  const encodedPath = path.split('/').map(encodeURIComponent).join('/');
  const response = await fetch(new URL(encodedPath, new URL('../../', location.href)), { cache: 'no-store' });
  if (!response.ok) throw new Error(`Could not open ${path} (${response.status})`);
  mde.value(await response.text()); handle = null; fileName = path.split('/').pop(); sitePath = path;
  dirty = false; show(); status.textContent = `Opened ${path}`; mde.codemirror.focus();
}

function openSiteBrowser() {
  window.ClackOSFileManager.open({
    title: 'Open from website',
    accept: () => true,
    actionFor: item => item.drive === 'github' && item.kind === 'markdown' ? 'Open' : 'Insert',
    onSelect: useManagedFile
  });
}

/* ---- commit to the repo via GitHub's contents API ---- */
const commitModal = document.getElementById('commitModal');
const commitPath = document.getElementById('commitPath');
const commitMsg = document.getElementById('commitMsg');
const commitToken = document.getElementById('commitToken');
const commitStatus = document.getElementById('commitStatus');

async function getRepoCfg() {
  if (repoCfg) return repoCfg;
  const site = await (await fetch(contentBase + 'site.json')).json();
  if (!site.repo) throw new Error('no "repo" configured in content/site.json');
  repoCfg = { repo: site.repo, branch: site.branch || 'main' };
  return repoCfg;
}

async function openCommitDialog() {
  try { await getRepoCfg(); } catch (e) { status.textContent = e.message; return; }
  commitPath.value = sitePath || ('content/file/blog/' + fileName);
  commitMsg.value = (sitePath ? 'Update ' : 'Add ') + fileName;
  document.getElementById('tokenRow').style.display = ghToken ? 'none' : 'flex';
  commitStatus.textContent = `to ${repoCfg.repo} (${repoCfg.branch})`;
  commitModal.classList.add('open');
  (ghToken ? commitMsg : commitToken).focus();
}

const b64utf8 = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

/* One write to the repository through GitHub's contents API. `mustBeNew` is for
 * files that are supposed not to exist yet (a new page), so that a name already
 * in use is reported rather than quietly overwritten. */
async function putRepoFile(path, text, message, token, mustBeNew = false) {
  const api = `https://api.github.com/repos/${repoCfg.repo}/contents/${path}`;
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json'
  };
  /* current sha (absent for a new file); also our conflict check */
  let sha = null;
  const cur = await fetch(`${api}?ref=${encodeURIComponent(repoCfg.branch)}`, { headers });
  if (cur.status === 200) sha = (await cur.json()).sha;
  else if (cur.status === 401) throw new Error('token was rejected (401)');
  else if (cur.status !== 404) throw new Error(`could not check current file (${cur.status})`);
  if (sha && mustBeNew) throw new Error(`${path} already exists — pick another name`);

  const res = await fetch(api, {
    method: 'PUT',
    headers,
    body: JSON.stringify({
      message,
      content: b64utf8(text),
      branch: repoCfg.branch,
      ...(sha ? { sha } : {})
    })
  });
  if (res.status === 409) throw new Error('conflict — the file changed on GitHub since you opened it');
  if (!res.ok) throw new Error(`GitHub said ${res.status}: ${(await res.json()).message || ''}`);
  return res.json();
}

async function doCommit() {
  const path = commitPath.value.trim().replace(/^\/+/, '');
  const msg = commitMsg.value.trim() || 'Update ' + fileName;
  const token = ghToken || commitToken.value.trim();
  if (!path) { commitStatus.textContent = 'A repo path is needed.'; return; }
  if (!token) { commitStatus.textContent = 'A token is needed.'; return; }
  commitStatus.textContent = 'Committing…';
  try {
    const out = await putRepoFile(path, mde.value(), msg, token);
    ghToken = token;             /* keep for the rest of the session */
    commitToken.value = '';
    sitePath = path;
    dirty = false;
    commitModal.classList.remove('open');
    show();
    status.textContent = `Committed ${out.commit.sha.slice(0, 7)} — the site rebuilds in about a minute.`;
  } catch (e) {
    commitStatus.textContent = e.message;
  }
}

document.getElementById('commitGo').addEventListener('click', doCommit);
document.getElementById('commitClose').addEventListener('click', () => commitModal.classList.remove('open'));
document.getElementById('commitCancel').addEventListener('click', () => commitModal.classList.remove('open'));
commitModal.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') doCommit(); });

/* menu */
const rms = document.querySelectorAll('.rm');
const closeRm = () => rms.forEach(m => m.classList.remove('open'));
rms.forEach(m => {
  m.querySelector(':scope > button').addEventListener('click', e => {
    e.stopPropagation();
    const was = m.classList.contains('open');
    closeRm();
    if (!was) m.classList.add('open');
  });
});
document.querySelector('.rm-bar').addEventListener('click', e => {
  const cmd = e.target.closest('[data-cmd]');
  if (!cmd) return;
  closeRm();
  const command = ({ new: newFile, open: openFile, site: openSiteBrowser, commit: openCommitDialog,
    save: () => saveFile(false), saveas: () => saveFile(true), ...insertCommands })[cmd.dataset.cmd];
  if (command) command();
});
document.addEventListener('click', closeRm);

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile(e.shiftKey);
  }
});

/* drag and drop */
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  /* an image/video/audio/3D-model file is uploaded to the web host; anything
     else is treated as text and loaded into the editor. Models are matched by
     extension because the browser reports no type for most of them. */
  if (/^(image|video|audio)\//.test(f.type) || /\.(?:stl|step|stp|obj|3mf)$/i.test(f.name)) {
    const url = await getAssetUploadUrl();
    if (!url) { status.textContent = 'Dropped media, but uploads are not configured in content/site.json.'; return; }
    beginUpload(f);
    return;
  }
  mde.value(await f.text());
  handle = null;
  fileName = f.name;
  dirty = false;
  show();
});

show();

/* `view=rendered` (the File Manager's "Markdown Viewer" association) opens the
 * file as a rendered page; the toolbar's preview button switches back to the
 * source at any point. */
function showRendered() {
  if (!mde.isPreviewActive()) EasyMDE.togglePreview(mde);
}

/* The other half of Insert → New page…: the page has just been committed but
 * the site has not rebuilt yet, so its text is written here from the name it
 * was given — the same text that was committed — rather than fetched. It knows
 * its repo path, so File → Commit to website… updates it from the first edit. */
function newPage(path, name) {
  const title = name.trim() || path.split('/').pop().replace(/\.(?:md|markdown)$/i, '');
  mde.value(newPageBody(title));
  handle = null;
  sitePath = path;
  fileName = path.split('/').pop();
  dirty = false;
  show();
  status.textContent = `${path} — new page, already committed; Commit to website… publishes your edits.`;
  /* land the cursor on the heading rather than in the frontmatter */
  mde.codemirror.setCursor({ line: 4, ch: 2 + title.length });
  mde.codemirror.focus();
}

/* ---- open a file passed in the query string ----
 * `open` remains content-relative for the desktop's File → Edit command;
 * `repo` is a repository-root path supplied by the File Manager;
 * `new=post` starts a dated blog post instead of opening anything;
 * `new=page` with a `repo` path fills in a page just created by another
 * editor window instead of fetching it. */
{
  const params = new URLSearchParams(location.search);
  const repositoryPath = params.get('repo'); const contentPath = params.get('open');
  const rendered = params.get('view') === 'rendered';
  const requested = repositoryPath || (contentPath ? `content/${contentPath.replace(/^content\//, '')}` : '');
  if (params.get('new') === 'post' && !requested) {
    newPost();
    if (rendered) showRendered();
  } else if (requested) {
    const rel = safeRepoPath(requested);
    if (!rel) status.textContent = 'Refused to open an unexpected path.';
    else if (params.get('new') === 'page') {
      newPage(rel, params.get('title') || '');
      if (rendered) showRendered();
    } else
      openRepositoryMarkdown(rel)
        .then(() => { if (rendered) showRendered(); })
        .catch(error => { status.textContent = error.message; });
  } else if (rendered) showRendered();
}
})();
</script>
</body>
