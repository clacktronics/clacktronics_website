<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Markdown Editor — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Dosis:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../vendor/easymde/easymde.min.css">
<style>
.app { height: 100%; }
.md-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; }
.md-wrap .EasyMDEContainer {
  flex: 1; min-height: 0; position: relative;
  display: flex; flex-direction: column;
}
.md-wrap .editor-toolbar { flex: none; }
/* the editor and the side-by-side preview live in a row of their own
   (built in JS after init), so the toolbar keeps its natural height */
.mde-row { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.mde-row .CodeMirror { flex: 1; min-width: 0; }
.mde-row .CodeMirror-sided { flex: none !important; width: 50% !important; }
.editor-preview-side {
  position: static !important; flex: none; width: 50%; height: auto;
  min-height: 0; overflow: auto;
}

/* ---- ClackOS skin for EasyMDE ---- */
.EasyMDEContainer .CodeMirror {
  flex: 1; min-height: 0;
  border: 1px solid var(--ink); border-radius: 0 0 8px 8px;
  background: var(--paper); color: var(--ink-soft);
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.7;
}
.CodeMirror-cursor { border-left: 2px solid var(--leaf-deep) !important; }
.CodeMirror-selected { background: rgba(79, 174, 125, 0.25) !important; }
.CodeMirror-focused .CodeMirror-selected { background: rgba(79, 174, 125, 0.35) !important; }
.cm-s-easymde .cm-header { color: var(--heading); }
.cm-s-easymde .cm-quote { color: var(--sage); font-style: italic; }
.cm-s-easymde .cm-link, .cm-s-easymde .cm-url { color: var(--leaf-deep); }
.cm-s-easymde .cm-comment { background: var(--paper-deep); color: var(--leaf-deep); border-radius: 3px; }
.cm-s-easymde .cm-hr { color: var(--paper-line); }

.editor-toolbar {
  border: 1px solid var(--ink); border-bottom: none; border-radius: 8px 8px 0 0;
  background: var(--paper-deep); opacity: 1;
}
.editor-toolbar button {
  color: var(--control-text) !important; border-radius: 6px;
  font-family: 'IBM Plex Mono', monospace;
}
.editor-toolbar button:hover, .editor-toolbar button.active {
  background: var(--ink); border-color: var(--ink);
}
.editor-toolbar button:hover .pixel-icon, .editor-toolbar button.active .pixel-icon { color: var(--menu-text); }
.editor-toolbar i.separator { border-left: 1px solid var(--paper-line); border-right: none; }
.editor-toolbar button i.fa { display: none; }
.editor-toolbar button .pixel-icon { width: 17px; height: 17px; color: var(--control-text); }

/* preview panes rendered like ClackOS pages */
.editor-preview, .editor-preview-side {
  background: var(--paper); color: var(--ink-soft);
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.85;
  padding: 24px 28px;
}
.editor-preview-side { border: 1px solid var(--ink); border-left: none; border-radius: 0 0 8px 0; }
.editor-preview h1, .editor-preview-side h1,
.editor-preview h2, .editor-preview-side h2 {
  font-family: 'Dosis', sans-serif; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--heading); margin: 18px 0 10px;
}
.editor-preview h1, .editor-preview-side h1 { font-size: 26px; }
.editor-preview h2, .editor-preview-side h2 { font-size: 20px; }
.editor-preview h3, .editor-preview-side h3 { color: var(--leaf-deep); margin: 14px 0 8px; }
.editor-preview p, .editor-preview-side p { margin-bottom: 12px; }
.editor-preview a, .editor-preview-side a { color: var(--leaf-deep); }
.editor-preview code, .editor-preview-side code {
  background: var(--paper-deep); color: var(--leaf-deep); padding: 1px 5px; border-radius: 4px;
}
.editor-preview pre, .editor-preview-side pre {
  background: var(--ink); color: var(--menu-text); padding: 12px 14px;
  border-radius: 8px; overflow-x: auto; margin-bottom: 12px;
}
.editor-preview pre code, .editor-preview-side pre code { background: none; color: inherit; padding: 0; }
.editor-preview blockquote, .editor-preview-side blockquote {
  border-left: 3px solid var(--leaf-deep); padding-left: 14px; color: var(--sage);
  font-style: italic; margin: 0 0 12px;
}
.editor-preview table, .editor-preview-side table { border-collapse: collapse; margin-bottom: 12px; }
.editor-preview th, .editor-preview td, .editor-preview-side th, .editor-preview-side td {
  border: 1px solid var(--paper-line); padding: 6px 10px;
}
.editor-preview th, .editor-preview-side th { background: var(--paper-deep); color: var(--strong-text); }
.editor-preview ul, .editor-preview ol, .editor-preview-side ul, .editor-preview-side ol {
  margin: 0 0 12px 22px;
}
.editor-preview hr, .editor-preview-side hr { border: none; border-top: 1px solid var(--ink); margin: 16px 0; }
.editor-preview img, .editor-preview-side img { max-width: 100%; border: 1px solid var(--ink); border-radius: 6px; }

.md-status { padding: 6px 16px 12px; }
body.dragging .md-wrap { outline: 3px dashed var(--leaf-deep); outline-offset: -8px; }

/* ---- "open from website" browser ---- */
.site-modal {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: rgba(9, 20, 13, 0.35);
  align-items: center; justify-content: center;
}
.site-modal.open { display: flex; }
.site-box {
  width: min(560px, 92vw); max-height: 80vh; display: flex; flex-direction: column;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
  box-shadow: 8px 8px 0 color-mix(in srgb, var(--shadow) 35%, transparent);
}
.site-box header {
  background: var(--ink); color: var(--menu-text); padding: 9px 14px;
  border-radius: 8px 8px 0 0; font-size: 12.5px; display: flex; justify-content: space-between;
}
.site-box header button { all: unset; cursor: pointer; color: var(--menu-text); padding: 0 4px; }
.site-box .site-filter { margin: 12px 14px 0; }
.site-box .site-filter input { width: 100%; }
.site-list { overflow-y: auto; padding: 10px 6px 12px; }
.site-list .grp {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--leaf-deep); padding: 10px 10px 4px;
}
.site-list button {
  all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
  padding: 6px 12px; font-size: 12.5px; color: var(--control-text); border-radius: 6px;
}
.site-list button:hover { background: var(--ink); color: var(--menu-text); }
.site-list button .path { color: var(--sage); font-size: 11px; margin-left: 8px; }
.site-list button:hover .path { color: var(--menu-dim, #8fcaa8); }
.commit-form { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.commit-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--control-text); font-weight: 500; }
.commit-form .hint { font-weight: 400; font-size: 11px; color: var(--sage); }
.commit-form input { width: 100%; }
.commit-actions { display: flex; align-items: center; gap: 14px; }
.rm-dd .sep { height: 1px; background: var(--paper-line); margin: 6px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="rm-bar">
    <div class="rm"><button>File</button><div class="rm-dd">
      <button data-cmd="new"><span class="pixel-icon" data-icon="file" aria-hidden="true"></span>New</button>
      <button data-cmd="open"><span class="pixel-icon" data-icon="folder" aria-hidden="true"></span>Open&hellip;</button>
      <button data-cmd="site"><span class="pixel-icon" data-icon="open" aria-hidden="true"></span>Open from website&hellip;</button>
      <button data-cmd="save"><span class="pixel-icon" data-icon="save" aria-hidden="true"></span>Save</button>
      <button data-cmd="saveas"><span class="pixel-icon" data-icon="download" aria-hidden="true"></span>Save As&hellip;</button>
      <div class="sep"></div>
      <button data-cmd="commit"><span class="pixel-icon" data-icon="upload" aria-hidden="true"></span>Commit to website&hellip;</button>
    </div></div>
    <div class="rm"><button>Insert</button><div class="rm-dd">
      <button data-cmd="insert-window"><span class="pixel-icon" data-icon="app-windows" aria-hidden="true"></span>Markdown window link&hellip;</button>
      <button data-cmd="insert-action"><span class="pixel-icon" data-icon="zap" aria-hidden="true"></span>Desktop action link&hellip;</button>
      <div class="sep"></div>
      <button data-cmd="insert-youtube-embed"><span class="pixel-icon" data-icon="video" aria-hidden="true"></span>Inline YouTube video&hellip;</button>
      <button data-cmd="insert-video-embed"><span class="pixel-icon" data-icon="video" aria-hidden="true"></span>Inline video file&hellip;</button>
      <div class="sep"></div>
      <button data-cmd="insert-video"><span class="pixel-icon" data-icon="video" aria-hidden="true"></span>Video Lab file link&hellip;</button>
      <button data-cmd="insert-pdf"><span class="pixel-icon" data-icon="file-text" aria-hidden="true"></span>PDF Reader file link&hellip;</button>
      <button data-cmd="insert-falstad"><span class="pixel-icon" data-icon="circuit-board" aria-hidden="true"></span>Falstad exported link&hellip;</button>
      <button data-cmd="insert-circuit"><span class="pixel-icon" data-icon="circuit-board" aria-hidden="true"></span>Falstad circuit file link&hellip;</button>
      <button data-cmd="insert-kicad"><span class="pixel-icon" data-icon="circuit-board" aria-hidden="true"></span>KiCad file link&hellip;</button>
      <div class="sep"></div>
      <button data-cmd="insert-app"><span class="pixel-icon" data-icon="app-windows" aria-hidden="true"></span>Application link&hellip;</button>
    </div></div>
  </div>
  <div class="md-wrap">
    <textarea id="ed"></textarea>
  </div>
  <p class="app-status md-status" id="status">untitled.md</p>
</div>

<div class="site-modal" id="commitModal">
  <div class="site-box">
    <header><span>Commit to website</span><button id="commitClose" aria-label="Close"><span class="pixel-icon" data-icon="close" aria-hidden="true"></span></button></header>
    <div class="commit-form">
      <label>Repo path
        <input type="text" id="commitPath" spellcheck="false">
      </label>
      <label>Commit message
        <input type="text" id="commitMsg" spellcheck="false">
      </label>
      <label id="tokenRow">Fine-grained access token <span class="hint">(Contents read/write on this repo only — kept in memory, forgotten when the tab closes)</span>
        <input type="password" id="commitToken" autocomplete="off">
      </label>
      <div class="commit-actions">
        <button class="btn primary" id="commitGo"><span class="pixel-icon" data-icon="upload" aria-hidden="true"></span>Commit</button>
        <span class="app-status" id="commitStatus"></span>
      </div>
    </div>
  </div>
</div>

<div class="site-modal" id="siteModal">
  <div class="site-box">
    <header><span>Open from website</span><button id="siteClose" aria-label="Close"><span class="pixel-icon" data-icon="close" aria-hidden="true"></span></button></header>
    <div class="site-filter"><input type="text" id="siteFilter" placeholder="Filter…" aria-label="Filter files"></div>
    <div class="site-list" id="siteList"></div>
  </div>
</div>

<script src="../../vendor/easymde/easymde.min.js"></script>
<script>
(() => {
const status = document.getElementById('status');
let fileName = 'untitled.md';
let handle = null;      /* FileSystemFileHandle when the browser supports it */
let dirty = false;
let sitePath = null;    /* repo path when opened via "Open from website" */
let ghToken = null;     /* fine-grained PAT, memory only, per session */
let repoCfg = null;     /* { repo, branch } from content/site.json */

const mde = new EasyMDE({
  element: document.getElementById('ed'),
  autofocus: true,
  spellChecker: false,
  nativeSpellcheck: true,
  autoDownloadFontAwesome: false,
  status: false,
  sideBySideFullscreen: false,
  tabSize: 4,
  toolbar: ['bold', 'italic', 'strikethrough', '|', 'heading', 'quote', 'code', '|',
            'unordered-list', 'ordered-list', 'table', 'horizontal-rule', '|',
            'link', 'image', {
              name: 'video-embed',
              action: insertVideoEmbed,
              className: 'video-embed',
              title: 'Insert inline video'
            }, '|', 'preview', 'side-by-side', 'fullscreen', '|',
            'undo', 'redo'],
  initialValue: `# New document

Write **markdown** here — headings, *emphasis*, ~~strikethrough~~, [links](https://clacktronics.co.uk),
\`inline code\`, and:

- lists
- of
- things

1. or numbered
2. ones

> blockquotes too

| tables | work |
|--------|------|
| yes    | fine |

\`\`\`c
// fenced code blocks
int main(void) { return 0; }
\`\`\`

Use the toolbar or standard shortcuts (Ctrl+B, Ctrl+I…). The preview and split-view buttons change the editor layout. Ctrl+S saves.
`
});

const toolbarIcons = {
  bold: 'letter-b', italic: 'letter-i', strikethrough: 'letter-s',
  heading: 'heading', quote: 'quote-text-inline', code: 'terminal',
  'unordered-list': 'bulletlist', 'ordered-list': 'list-box', table: 'grid-3x3',
  'horizontal-rule': 'minus-box', link: 'link', image: 'image', 'video-embed': 'video', preview: 'eye',
  'side-by-side': 'align-horizontal-distribute-center', fullscreen: 'expand',
  undo: 'undo', redo: 'reload'
};
Object.entries(toolbarIcons).forEach(([buttonClass, icon]) => {
  const button = document.querySelector(`.editor-toolbar button.${buttonClass}`);
  if (!button) return;
  const marker = document.createElement('span');
  marker.className = 'pixel-icon icon-only';
  marker.dataset.icon = icon;
  marker.setAttribute('aria-hidden', 'true');
  button.appendChild(marker);
});

/* move the editor + side preview into their own flex row so the
   toolbar above them keeps a fixed height */
{
  const container = mde.codemirror.getWrapperElement().parentElement;
  const row = document.createElement('div');
  row.className = 'mde-row';
  container.appendChild(row);
  row.appendChild(mde.codemirror.getWrapperElement());
  const side = container.querySelector('.editor-preview-side');
  if (side) row.appendChild(side);
  mde.codemirror.refresh();
}

const show = () => {
  status.textContent = fileName + (dirty ? ' — unsaved changes' : '') +
    (handle ? '' : '  (saving downloads the file)');
  document.title = fileName + ' — Markdown Editor — ClackOS';
};
mde.codemirror.on('change', () => { if (!dirty) { dirty = true; show(); } });

const fsAccess = 'showOpenFilePicker' in window;
const mdTypes = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }];

async function openFile() {
  if (fsAccess) {
    try {
      const [h] = await window.showOpenFilePicker({ types: mdTypes });
      const f = await h.getFile();
      mde.value(await f.text());
      handle = h;
      sitePath = null;
      fileName = f.name;
      dirty = false;
      show();
    } catch {}
    return;
  }
  picker.click();
}

const picker = document.createElement('input');
picker.type = 'file';
picker.accept = '.md,.markdown,.txt,text/markdown,text/plain';
picker.addEventListener('change', async () => {
  const f = picker.files[0];
  picker.value = '';
  if (!f) return;
  mde.value(await f.text());
  handle = null;
  fileName = f.name;
  dirty = false;
  show();
});

async function writeTo(h) {
  const w = await h.createWritable();
  await w.write(mde.value());
  await w.close();
}

async function saveFile(as) {
  if (fsAccess) {
    try {
      if (as || !handle)
        handle = await window.showSaveFilePicker({ types: mdTypes, suggestedName: fileName });
      await writeTo(handle);
      fileName = (await handle.getFile()).name;
      dirty = false;
      show();
    } catch {}
    return;
  }
  /* fallback: download */
  if (as) {
    const n = prompt('Save as:', fileName);
    if (!n) return;
    fileName = /\.(md|markdown|txt)$/i.test(n) ? n : n + '.md';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([mde.value()], { type: 'text/markdown' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  dirty = false;
  show();
}

function newFile() {
  mde.value('');
  handle = null;
  sitePath = null;
  fileName = 'untitled.md';
  dirty = false;
  show();
}

/* ---- ClackOS links inserted into Markdown ---- */
const cm = mde.codemirror;

function linkLabel(fallback) {
  const selected = cm.getSelection().trim();
  if (selected) return selected.replace(/\]/g, '\\]');
  const label = prompt('Link text:', fallback);
  return label ? label.replace(/\]/g, '\\]') : null;
}

function insertClackLink(href, fallbackLabel) {
  const label = linkLabel(fallbackLabel);
  if (!label) return;
  cm.replaceSelection(`[${label}](${href})`);
  cm.focus();
}

function encodePart(value) {
  return encodeURIComponent(value.trim());
}

function siteFileName(value, folder) {
  const path = value.trim().replace(/\\/g, '/');
  const marker = `/applications/${folder}/`;
  const at = path.toLowerCase().lastIndexOf(marker);
  return (at >= 0 ? path.slice(at + marker.length) : path.replace(/^\/+/, '')).replace(/^.*\//, '');
}

function insertWindowLink() {
  const path = prompt('Markdown path under content/ (for example file/catalogue.md):', 'file/catalogue.md');
  if (path) insertClackLink('window:' + encodeURI(path.trim()).replace(/[()]/g, c => '%' + c.charCodeAt(0).toString(16)), 'Open page');
}

function insertActionLink() {
  const action = prompt('Desktop action: close-front, tidy, toggle-taskbar, copy, or restart', 'tidy');
  if (action) insertClackLink('action:' + encodePart(action), action === 'tidy' ? 'Tidy windows' : 'Run action');
}

function markdownEmbedTarget(value) {
  return value.trim().replace(/\s/g, '%20').replace(/[()]/g, character =>
    '%' + character.charCodeAt(0).toString(16).toUpperCase());
}

function markdownEmbedTitle() {
  const selected = cm.getSelection().trim();
  const title = prompt('Optional video title:', selected);
  return title === null ? null : title.trim().replace(/["']/g, '');
}

function insertMarkdownEmbed(kind, source, title, options = '') {
  const label = title ? ` "${title}"` : '';
  const flags = options ? `{${options}}` : '';
  cm.replaceSelection(`@[${kind}](${markdownEmbedTarget(source)}${label})${flags}`);
  cm.focus();
}

function insertYouTubeEmbed() {
  const source = prompt('YouTube URL:', 'https://youtu.be/VIDEO_ID');
  if (!source) return;
  const title = markdownEmbedTitle();
  if (title === null) return;
  insertMarkdownEmbed('youtube', source, title);
}

function insertVideoEmbed() {
  const source = prompt('Video URL or path from the site root:', 'content/media/demo.mp4');
  if (!source) return;
  const title = markdownEmbedTitle();
  if (title === null) return;
  const value = prompt('Optional playback settings: controls, noloop, or both:', '');
  if (value === null) return;
  const options = [...new Set(value.toLowerCase().split(/[\s,]+/).filter(option =>
    ['controls', 'noloop'].includes(option)))].join(' ');
  insertMarkdownEmbed('video', source, title, options);
}

function insertVideoLink() {
  const source = prompt('Video URL or path from the site root (for example content/media/demo.mp4):', 'content/media/demo.mp4');
  if (source) insertClackLink(`app:applications/video/index.html?src=${encodePart(source)}`, 'Open in Video Lab');
}

function insertPDFLink() {
  const source = prompt('PDF URL or path from the site root (for example content/files/manual.pdf):', 'content/files/manual.pdf');
  if (source) insertClackLink(`app:applications/pdf-reader/index.html?file=${encodePart(source)}`, 'Open in PDF Reader');
}

function insertFalstadLink() {
  const value = prompt('Paste a Falstad exported link, its ?ctz= value, or the compressed data:');
  if (!value) return;
  let ctz = value.trim();
  try {
    const parsed = new URL(ctz, location.href);
    ctz = parsed.searchParams.get('ctz') || ctz;
  } catch {}
  if (/^\??ctz=/i.test(ctz)) ctz = ctz.replace(/^\??ctz=/i, '').split('&')[0];
  insertClackLink(`app:applications/circuit.html?ctz=${encodePart(ctz)}`, 'Open circuit simulator');
}

function insertCircuitLink() {
  const file = prompt('Circuit file under content/applications/circuits/:', 'example-lrc.txt');
  if (file) insertClackLink(`app:applications/circuit.html?circuit=${encodePart(siteFileName(file, 'circuits'))}`, 'Open circuit simulator');
}

function insertKicadLink() {
  const file = prompt('KiCad file under content/applications/kicad/:', 'example.kicad_sch');
  if (file) insertClackLink(`app:applications/kicad.html?file=${encodePart(siteFileName(file, 'kicad'))}`, 'Open in KiCad Viewer');
}

function insertAppLink() {
  const page = prompt('Registered application page under content/ (for example applications/video/index.html):', 'applications/video/index.html');
  if (!page) return;
  const options = prompt('Optional query string, without the leading ?:', '') || '';
  const cleanPage = page.trim().replace(/^content\//, '').replace(/^\/+/, '');
  insertClackLink(`app:${cleanPage}${options.trim() ? '?' + options.trim().replace(/^\?/, '') : ''}`, 'Open application');
}

const insertCommands = {
  'insert-window': insertWindowLink,
  'insert-action': insertActionLink,
  'insert-youtube-embed': insertYouTubeEmbed,
  'insert-video-embed': insertVideoEmbed,
  'insert-video': insertVideoLink,
  'insert-pdf': insertPDFLink,
  'insert-falstad': insertFalstadLink,
  'insert-circuit': insertCircuitLink,
  'insert-kicad': insertKicadLink,
  'insert-app': insertAppLink
};

/* ---- open markdown straight from the website ----
 * a static site can't list directories, so files are discovered the same
 * way the desktop finds them: site.json -> each menu.json, plus the blog
 * index's links for the posts */
const contentBase = new URL('../../content/', location.href).href;
const siteModal = document.getElementById('siteModal');
const siteList = document.getElementById('siteList');
const siteFilter = document.getElementById('siteFilter');
let siteFiles = null;

async function listSiteFiles() {
  if (siteFiles) return siteFiles;
  const files = [];
  const site = await (await fetch(contentBase + 'site.json')).json();
  for (const menu of site.menus) {
    try {
      const m = await (await fetch(`${contentBase}${menu}/menu.json`)).json();
      /* walk nested submenus so items grouped under Open/categories still count */
      const walk = items => {
        for (const it of items || []) {
          if (it.md) files.push(`${menu}/${it.md}`);
          if (it.items) walk(it.items);
        }
      };
      walk(m.items);
    } catch {}
  }
  try {
    const idx = await (await fetch(contentBase + 'file/blog.md')).text();
    for (const m of idx.matchAll(/window:file\/(blog\/[^)\s]+\.md)/g))
      files.push('file/' + m[1]);
  } catch {}
  siteFiles = [...new Set(files)];
  return siteFiles;
}

function renderSiteList(files, filter) {
  siteList.innerHTML = '';
  const groups = new Map();
  for (const f of files) {
    if (filter && !f.toLowerCase().includes(filter.toLowerCase())) continue;
    const grp = f.split('/').slice(0, -1).join('/');
    if (!groups.has(grp)) groups.set(grp, []);
    groups.get(grp).push(f);
  }
  for (const [grp, list] of groups) {
    const h = document.createElement('div');
    h.className = 'grp';
    h.textContent = 'content/' + grp;
    siteList.appendChild(h);
    for (const f of list) {
      const b = document.createElement('button');
      const name = f.split('/').pop();
      b.innerHTML = `${name}<span class="path">${f}</span>`;
      b.addEventListener('click', () => openSiteFile(f));
      siteList.appendChild(b);
    }
  }
  if (!siteList.children.length) {
    const d = document.createElement('div');
    d.className = 'grp';
    d.textContent = 'no matches';
    siteList.appendChild(d);
  }
}

async function openSiteBrowser() {
  siteModal.classList.add('open');
  siteFilter.value = '';
  siteList.textContent = 'Loading…';
  try {
    renderSiteList(await listSiteFiles(), '');
    siteFilter.focus();
  } catch (e) {
    siteList.textContent = 'Could not list site files: ' + e.message;
  }
}

async function openSiteFile(path) {
  try {
    const res = await fetch(contentBase + path);
    if (!res.ok) throw new Error(res.status);
    mde.value(await res.text());
    handle = null;
    fileName = path.split('/').pop();
    sitePath = 'content/' + path;
    dirty = false;
    siteModal.classList.remove('open');
    show();
    status.textContent = `${path} — opened from the website; File → Commit to website… publishes your edit`;
  } catch (e) {
    status.textContent = `Could not open ${path} (${e.message}).`;
  }
}

/* ---- commit to the repo via GitHub's contents API ---- */
const commitModal = document.getElementById('commitModal');
const commitPath = document.getElementById('commitPath');
const commitMsg = document.getElementById('commitMsg');
const commitToken = document.getElementById('commitToken');
const commitStatus = document.getElementById('commitStatus');

async function getRepoCfg() {
  if (repoCfg) return repoCfg;
  const site = await (await fetch(contentBase + 'site.json')).json();
  if (!site.repo) throw new Error('no "repo" configured in content/site.json');
  repoCfg = { repo: site.repo, branch: site.branch || 'main' };
  return repoCfg;
}

async function openCommitDialog() {
  try { await getRepoCfg(); } catch (e) { status.textContent = e.message; return; }
  commitPath.value = sitePath || ('content/file/blog/' + fileName);
  commitMsg.value = (sitePath ? 'Update ' : 'Add ') + fileName;
  document.getElementById('tokenRow').style.display = ghToken ? 'none' : 'flex';
  commitStatus.textContent = `to ${repoCfg.repo} (${repoCfg.branch})`;
  commitModal.classList.add('open');
  (ghToken ? commitMsg : commitToken).focus();
}

const b64utf8 = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

async function doCommit() {
  const path = commitPath.value.trim().replace(/^\/+/, '');
  const msg = commitMsg.value.trim() || 'Update ' + fileName;
  const token = ghToken || commitToken.value.trim();
  if (!path) { commitStatus.textContent = 'A repo path is needed.'; return; }
  if (!token) { commitStatus.textContent = 'A token is needed.'; return; }
  const api = `https://api.github.com/repos/${repoCfg.repo}/contents/${path}`;
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json'
  };
  commitStatus.textContent = 'Committing…';
  try {
    /* current sha (absent for a new file); also our conflict check */
    let sha = null;
    const cur = await fetch(`${api}?ref=${encodeURIComponent(repoCfg.branch)}`, { headers });
    if (cur.status === 200) sha = (await cur.json()).sha;
    else if (cur.status === 401) throw new Error('token was rejected (401)');
    else if (cur.status !== 404) throw new Error(`could not check current file (${cur.status})`);

    const res = await fetch(api, {
      method: 'PUT',
      headers,
      body: JSON.stringify({
        message: msg,
        content: b64utf8(mde.value()),
        branch: repoCfg.branch,
        ...(sha ? { sha } : {})
      })
    });
    if (res.status === 409) throw new Error('conflict — the file changed on GitHub since you opened it');
    if (!res.ok) throw new Error(`GitHub said ${res.status}: ${(await res.json()).message || ''}`);
    const out = await res.json();
    ghToken = token;             /* keep for the rest of the session */
    commitToken.value = '';
    sitePath = path;
    dirty = false;
    commitModal.classList.remove('open');
    show();
    status.textContent = `Committed ${out.commit.sha.slice(0, 7)} — the site rebuilds in about a minute.`;
  } catch (e) {
    commitStatus.textContent = e.message;
  }
}

document.getElementById('commitGo').addEventListener('click', doCommit);
document.getElementById('commitClose').addEventListener('click', () => commitModal.classList.remove('open'));
commitModal.addEventListener('click', e => { if (e.target === commitModal) commitModal.classList.remove('open'); });
commitModal.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') doCommit(); });

siteFilter.addEventListener('input', () => {
  if (siteFiles) renderSiteList(siteFiles, siteFilter.value);
});
document.getElementById('siteClose').addEventListener('click', () => siteModal.classList.remove('open'));
siteModal.addEventListener('click', e => { if (e.target === siteModal) siteModal.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { siteModal.classList.remove('open'); commitModal.classList.remove('open'); }
});

/* menu */
const rms = document.querySelectorAll('.rm');
const closeRm = () => rms.forEach(m => m.classList.remove('open'));
rms.forEach(m => {
  m.querySelector(':scope > button').addEventListener('click', e => {
    e.stopPropagation();
    const was = m.classList.contains('open');
    closeRm();
    if (!was) m.classList.add('open');
  });
});
document.querySelector('.rm-bar').addEventListener('click', e => {
  const cmd = e.target.closest('[data-cmd]');
  if (!cmd) return;
  closeRm();
  const command = ({ new: newFile, open: openFile, site: openSiteBrowser, commit: openCommitDialog,
    save: () => saveFile(false), saveas: () => saveFile(true), ...insertCommands })[cmd.dataset.cmd];
  if (command) command();
});
document.addEventListener('click', closeRm);

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile(e.shiftKey);
  }
});

/* drag and drop */
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  mde.value(await f.text());
  handle = null;
  fileName = f.name;
  dirty = false;
  show();
});

show();

/* ---- open a file passed in the query string ----
 * The desktop's File → Edit… launches this app as
 * markdown.html?open=<content-relative path> so the front markdown page
 * arrives already loaded. Only same-origin, relative content paths are
 * accepted. */
{
  const requested = new URLSearchParams(location.search).get('open');
  if (requested) {
    const rel = requested.replace(/^content\//, '').replace(/^\/+/, '');
    if (rel && /^[\w./-]+$/.test(rel) && !rel.includes('..')) openSiteFile(rel);
    else status.textContent = 'Refused to open an unexpected path.';
  }
}
})();
</script>
