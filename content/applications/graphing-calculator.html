<script>
/* Kept out of the module below, which imports the compute engine over the
   network: the menus should open whether or not that import succeeds. */
document.addEventListener('DOMContentLoaded', () => {
  const menus = document.querySelectorAll('.rm');
  const closeMenus = () => menus.forEach(menu => menu.classList.remove('open'));
  menus.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
    event.stopPropagation();
    const open = menu.classList.contains('open');
    closeMenus();
    if (!open) menu.classList.add('open');
  }));
  document.querySelector('.rm-bar').addEventListener('click', event => {
    const item = event.target.closest('[data-cmd]');
    if (!item) return;
    closeMenus();
    document.dispatchEvent(new CustomEvent('graph-command', {
      detail: { command: item.dataset.cmd, palette: item.dataset.palette }
    }));
  });
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
});
</script>

<script type="module">
import { ComputeEngine } from 'https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine@0.30.2/dist/compute-engine.min.esm.js';

await customElements.whenDefined('math-field');

const ce = new ComputeEngine();
const root = document.documentElement;
const list = document.getElementById('expression-list');
const message = document.getElementById('expression-message');
const stage = document.getElementById('graph-stage');
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const readout = document.getElementById('coordinate-readout');
const keyboardButton = document.getElementById('show-keyboard');

const colourVars = ['--curve-1', '--curve-2', '--curve-3', '--curve-4', '--curve-5', '--curve-6'];
const expressions = [];
let nextId = 1;
let width = 1;
let height = 1;
let scale = 45;
let centreX = 0;
let centreY = 0;
let renderQueued = false;
let dragging = false;
let pointerId = null;
let keyboardVisible = false;
let lastPointer = { x: 0, y: 0 };

function css(name) {
  return getComputedStyle(root).getPropertyValue(name).trim();
}

function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    draw();
  });
}

function graphX(pixelX) {
  return centreX + (pixelX - width / 2) / scale;
}

function graphY(pixelY) {
  return centreY - (pixelY - height / 2) / scale;
}

function pixelX(x) {
  return width / 2 + (x - centreX) * scale;
}

function pixelY(y) {
  return height / 2 - (y - centreY) * scale;
}

function niceStep(targetUnits) {
  const power = 10 ** Math.floor(Math.log10(targetUnits));
  const ratio = targetUnits / power;
  if (ratio <= 1) return power;
  if (ratio <= 2) return 2 * power;
  if (ratio <= 5) return 5 * power;
  return 10 * power;
}

function formatTick(value, step) {
  const digits = step < 1 ? Math.min(6, Math.max(0, Math.ceil(-Math.log10(step)))) : 0;
  const rounded = Math.abs(value) < step / 100 ? 0 : value;
  return rounded.toFixed(digits).replace(/\.0+$/, '');
}

function drawGrid() {
  const minor = niceStep(22 / scale);
  const major = minor * 5;
  const minX = graphX(0);
  const maxX = graphX(width);
  const minY = graphY(height);
  const maxY = graphY(0);

  ctx.lineWidth = 1;
  ctx.strokeStyle = css('--graph-grid-minor');
  ctx.beginPath();
  for (let x = Math.ceil(minX / minor) * minor; x <= maxX; x += minor) {
    const px = Math.round(pixelX(x)) + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, height);
  }
  for (let y = Math.ceil(minY / minor) * minor; y <= maxY; y += minor) {
    const py = Math.round(pixelY(y)) + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(width, py);
  }
  ctx.stroke();

  ctx.strokeStyle = css('--graph-grid-major');
  ctx.beginPath();
  for (let x = Math.ceil(minX / major) * major; x <= maxX; x += major) {
    const px = Math.round(pixelX(x)) + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, height);
  }
  for (let y = Math.ceil(minY / major) * major; y <= maxY; y += major) {
    const py = Math.round(pixelY(y)) + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(width, py);
  }
  ctx.stroke();

  const axisX = pixelX(0);
  const axisY = pixelY(0);
  ctx.strokeStyle = css('--graph-axis');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (axisX >= 0 && axisX <= width) { ctx.moveTo(axisX, 0); ctx.lineTo(axisX, height); }
  if (axisY >= 0 && axisY <= height) { ctx.moveTo(0, axisY); ctx.lineTo(width, axisY); }
  ctx.stroke();

  ctx.fillStyle = css('--graph-label');
  ctx.font = '10px "IBM Plex Mono", monospace';
  ctx.textBaseline = 'top';
  for (let x = Math.ceil(minX / major) * major; x <= maxX; x += major) {
    if (Math.abs(x) < major / 100) continue;
    const px = pixelX(x);
    const y = Math.min(Math.max(axisY + 5, 4), height - 15);
    ctx.textAlign = 'center';
    ctx.fillText(formatTick(x, major), px, y);
  }
  ctx.textBaseline = 'middle';
  for (let y = Math.ceil(minY / major) * major; y <= maxY; y += major) {
    if (Math.abs(y) < major / 100) continue;
    const py = pixelY(y);
    const x = Math.min(Math.max(axisX - 7, 30), width - 4);
    ctx.textAlign = x > axisX ? 'left' : 'right';
    ctx.fillText(formatTick(y, major), x, py);
  }
}

function drawCurve(expression, colour) {
  if (!expression.compiled || !expression.visible) return;
  ctx.strokeStyle = colour;
  ctx.lineWidth = 2.25;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  let drawing = false;
  let previousY = null;
  for (let px = 0; px <= width; px += 1.5) {
    const x = graphX(px);
    let y;
    try { y = Number(expression.compiled({ x })); } catch { y = NaN; }
    const py = pixelY(y);
    const valid = Number.isFinite(y) && Number.isFinite(py) && Math.abs(py) < height * 4;
    const jump = previousY !== null && Math.abs(py - previousY) > height * 0.8;
    if (!valid || jump) {
      drawing = false;
      previousY = valid ? py : null;
      continue;
    }
    if (!drawing) { ctx.moveTo(px, py); drawing = true; }
    else ctx.lineTo(px, py);
    previousY = py;
  }
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = css('--graph-bg');
  ctx.fillRect(0, 0, width, height);
  drawGrid();
  expressions.forEach((expression, index) => drawCurve(expression, css(colourVars[index % colourVars.length])));
}

function resize() {
  width = Math.max(stage.clientWidth, 1);
  height = Math.max(stage.clientHeight, 1);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  queueRender();
}

function setMessage(text, isError = false) {
  message.textContent = text;
  message.style.color = isError ? 'var(--danger)' : '';
}

function compileExpression(expression) {
  const latex = expression.field.value.trim();
  expression.compiled = null;
  expression.element.classList.remove('invalid');
  if (!latex) {
    setMessage('Enter an expression in x.');
    queueRender();
    return;
  }
  try {
    const boxed = ce.parse(latex);
    const unknowns = boxed.unknowns.filter(symbol => symbol !== 'x');
    if (unknowns.length) throw new Error(`Unknown symbol: ${unknowns[0]}`);
    expression.compiled = boxed.compile();
    setMessage(`${expressions.filter(item => item.compiled && item.visible).length} visible curve${expressions.filter(item => item.compiled && item.visible).length === 1 ? '' : 's'} · drag to pan · wheel to zoom`);
  } catch (error) {
    expression.element.classList.add('invalid');
    setMessage(error.message || 'This expression could not be graphed.', true);
  }
  queueRender();
}

function updateRowColour(expression) {
  const colour = css(colourVars[expressions.indexOf(expression) % colourVars.length]);
  expression.element.style.setProperty('--row-color', colour);
  expression.visibility.setAttribute('aria-label', `${expression.visible ? 'Hide' : 'Show'} expression ${expressions.indexOf(expression) + 1}`);
}

function addExpression(latex = '') {
  if (expressions.length >= 6) {
    setMessage('Up to six expressions can be shown at once.', true);
    return;
  }
  const expression = { id: nextId++, visible: true, compiled: null };
  const row = document.createElement('div');
  row.className = 'expression-row';

  const visibility = document.createElement('button');
  visibility.type = 'button';
  visibility.className = 'visibility-btn';
  visibility.setAttribute('aria-pressed', 'true');
  visibility.innerHTML = '<span class="pixel-icon" data-icon="eye" aria-hidden="true"></span>';

  const yLabel = document.createElement('span');
  yLabel.className = 'y-label';
  yLabel.textContent = 'y=';

  const field = document.createElement('math-field');
  field.value = latex;
  field.setAttribute('smart-fence', '');
  field.mathVirtualKeyboardPolicy = 'sandboxed';
  field.setAttribute('aria-label', `Expression ${expressions.length + 1}`);

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'remove-btn';
  remove.innerHTML = '<span class="pixel-icon" data-icon="trash" aria-hidden="true"></span>';
  remove.setAttribute('aria-label', `Remove expression ${expressions.length + 1}`);

  row.append(visibility, yLabel, field, remove);
  list.appendChild(row);
  Object.assign(expression, { element: row, field, visibility });
  expressions.push(expression);
  updateRowColour(expression);

  field.addEventListener('input', () => compileExpression(expression));
  visibility.addEventListener('click', () => {
    expression.visible = !expression.visible;
    visibility.setAttribute('aria-pressed', String(expression.visible));
    updateRowColour(expression);
    compileExpression(expression);
  });
  remove.addEventListener('click', () => {
    const index = expressions.indexOf(expression);
    if (index !== -1) expressions.splice(index, 1);
    row.remove();
    expressions.forEach(updateRowColour);
    setMessage(`${expressions.length} expression${expressions.length === 1 ? '' : 's'}`);
    queueRender();
  });
  compileExpression(expression);
  return expression;
}

function homeView() {
  centreX = 0;
  centreY = 0;
  scale = 45;
  queueRender();
}

function applyPalette(palette) {
  root.dataset.palette = palette;
  try { localStorage.setItem('clack-graph-theme', palette); } catch {}
  document.querySelectorAll('[data-cmd="palette"]').forEach(item => {
    const active = item.dataset.palette === palette;
    item.querySelector('.mi-check').textContent = active ? '\u2713' : '';
    item.setAttribute('aria-pressed', String(active));
  });
  expressions.forEach(updateRowColour);
  queueRender();
}

/* On the desktop palette, a theme change repaints the graph surface too. */
window.addEventListener('clackos-themechange', () => {
  expressions.forEach(updateRowColour);
  queueRender();
});

canvas.addEventListener('pointerdown', event => {
  dragging = true;
  pointerId = event.pointerId;
  lastPointer = { x: event.clientX, y: event.clientY };
  canvas.setPointerCapture(pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', event => {
  const rect = canvas.getBoundingClientRect();
  const localX = event.clientX - rect.left;
  const localY = event.clientY - rect.top;
  readout.textContent = `x ${graphX(localX).toFixed(2)} · y ${graphY(localY).toFixed(2)}`;
  if (!dragging || event.pointerId !== pointerId) return;
  centreX -= (event.clientX - lastPointer.x) / scale;
  centreY += (event.clientY - lastPointer.y) / scale;
  lastPointer = { x: event.clientX, y: event.clientY };
  queueRender();
});
function endDrag(event) {
  if (event.pointerId !== pointerId) return;
  dragging = false;
  pointerId = null;
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const py = event.clientY - rect.top;
  const anchorX = graphX(px);
  const anchorY = graphY(py);
  scale = Math.min(400, Math.max(10, scale * Math.exp(-event.deltaY * 0.0012)));
  centreX = anchorX - (px - width / 2) / scale;
  centreY = anchorY + (py - height / 2) / scale;
  queueRender();
}, { passive: false });

document.addEventListener('graph-command', event => {
  const { command, palette } = event.detail;
  if (command === 'add') addFromMenu();
  else if (command === 'home') homeView();
  else if (command === 'keyboard') toggleKeyboard();
  else if (command === 'palette') applyPalette(palette);
});

function addFromMenu() {
  const expression = addExpression('');
  if (expression) expression.field.focus();
}

function toggleKeyboard() {
  const field = expressions.find(expression => expression.field.matches(':focus-within'))?.field || expressions[0]?.field;
  if (!field) return;
  field.focus();
  field.executeCommand('toggleVirtualKeyboard');
  keyboardVisible = !keyboardVisible;
  keyboardButton.setAttribute('aria-pressed', String(keyboardVisible));
  keyboardButton.querySelector('.mi-check').textContent = keyboardVisible ? '\u2713' : '';
}

let savedPalette = 'clack';
try { savedPalette = localStorage.getItem('clack-graph-theme') || 'clack'; } catch {}
if (!['clack', 'scope', 'blueprint'].includes(savedPalette)) savedPalette = 'clack';
applyPalette(savedPalette);
new ResizeObserver(resize).observe(stage);
addExpression('\\sin(x)');
addExpression('\\frac{x^2}{8}-2');
resize();
</script>
</body>
