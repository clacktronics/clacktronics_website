<!DOCTYPE html>
<html lang="en" data-theme="clack">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Graphing Calculator — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
:root {
  --calc-bg: #f8f2dd;
  --calc-panel: #f3ecd1;
  --calc-border: #09140d;
  --calc-text: #14231a;
  --calc-muted: #66755a;
  --calc-accent: #276b47;
  --graph-bg: #f8f2dd;
  --graph-grid-minor: #e3dcc2;
  --graph-grid-major: #c7bea0;
  --graph-axis: #52604d;
  --graph-label: #52604d;
  --curve-1: #258657;
  --curve-2: #c5683a;
  --curve-3: #4c68a8;
  --curve-4: #91568f;
  --curve-5: #b58b24;
  --curve-6: #2f8b91;
}
:root[data-theme="scope"] {
  color-scheme: dark;
  --calc-bg: #07110b;
  --calc-panel: #0d1d13;
  --calc-border: #4fae7d;
  --calc-text: #d8f3df;
  --calc-muted: #8fcaa8;
  --calc-accent: #62e89c;
  --graph-bg: #030906;
  --graph-grid-minor: #0c2416;
  --graph-grid-major: #173d27;
  --graph-axis: #4fae7d;
  --graph-label: #8fcaa8;
  --curve-1: #62e89c;
  --curve-2: #f3c969;
  --curve-3: #65bfff;
  --curve-4: #ff82d5;
  --curve-5: #f58163;
  --curve-6: #9f9bff;
}
:root[data-theme="blueprint"] {
  color-scheme: dark;
  --calc-bg: #0b2a45;
  --calc-panel: #103654;
  --calc-border: #a9d5e8;
  --calc-text: #edf8f4;
  --calc-muted: #a9d5e8;
  --calc-accent: #f4d76d;
  --graph-bg: #08243d;
  --graph-grid-minor: #153c59;
  --graph-grid-major: #2a5976;
  --graph-axis: #d6eaf1;
  --graph-label: #b8d9e6;
  --curve-1: #f4d76d;
  --curve-2: #ff927d;
  --curve-3: #7ed8ff;
  --curve-4: #e5a4ff;
  --curve-5: #8be3b0;
  --curve-6: #ffb9da;
}
html, body, .graph-app { height: 100%; min-height: 0; }
body {
  overflow: hidden; background: var(--calc-bg); color: var(--calc-text);
  --keyboard-zindex: 3000;
  --keyboard-accent-color: var(--calc-accent);
  --keyboard-toolbar-text: var(--calc-text);
  --keyboard-toolbar-text-active: var(--calc-accent);
  --keyboard-toolbar-background: var(--calc-panel);
  --keyboard-toolbar-background-hover: var(--calc-bg);
  --keyboard-toolbar-background-selected: var(--calc-bg);
  --keycap-background: var(--calc-bg);
  --keycap-background-hover: var(--calc-panel);
  --keycap-background-active: var(--calc-panel);
  --keycap-background-pressed: var(--calc-accent);
  --keycap-border: var(--calc-border);
  --keycap-border-bottom: var(--calc-border);
  --keycap-text: var(--calc-text);
  --keycap-text-active: var(--calc-accent);
  --keycap-text-hover: var(--calc-text);
  --keycap-text-pressed: var(--calc-bg);
  --keycap-primary-background: var(--calc-accent);
  --keycap-primary-text: var(--calc-bg);
  --keyboard-border: 1px solid var(--calc-border);
}
.graph-app { display: flex; flex-direction: column; background: var(--calc-bg); }
.graph-toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  min-height: 48px; padding: 8px 12px;
  border-bottom: 1px solid var(--calc-border); background: var(--calc-panel);
}
.graph-toolbar .btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 10px; color: var(--calc-text); background: var(--calc-bg);
  border-color: var(--calc-border); font-size: 11.5px;
}
.graph-toolbar .pixel-icon { width: 16px; height: 16px; }
.graph-toolbar .btn.primary { color: var(--calc-bg); background: var(--calc-text); }
.theme-label { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--calc-muted); }
.theme-label select {
  color: var(--calc-text); background: var(--calc-bg); border-color: var(--calc-border);
  padding: 6px 9px; font-size: 11.5px;
}
.graph-workspace { display: flex; flex: 1; min-height: 0; }
.expression-panel {
  width: 300px; min-width: 240px; display: flex; flex-direction: column;
  border-right: 1px solid var(--calc-border); background: var(--calc-panel);
}
.expression-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
.expression-row {
  display: grid; grid-template-columns: 28px 24px minmax(0, 1fr) 26px;
  align-items: center; gap: 6px; padding: 8px 5px;
  border-bottom: 1px solid color-mix(in srgb, var(--calc-border) 25%, transparent);
}
.expression-row.invalid math-field { outline: 2px solid #b84a3d; outline-offset: -2px; }
.visibility-btn, .remove-btn {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border: 1px solid var(--calc-border); border-radius: 50%;
  color: var(--calc-text); background: var(--calc-bg); font-size: 12px;
}
.visibility-btn { background: var(--row-color); border-color: var(--row-color); }
.visibility-btn[aria-pressed="false"] { background: transparent; opacity: 0.42; }
.visibility-btn:focus-visible, .remove-btn:focus-visible { outline: 2px solid var(--calc-accent); outline-offset: 2px; }
.visibility-btn .pixel-icon, .remove-btn .pixel-icon { width: 14px; height: 14px; }
.y-label { color: var(--calc-muted); font-weight: 500; }
math-field {
  width: 100%; min-width: 0; padding: 7px 8px;
  border: 1px solid var(--calc-border); border-radius: 6px;
  color: var(--calc-text); background: var(--calc-bg); font-size: 17px;
  --caret-color: var(--calc-accent);
  --selection-background-color: color-mix(in srgb, var(--calc-accent) 30%, transparent);
  --contains-highlight-background-color: color-mix(in srgb, var(--calc-accent) 20%, transparent);
  --primary: var(--calc-accent);
  --primary-color: var(--calc-accent);
  --smart-fence-color: var(--calc-accent);
}
math-field:focus-within { outline: 2px solid var(--calc-accent); outline-offset: 1px; }
math-field::part(menu-toggle),
math-field::part(virtual-keyboard-toggle) { display: none; }
.expression-message {
  min-height: 42px; padding: 9px 12px; border-top: 1px solid var(--calc-border);
  color: var(--calc-muted); font-size: 10.5px; line-height: 1.45;
}
.graph-stage { position: relative; flex: 1; min-width: 0; min-height: 260px; overflow: hidden; }
#graph-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#graph-canvas.dragging { cursor: grabbing; }
.coordinate-readout {
  position: absolute; right: 10px; bottom: 10px; pointer-events: none;
  padding: 5px 8px; border: 1px solid var(--calc-border); border-radius: 5px;
  color: var(--calc-text); background: color-mix(in srgb, var(--calc-bg) 90%, transparent);
  font-size: 10.5px; font-variant-numeric: tabular-nums;
}
.graph-credit {
  position: absolute; left: 10px; bottom: 10px; display: flex; gap: 7px;
  color: var(--calc-muted); font-size: 9.5px;
}
.graph-credit a { color: var(--calc-accent); }
@media (max-width: 680px) {
  .graph-workspace { flex-direction: column; }
  .expression-panel {
    width: 100%; min-width: 0; max-height: 205px;
    border-right: 0; border-bottom: 1px solid var(--calc-border);
  }
  .expression-list { padding: 4px 8px; }
  .expression-row { padding: 5px; }
  .expression-message { display: none; }
  .theme-label { margin-left: 0; }
  .graph-stage { min-height: 250px; }
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0"></script>
</head>
<body>
<div class="graph-app">
  <header class="graph-toolbar">
    <button class="btn primary" id="add-expression" type="button"><span class="pixel-icon" data-icon="plus-box" aria-hidden="true"></span>Add expression</button>
    <button class="btn ghost" id="home-view" type="button"><span class="pixel-icon" data-icon="home" aria-hidden="true"></span>Home</button>
    <button class="btn ghost" id="show-keyboard" type="button" aria-pressed="false"><span class="pixel-icon" data-icon="keyboard-music" aria-hidden="true"></span>Keyboard</button>
    <label class="theme-label" for="theme-select">
      <span class="pixel-icon" data-icon="colors-swatch" aria-hidden="true"></span>Theme
      <select id="theme-select">
        <option value="clack">Clack paper</option>
        <option value="scope">Oscilloscope</option>
        <option value="blueprint">Blueprint</option>
      </select>
    </label>
  </header>

  <div class="graph-workspace">
    <aside class="expression-panel" aria-label="Expressions">
      <div class="expression-list" id="expression-list"></div>
      <p class="expression-message" id="expression-message" aria-live="polite">
        Enter an expression in x. Use the coloured dot to show or hide a curve.
      </p>
    </aside>

    <main class="graph-stage" id="graph-stage">
      <canvas id="graph-canvas" role="img" aria-label="Cartesian graph of the visible expressions"></canvas>
      <output class="coordinate-readout" id="coordinate-readout">x 0.00 · y 0.00</output>
      <span class="graph-credit">
        <a href="https://github.com/arnog/mathlive" target="_blank" rel="noreferrer">MathLive · MIT</a>
        <span>/</span>
        <a href="https://github.com/cortex-js/compute-engine" target="_blank" rel="noreferrer">Compute Engine · MIT</a>
      </span>
    </main>
  </div>
</div>

<script type="module">
import { ComputeEngine } from 'https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine@0.30.2/dist/compute-engine.min.esm.js';

await customElements.whenDefined('math-field');

const ce = new ComputeEngine();
const root = document.documentElement;
const list = document.getElementById('expression-list');
const message = document.getElementById('expression-message');
const stage = document.getElementById('graph-stage');
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const readout = document.getElementById('coordinate-readout');
const addButton = document.getElementById('add-expression');
const homeButton = document.getElementById('home-view');
const keyboardButton = document.getElementById('show-keyboard');
const themeSelect = document.getElementById('theme-select');

const colourVars = ['--curve-1', '--curve-2', '--curve-3', '--curve-4', '--curve-5', '--curve-6'];
const expressions = [];
let nextId = 1;
let width = 1;
let height = 1;
let scale = 45;
let centreX = 0;
let centreY = 0;
let renderQueued = false;
let dragging = false;
let pointerId = null;
let keyboardVisible = false;
let lastPointer = { x: 0, y: 0 };

function css(name) {
  return getComputedStyle(root).getPropertyValue(name).trim();
}

function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    draw();
  });
}

function graphX(pixelX) {
  return centreX + (pixelX - width / 2) / scale;
}

function graphY(pixelY) {
  return centreY - (pixelY - height / 2) / scale;
}

function pixelX(x) {
  return width / 2 + (x - centreX) * scale;
}

function pixelY(y) {
  return height / 2 - (y - centreY) * scale;
}

function niceStep(targetUnits) {
  const power = 10 ** Math.floor(Math.log10(targetUnits));
  const ratio = targetUnits / power;
  if (ratio <= 1) return power;
  if (ratio <= 2) return 2 * power;
  if (ratio <= 5) return 5 * power;
  return 10 * power;
}

function formatTick(value, step) {
  const digits = step < 1 ? Math.min(6, Math.max(0, Math.ceil(-Math.log10(step)))) : 0;
  const rounded = Math.abs(value) < step / 100 ? 0 : value;
  return rounded.toFixed(digits).replace(/\.0+$/, '');
}

function drawGrid() {
  const minor = niceStep(22 / scale);
  const major = minor * 5;
  const minX = graphX(0);
  const maxX = graphX(width);
  const minY = graphY(height);
  const maxY = graphY(0);

  ctx.lineWidth = 1;
  ctx.strokeStyle = css('--graph-grid-minor');
  ctx.beginPath();
  for (let x = Math.ceil(minX / minor) * minor; x <= maxX; x += minor) {
    const px = Math.round(pixelX(x)) + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, height);
  }
  for (let y = Math.ceil(minY / minor) * minor; y <= maxY; y += minor) {
    const py = Math.round(pixelY(y)) + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(width, py);
  }
  ctx.stroke();

  ctx.strokeStyle = css('--graph-grid-major');
  ctx.beginPath();
  for (let x = Math.ceil(minX / major) * major; x <= maxX; x += major) {
    const px = Math.round(pixelX(x)) + 0.5;
    ctx.moveTo(px, 0); ctx.lineTo(px, height);
  }
  for (let y = Math.ceil(minY / major) * major; y <= maxY; y += major) {
    const py = Math.round(pixelY(y)) + 0.5;
    ctx.moveTo(0, py); ctx.lineTo(width, py);
  }
  ctx.stroke();

  const axisX = pixelX(0);
  const axisY = pixelY(0);
  ctx.strokeStyle = css('--graph-axis');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (axisX >= 0 && axisX <= width) { ctx.moveTo(axisX, 0); ctx.lineTo(axisX, height); }
  if (axisY >= 0 && axisY <= height) { ctx.moveTo(0, axisY); ctx.lineTo(width, axisY); }
  ctx.stroke();

  ctx.fillStyle = css('--graph-label');
  ctx.font = '10px "IBM Plex Mono", monospace';
  ctx.textBaseline = 'top';
  for (let x = Math.ceil(minX / major) * major; x <= maxX; x += major) {
    if (Math.abs(x) < major / 100) continue;
    const px = pixelX(x);
    const y = Math.min(Math.max(axisY + 5, 4), height - 15);
    ctx.textAlign = 'center';
    ctx.fillText(formatTick(x, major), px, y);
  }
  ctx.textBaseline = 'middle';
  for (let y = Math.ceil(minY / major) * major; y <= maxY; y += major) {
    if (Math.abs(y) < major / 100) continue;
    const py = pixelY(y);
    const x = Math.min(Math.max(axisX - 7, 30), width - 4);
    ctx.textAlign = x > axisX ? 'left' : 'right';
    ctx.fillText(formatTick(y, major), x, py);
  }
}

function drawCurve(expression, colour) {
  if (!expression.compiled || !expression.visible) return;
  ctx.strokeStyle = colour;
  ctx.lineWidth = 2.25;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  let drawing = false;
  let previousY = null;
  for (let px = 0; px <= width; px += 1.5) {
    const x = graphX(px);
    let y;
    try { y = Number(expression.compiled({ x })); } catch { y = NaN; }
    const py = pixelY(y);
    const valid = Number.isFinite(y) && Number.isFinite(py) && Math.abs(py) < height * 4;
    const jump = previousY !== null && Math.abs(py - previousY) > height * 0.8;
    if (!valid || jump) {
      drawing = false;
      previousY = valid ? py : null;
      continue;
    }
    if (!drawing) { ctx.moveTo(px, py); drawing = true; }
    else ctx.lineTo(px, py);
    previousY = py;
  }
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = css('--graph-bg');
  ctx.fillRect(0, 0, width, height);
  drawGrid();
  expressions.forEach((expression, index) => drawCurve(expression, css(colourVars[index % colourVars.length])));
}

function resize() {
  width = Math.max(stage.clientWidth, 1);
  height = Math.max(stage.clientHeight, 1);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  queueRender();
}

function setMessage(text, isError = false) {
  message.textContent = text;
  message.style.color = isError ? '#b84a3d' : '';
}

function compileExpression(expression) {
  const latex = expression.field.value.trim();
  expression.compiled = null;
  expression.element.classList.remove('invalid');
  if (!latex) {
    setMessage('Enter an expression in x.');
    queueRender();
    return;
  }
  try {
    const boxed = ce.parse(latex);
    const unknowns = boxed.unknowns.filter(symbol => symbol !== 'x');
    if (unknowns.length) throw new Error(`Unknown symbol: ${unknowns[0]}`);
    expression.compiled = boxed.compile();
    setMessage(`${expressions.filter(item => item.compiled && item.visible).length} visible curve${expressions.filter(item => item.compiled && item.visible).length === 1 ? '' : 's'} · drag to pan · wheel to zoom`);
  } catch (error) {
    expression.element.classList.add('invalid');
    setMessage(error.message || 'This expression could not be graphed.', true);
  }
  queueRender();
}

function updateRowColour(expression) {
  const colour = css(colourVars[expressions.indexOf(expression) % colourVars.length]);
  expression.element.style.setProperty('--row-color', colour);
  expression.visibility.setAttribute('aria-label', `${expression.visible ? 'Hide' : 'Show'} expression ${expressions.indexOf(expression) + 1}`);
}

function addExpression(latex = '') {
  if (expressions.length >= 6) {
    setMessage('Up to six expressions can be shown at once.', true);
    return;
  }
  const expression = { id: nextId++, visible: true, compiled: null };
  const row = document.createElement('div');
  row.className = 'expression-row';

  const visibility = document.createElement('button');
  visibility.type = 'button';
  visibility.className = 'visibility-btn';
  visibility.setAttribute('aria-pressed', 'true');
  visibility.innerHTML = '<span class="pixel-icon" data-icon="eye" aria-hidden="true"></span>';

  const yLabel = document.createElement('span');
  yLabel.className = 'y-label';
  yLabel.textContent = 'y=';

  const field = document.createElement('math-field');
  field.value = latex;
  field.setAttribute('smart-fence', '');
  field.mathVirtualKeyboardPolicy = 'sandboxed';
  field.setAttribute('aria-label', `Expression ${expressions.length + 1}`);

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'remove-btn';
  remove.innerHTML = '<span class="pixel-icon" data-icon="trash" aria-hidden="true"></span>';
  remove.setAttribute('aria-label', `Remove expression ${expressions.length + 1}`);

  row.append(visibility, yLabel, field, remove);
  list.appendChild(row);
  Object.assign(expression, { element: row, field, visibility });
  expressions.push(expression);
  updateRowColour(expression);

  field.addEventListener('input', () => compileExpression(expression));
  visibility.addEventListener('click', () => {
    expression.visible = !expression.visible;
    visibility.setAttribute('aria-pressed', String(expression.visible));
    updateRowColour(expression);
    compileExpression(expression);
  });
  remove.addEventListener('click', () => {
    const index = expressions.indexOf(expression);
    if (index !== -1) expressions.splice(index, 1);
    row.remove();
    expressions.forEach(updateRowColour);
    setMessage(`${expressions.length} expression${expressions.length === 1 ? '' : 's'}`);
    queueRender();
  });
  compileExpression(expression);
  return expression;
}

function homeView() {
  centreX = 0;
  centreY = 0;
  scale = 45;
  queueRender();
}

function applyTheme(theme) {
  root.dataset.theme = theme;
  themeSelect.value = theme;
  try { localStorage.setItem('clack-graph-theme', theme); } catch {}
  expressions.forEach(updateRowColour);
  queueRender();
}

canvas.addEventListener('pointerdown', event => {
  dragging = true;
  pointerId = event.pointerId;
  lastPointer = { x: event.clientX, y: event.clientY };
  canvas.setPointerCapture(pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', event => {
  const rect = canvas.getBoundingClientRect();
  const localX = event.clientX - rect.left;
  const localY = event.clientY - rect.top;
  readout.textContent = `x ${graphX(localX).toFixed(2)} · y ${graphY(localY).toFixed(2)}`;
  if (!dragging || event.pointerId !== pointerId) return;
  centreX -= (event.clientX - lastPointer.x) / scale;
  centreY += (event.clientY - lastPointer.y) / scale;
  lastPointer = { x: event.clientX, y: event.clientY };
  queueRender();
});
function endDrag(event) {
  if (event.pointerId !== pointerId) return;
  dragging = false;
  pointerId = null;
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const py = event.clientY - rect.top;
  const anchorX = graphX(px);
  const anchorY = graphY(py);
  scale = Math.min(400, Math.max(10, scale * Math.exp(-event.deltaY * 0.0012)));
  centreX = anchorX - (px - width / 2) / scale;
  centreY = anchorY + (py - height / 2) / scale;
  queueRender();
}, { passive: false });

addButton.addEventListener('click', () => {
  const expression = addExpression('');
  if (expression) expression.field.focus();
});
homeButton.addEventListener('click', homeView);
keyboardButton.addEventListener('click', () => {
  const field = expressions.find(expression => expression.field.matches(':focus-within'))?.field || expressions[0]?.field;
  if (!field) return;
  field.focus();
  field.executeCommand('toggleVirtualKeyboard');
  keyboardVisible = !keyboardVisible;
  keyboardButton.setAttribute('aria-pressed', String(keyboardVisible));
  keyboardButton.textContent = keyboardVisible ? 'Hide keyboard' : 'Keyboard';
});
themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));

let savedTheme = 'clack';
try { savedTheme = localStorage.getItem('clack-graph-theme') || 'clack'; } catch {}
if (!['clack', 'scope', 'blueprint'].includes(savedTheme)) savedTheme = 'clack';
applyTheme(savedTheme);
new ResizeObserver(resize).observe(stage);
addExpression('\\sin(x)');
addExpression('\\frac{x^2}{8}-2');
resize();
</script>
</body>
</html>
