<script>
/* Menu behaviour is deliberately outside the module below: that module imports
   three.js over the network, and the menus should still open without it. */
document.addEventListener('DOMContentLoaded', () => {
  const menus = document.querySelectorAll('.rm');
  const closeMenus = () => menus.forEach(menu => menu.classList.remove('open'));
  menus.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
    event.stopPropagation();
    const open = menu.classList.contains('open');
    closeMenus();
    if (!open) menu.classList.add('open');
  }));
  /* Colour and slider rows stay put while they are being used, so their clicks
     never reach the bar handler or the document-level close handler. */
  document.querySelectorAll('.rm-dd .mi-row').forEach(row =>
    row.addEventListener('click', event => event.stopPropagation()));
  document.querySelector('.rm-bar').addEventListener('click', event => {
    const command = event.target.closest('[data-cmd]')?.dataset.cmd;
    if (!command) return;
    closeMenus();
    document.dispatchEvent(new CustomEvent('viewer-command', { detail: command }));
  });
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
});
</script>

<script type="module">
/* The scene, the loaders and the lighting rig live in assets/js/model-scene.js
   so the inline @[model] markdown embeds render exactly the same way; this file
   is the application shell around them — menus, status bar and file handling. */
import {
  createModelScene, LIGHTING_PRESETS, SCENE_COLOUR_KEYS, LIGHT_COLOUR_KEYS,
  AXIS_ORDERS, ANIMATION_NAMES, FINISH_NAMES, DEFAULT_ANIMATION_SPEED,
  DEFAULT_SQUISH_REACH,
  axisOrderFor, asHex, formatFor, THREE
} from '../../assets/js/model-scene.js';

const stage = document.getElementById('viewer-stage');
const fileInput = document.getElementById('model-file');
const fileNameEl = document.getElementById('viewer-file-name');
const busy = document.getElementById('viewer-busy');
const nameEl = document.getElementById('model-name');
const statsEl = document.getElementById('model-stats');
const messageEl = document.getElementById('viewer-message');
const wireButton = document.getElementById('wireframe');
const clipsButton = document.getElementById('anim-clips');
const squishButton = document.getElementById('squish');
const squishReachInput = document.getElementById('squish-reach');
const reverseButton = document.getElementById('anim-reverse');
const speedInput = document.getElementById('anim-speed');
const gridButtons = [...document.querySelectorAll('[data-cmd="grid"]')];
const shadowButton = document.getElementById('shadows');
const colourInputs = {
  model: document.getElementById('colour-model'),
  grid: document.getElementById('colour-grid'),
  background: document.getElementById('colour-background'),
  key: document.getElementById('colour-key'),
  fill: document.getElementById('colour-fill'),
  sky: document.getElementById('colour-sky'),
  ground: document.getElementById('colour-ground')
};
const brightnessInput = document.getElementById('light-brightness');

const DEFAULT_MODEL_NAME = 'PJ3410 round nut';
const DEFAULT_MODEL_FILE = 'pj3410-round-nut.stl';

const viewer = createModelScene(stage);

/* Models start on the turntable when they load, unless the user has picked
   something else — the choice outlives the model it was made against. */
let animationWanted = 'turntable';
let reversed = false;
let wireframeWanted = false;
/* The bytes behind what is on screen, kept so File → Upload to website can send
   the exact file that was opened. */
let currentFile = null;

function setToggleState(button, enabled) {
  if (!button) return;
  button.querySelector('.mi-check').textContent = enabled ? '✓' : '';
  button.setAttribute('aria-pressed', String(enabled));
}

function syncColourInputs() {
  Object.entries(colourInputs).forEach(([key, input]) => { input.value = asHex(viewer.colour(key)); });
}

function setWireframe(enabled) {
  wireframeWanted = enabled;
  viewer.setWireframe(enabled);
  setToggleState(wireButton, enabled);
}

/* Speed is a percentage of the viewer's default in the menu, and negative when
   Reverse is on, which every animation reads as running backwards. */
function applyAnimationSpeed() {
  const magnitude = DEFAULT_ANIMATION_SPEED * Number(speedInput.value) / 100;
  viewer.setAnimationSpeed(reversed ? -magnitude : magnitude);
  setToggleState(reverseButton, reversed);
}

function setAnimation(name) {
  animationWanted = name;
  viewer.setAnimation(name);
  ANIMATION_NAMES.forEach(entry =>
    setToggleState(document.getElementById(`anim-${entry}`), entry === name));
}

/* Squish is a module of its own, fetched the first time it is asked for. While
   it is on, left-drag takes hold of the model and orbiting moves to the right
   button — the viewer says so, because nothing else would. */
function setSquish(enabled) {
  setToggleState(squishButton, enabled);
  viewer.setSquish(enabled).then(() => {
    showMessage(enabled
      ? 'Squish on — drag the model to pull it about, right-drag to orbit.'
      : 'Squish off.');
  }).catch(error => {
    console.error(error);
    showMessage('The squish module could not be downloaded.', true);
    setToggleState(squishButton, false);
  });
}

/* Chrome has a reflection to build before it can be drawn, which means a
   network fetch the first time; everything else is immediate. */
function setFinish(name) {
  FINISH_NAMES.forEach(entry =>
    setToggleState(document.getElementById(`finish-${entry}`), entry === name));
  viewer.setFinish(name).catch(error => {
    console.error(error);
    showMessage('The chrome finish needs a reflection map, which could not be downloaded.', true);
    setFinish('authored');
  });
}

/* A file's own animation is a property of the file, so the toggle enables
   itself around whatever is loaded rather than being remembered. */
function syncClipsButton() {
  clipsButton.disabled = !viewer.hasClips;
  setToggleState(clipsButton, viewer.clipsPlaying);
}

function setGridVisible(visible) {
  viewer.setGridVisible(visible);
  gridButtons.forEach(button => setToggleState(button, visible));
}

function setShadows(enabled) {
  viewer.setShadows(enabled);
  setToggleState(shadowButton, enabled);
}

function setLightingPreset(name) {
  viewer.setLightingPreset(name);
  Object.keys(LIGHTING_PRESETS).forEach(preset =>
    setToggleState(document.getElementById(`light-${preset}`), preset === name));
}

function setModel(root, animations) {
  viewer.setModel(root, { animations });
  viewer.setWireframe(wireframeWanted);
  setAnimation(animationWanted);
  applyAnimationSpeed();
  syncClipsButton();
}

/* three.js is Y-up, while STL, STEP and 3MF come out of CAD and slicers Z-up,
   so those are turned a quarter turn as they load and the part stands the way
   it was drawn. The menu overrides that per model: its six entries are the six
   ways the file's axes can be mapped onto the world's. */
function setAxisOrder(order) {
  viewer.setAxisOrder(order);
  AXIS_ORDERS.forEach(name =>
    setToggleState(document.getElementById(`axes-${name}`), name === viewer.axisOrder));
}

/* Loading a file re-reads the default for its format, so opening an OBJ after
   an STL does not leave the OBJ lying on its side. */
function loadedModel(root, name, animations) {
  viewer.setAxisOrder(axisOrderFor(name), { refit: false });
  setModel(root, animations);
  setAxisOrder(viewer.axisOrder);
}

window.addEventListener('clackos-themechange', () => {
  viewer.refreshTheme();
  syncColourInputs();
});

function buildDemo() {
  const material = viewer.material;
  const root = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(72, 3, 44), material());
  board.castShadow = true;
  board.receiveShadow = true;
  root.add(board);

  const chip = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 16), material());
  chip.position.set(4, 4, 0);
  chip.castShadow = true;
  root.add(chip);

  [[-27, -14], [-27, 14], [27, -14], [27, 14]].forEach(([x, z]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 6, 24), material(null, { metalness: 0.5 }));
    post.position.set(x, 4.5, z);
    post.castShadow = true;
    root.add(post);
  });

  [-12, 12].forEach(z => {
    const connector = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 7), material());
    connector.position.set(28, 5.5, z);
    connector.castShadow = true;
    root.add(connector);
  });

  const socket = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 7, 32), material(null, { metalness: 0.75 }));
  socket.position.set(-15, 5, 0);
  socket.castShadow = true;
  root.add(socket);
  return root;
}

function showMessage(text, error = false) {
  messageEl.textContent = text;
  messageEl.classList.toggle('error', error);
}

async function openFile(file) {
  if (!formatFor(file.name)) {
    showMessage('Choose an STL, STEP, OBJ, 3MF or GLB file.', true);
    return;
  }

  busy.textContent = 'Reading model…';
  busy.classList.add('visible');
  showMessage('Opening locally…');
  try {
    const buffer = await file.arrayBuffer();
    const parsed = await viewer.parse(buffer, file.name, message => { busy.textContent = message; });
    currentFile = { name: file.name, buffer, type: file.type };
    wireframeWanted = false;
    loadedModel(parsed.root, file.name, parsed.animations);
    setWireframe(false);
    nameEl.textContent = file.name;
    fileNameEl.textContent = file.name;
    const parts = parsed.parts ? ` · ${parsed.parts.toLocaleString()} parts` : '';
    const colours = parsed.ownColours ? ' · file colours' : '';
    const animated = parsed.animations?.length ? ' · animated' : '';
    statsEl.textContent = `${parsed.label} · ${parsed.triangles.toLocaleString()} triangles${parts}${colours}${animated}`;
    /* Where a file names its own colours or materials they are what is drawn, so
       say so: the Colours → Model swatch only reaches the parts that don't. */
    showMessage(parsed.ownColours
      ? 'Loaded locally — the file’s own colours and materials are shown.'
      : 'Loaded locally — nothing was uploaded.');
  } catch (error) {
    console.error(error);
    showMessage(error.message || 'The model could not be opened.', true);
  } finally {
    busy.classList.remove('visible');
  }
}

fileInput.addEventListener('change', () => {
  const [file] = fileInput.files;
  if (file) openFile(file);
});

['dragenter', 'dragover'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.add('dragging');
}));
['dragleave', 'drop'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.remove('dragging');
}));
stage.addEventListener('drop', event => {
  const [file] = event.dataTransfer.files;
  if (file) openFile(file);
});

function resetColours(keys) {
  keys.forEach(key => viewer.setColour(key, null));
  syncColourInputs();
}

const viewerCommands = {
  open: () => fileInput.click(),
  upload: openUploadDialog,
  fit: () => viewer.fitView(false),
  reset: () => viewer.fitView(true),
  wireframe: () => setWireframe(wireButton.getAttribute('aria-pressed') !== 'true'),
  grid: () => setGridVisible(!viewer.gridVisible),
  squish: () => setSquish(squishButton.getAttribute('aria-pressed') !== 'true'),
  'anim-reverse': () => { reversed = !reversed; applyAnimationSpeed(); },
  'anim-clips': () => {
    viewer.setClipsPlaying(!viewer.clipsPlaying);
    syncClipsButton();
  },
  'colours-reset': () => resetColours(SCENE_COLOUR_KEYS),
  'lighting-reset': () => resetColours(LIGHT_COLOUR_KEYS),
  'light-studio': () => setLightingPreset('studio'),
  'light-soft': () => setLightingPreset('soft'),
  'light-dramatic': () => setLightingPreset('dramatic'),
  'light-flat': () => setLightingPreset('flat'),
  'light-unlit': () => setLightingPreset('unlit'),
  'axes-default': () => setAxisOrder(axisOrderFor(currentFile?.name || '')),
  shadows: () => setShadows(shadowButton.getAttribute('aria-pressed') !== 'true')
};
AXIS_ORDERS.forEach(order => { viewerCommands[`axes-${order}`] = () => setAxisOrder(order); });
ANIMATION_NAMES.forEach(name => { viewerCommands[`anim-${name}`] = () => setAnimation(name); });
FINISH_NAMES.forEach(name => { viewerCommands[`finish-${name}`] = () => setFinish(name); });

document.addEventListener('viewer-command', event => viewerCommands[event.detail]?.());

Object.entries(colourInputs).forEach(([key, input]) =>
  input.addEventListener('input', event => viewer.setColour(key, event.target.value)));
brightnessInput.addEventListener('input', event =>
  viewer.setBrightness(Number(event.target.value) / 100));
speedInput.addEventListener('input', applyAnimationSpeed);
squishReachInput.value = String(Math.round(DEFAULT_SQUISH_REACH * 100));
squishReachInput.addEventListener('input', event =>
  viewer.setSquishReach(Number(event.target.value) / 100));

/* ---- upload the open model to the web host ----
 * Models are large binaries, so they go to the endpoint named by "assetUpload"
 * in content/site.json (resolved against the site root, so it is same-origin)
 * rather than into the GitHub repository. The token is held in memory for this
 * tab only; the host answers with the public URL to link to. */
const uploadModal = document.getElementById('upload-modal');
const uploadForm = document.getElementById('upload-form');
const uploadName = document.getElementById('upload-name');
const uploadTokenRow = document.getElementById('upload-token-row');
const uploadTokenInput = document.getElementById('upload-token');
const uploadStatus = document.getElementById('upload-status');
const uploadResult = document.getElementById('upload-result');
const uploadLink = document.getElementById('upload-link');
const uploadGo = document.getElementById('upload-go');
let uploadToken = null;        /* secret, memory only, per session */
let assetUploadUrl = null;     /* resolved endpoint URL, or '' if unset */

async function getAssetUploadUrl() {
  if (assetUploadUrl !== null) return assetUploadUrl;
  try {
    const siteRoot = new URL('../../', location.href);
    const site = await (await fetch(new URL('content/site.json', siteRoot))).json();
    assetUploadUrl = site.assetUpload ? new URL(site.assetUpload, siteRoot).href : '';
  } catch { assetUploadUrl = ''; }
  return assetUploadUrl;
}

const showTokenRow = show => { uploadTokenRow.style.display = show ? 'flex' : 'none'; };
const closeUploadDialog = () => uploadModal.classList.remove('open');

async function openUploadDialog() {
  if (!currentFile) {
    showMessage('Open a model first — File → Open model….', true);
    return;
  }
  const endpoint = await getAssetUploadUrl();
  if (!endpoint) {
    showMessage('Uploads are not configured — add "assetUpload" to content/site.json.', true);
    return;
  }
  uploadName.value = currentFile.name;
  uploadTokenInput.value = '';
  showTokenRow(!uploadToken);
  uploadStatus.textContent = `to ${new URL(endpoint).host}`;
  uploadResult.hidden = true;
  uploadModal.classList.add('open');
  (uploadToken ? uploadName : uploadTokenInput).focus();
}

uploadForm.addEventListener('submit', async event => {
  event.preventDefault();
  const endpoint = await getAssetUploadUrl();
  const token = uploadToken || uploadTokenInput.value.trim();
  if (!token) { uploadStatus.textContent = 'A token is needed.'; return; }
  /* The host generates the stored filename itself; this only feeds the slug it
     builds that name from, so a path separator in it means nothing. */
  const name = uploadName.value.trim().replace(/[\\/]+/g, '-') || currentFile.name;
  uploadGo.disabled = true;
  uploadStatus.textContent = 'Uploading…';
  uploadResult.hidden = true;
  try {
    const file = new Blob([currentFile.buffer], { type: currentFile.type || 'application/octet-stream' });
    const body = new FormData();
    body.append('file', file, name);
    const response = await fetch(endpoint, { method: 'POST', headers: { 'X-Upload-Token': token }, body });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) throw new Error(data.error || `Upload failed (${response.status}).`);
    uploadToken = token;
    uploadTokenInput.value = '';
    showTokenRow(false);
    uploadLink.href = data.url;
    uploadLink.textContent = data.url;
    uploadResult.hidden = false;
    uploadStatus.textContent = `Uploaded ${data.name} (${Math.max(1, Math.round(data.size / 1024))} KB).`;
    showMessage(`Uploaded ${data.name} to the website.`);
  } catch (error) {
    uploadStatus.textContent = error.message;
    /* a rejected token is worth forgetting so the field comes back */
    if (/token/i.test(error.message)) { uploadToken = null; showTokenRow(true); }
    showMessage(`Upload failed: ${error.message}`, true);
  } finally {
    uploadGo.disabled = false;
  }
});

/* The markdown for the uploaded file, carrying the axis order on screen when it
   is not the one the format would pick on its own. */
function modelDirective() {
  const caption = (uploadName.value.trim() || currentFile.name).replace(/\.[^.]+$/, '').replace(/["']/g, '');
  const axes = viewer.axisOrder === axisOrderFor(uploadName.value || currentFile.name)
    ? '' : `{axes=${viewer.axisOrder}}`;
  return `@[model](${uploadLink.href} "${caption}")${axes}`;
}

async function copyToClipboard(text, done) {
  try {
    await navigator.clipboard.writeText(text);
    uploadStatus.textContent = done;
  } catch {
    uploadStatus.textContent = 'The browser would not give access to the clipboard.';
  }
}

document.getElementById('upload-copy').addEventListener('click', () =>
  copyToClipboard(uploadLink.href, 'Link copied to the clipboard.'));
document.getElementById('upload-copy-embed').addEventListener('click', () =>
  copyToClipboard(modelDirective(), 'Markdown copied — paste it into a page.'));
uploadModal.querySelectorAll('[data-close]').forEach(button =>
  button.addEventListener('click', closeUploadDialog));
uploadModal.addEventListener('keydown', event => { if (event.key === 'Escape') closeUploadDialog(); });

/* The viewer opens on a real part — a PJ3410 jack round nut, triangulated from
   the STEP file so it loads without the STEP engine. The built demo assembly is
   the fallback if the file cannot be fetched. */
async function loadDefaultModel() {
  try {
    const response = await fetch(`models/${DEFAULT_MODEL_FILE}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const buffer = await response.arrayBuffer();
    const parsed = await viewer.parse(buffer, DEFAULT_MODEL_FILE);
    currentFile = { name: DEFAULT_MODEL_FILE, buffer, type: 'application/octet-stream' };
    loadedModel(parsed.root, DEFAULT_MODEL_FILE, parsed.animations);
    nameEl.textContent = DEFAULT_MODEL_NAME;
    fileNameEl.textContent = DEFAULT_MODEL_NAME;
    statsEl.textContent = `STL · ${parsed.triangles.toLocaleString()} triangles · sample`;
  } catch (error) {
    console.error(error);
    nameEl.textContent = 'Demo assembly';
    fileNameEl.textContent = 'Demo assembly';
    statsEl.textContent = '9 objects · sample';
  }
}

new ResizeObserver(() => viewer.resize()).observe(stage);
/* The built-in demo is modelled the way three.js expects, so it starts on the
   identity mapping; the file loaded over it switches to its format's default. */
setAxisOrder('xyz');
setModel(buildDemo());
setGridVisible(true);
setShadows(true);
setLightingPreset('studio');
syncColourInputs();
viewer.resize();
loadDefaultModel();
</script>
</body>
</html>
