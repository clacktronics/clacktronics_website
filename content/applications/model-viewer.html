<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>3D Model Viewer — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<style>
html, body, .viewer-app { height: 100%; min-height: 0; }
body { overflow: hidden; }
.viewer-app { display: flex; flex-direction: column; }
.viewer-file-name {
  margin-left: auto; align-self: center; max-width: 260px; padding: 0 8px;
  overflow: hidden; color: var(--sage); font-size: 11px;
  text-overflow: ellipsis; white-space: nowrap;
}
.rm-dd .mi-check { margin-left: auto; padding-left: 18px; color: var(--leaf-deep); }
.rm-dd button:hover .mi-check { color: var(--leaf); }
.rm-dd .mi-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px;
  color: var(--control-text); font-size: 12px;
}
.rm-dd .mi-row label { flex: 1; white-space: nowrap; }
.rm-dd .mi-row input[type="color"] {
  width: 46px; height: 22px; padding: 0; cursor: pointer;
  border: 1px solid var(--ink); border-radius: 3px; background: var(--paper);
}
.rm-dd .mi-row input[type="range"] { width: 108px; accent-color: var(--leaf-deep); cursor: pointer; }
.viewer-stage {
  position: relative; flex: 1; min-height: 260px; overflow: hidden;
  background: var(--paper-deep); outline: none;
}
.viewer-stage.dragging { box-shadow: inset 0 0 0 4px var(--leaf); }
.viewer-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.viewer-prompt {
  position: absolute; top: 14px; left: 14px; z-index: 2; pointer-events: none;
  max-width: min(330px, calc(100% - 28px)); padding: 9px 12px;
  border: 1px solid var(--paper-line); border-radius: 6px;
  color: var(--control-text); background: color-mix(in srgb, var(--paper) 92%, transparent);
  font-size: 11px; line-height: 1.55;
}
.viewer-prompt strong { display: block; margin-bottom: 2px; font-weight: 600; }
.viewer-busy {
  position: absolute; inset: 0; z-index: 4; display: none;
  align-items: center; justify-content: center;
  color: var(--menu-text); background: color-mix(in srgb, var(--ink) 78%, transparent);
  font-size: 12px; letter-spacing: 0.04em;
}
.viewer-busy.visible { display: flex; }
.viewer-status {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  min-height: 34px; padding: 7px 14px; border-top: 1px solid var(--paper-line);
  color: var(--sage); background: var(--paper); font-size: 10.5px;
}
.viewer-status strong { color: var(--control-text); font-weight: 500; }
.viewer-message { flex: 1; min-width: 180px; }
.viewer-message.error { color: #9a3f35; }
.viewer-credit { margin-left: auto; white-space: nowrap; }
.viewer-credit a { color: var(--leaf-deep); }
@media (max-width: 620px) {
  .viewer-file-name { max-width: 40vw; }
  .viewer-credit { width: 100%; margin-left: 0; }
}
</style>
<script>
/* Menu behaviour is deliberately outside the module below: that module imports
   three.js over the network, and the menus should still open without it. */
document.addEventListener('DOMContentLoaded', () => {
  const menus = document.querySelectorAll('.rm');
  const closeMenus = () => menus.forEach(menu => menu.classList.remove('open'));
  menus.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
    event.stopPropagation();
    const open = menu.classList.contains('open');
    closeMenus();
    if (!open) menu.classList.add('open');
  }));
  /* Colour and slider rows stay put while they are being used, so their clicks
     never reach the bar handler or the document-level close handler. */
  document.querySelectorAll('.rm-dd .mi-row').forEach(row =>
    row.addEventListener('click', event => event.stopPropagation()));
  document.querySelector('.rm-bar').addEventListener('click', event => {
    const command = event.target.closest('[data-cmd]')?.dataset.cmd;
    if (!command) return;
    closeMenus();
    document.dispatchEvent(new CustomEvent('viewer-command', { detail: command }));
  });
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
});
</script>

<body>

        <button type="button" data-cmd="autorotate" id="autorotate" aria-pressed="true"><span class="pixel-icon" data-icon="repeat" aria-hidden="true"></span>Auto-rotate<span class="mi-check"></span></button>
        <button type="button" data-cmd="grid" id="grid-toggle" aria-pressed="true"><span class="pixel-icon" data-icon="grid-3x3" aria-hidden="true"></span>Show grid<span class="mi-check"></span></button>

  <main class="viewer-stage" id="viewer-stage" aria-label="Interactive 3D model viewport">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const stage = document.getElementById('viewer-stage');
const fileInput = document.getElementById('model-file');
const fileNameEl = document.getElementById('viewer-file-name');
const prompt = document.getElementById('viewer-prompt');
const busy = document.getElementById('viewer-busy');
const nameEl = document.getElementById('model-name');
const statsEl = document.getElementById('model-stats');
const messageEl = document.getElementById('viewer-message');
const wireButton = document.getElementById('wireframe');
const rotateButton = document.getElementById('autorotate');
const gridButtons = [...document.querySelectorAll('[data-cmd="grid"]')];
const shadowButton = document.getElementById('shadows');
const colourInputs = {
  model: document.getElementById('colour-model'),
  grid: document.getElementById('colour-grid'),
  background: document.getElementById('colour-background')
};
const brightnessInput = document.getElementById('light-brightness');

const themeColor = (name, fallback) =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;

/* Colours follow the ClackOS palette until the user picks their own; an entry
   here overrides the theme variable of the same name until it is reset. */
const overrides = { model: null, grid: null, background: null };
const paletteColour = {
  model: () => overrides.model || themeColor('--leaf', '#4fae7d'),
  grid: () => overrides.grid || themeColor('--leaf-deep', '#276b47'),
  background: () => overrides.background || themeColor('--paper-deep', '#f3ecd1')
};
const asHex = value => `#${new THREE.Color(value).getHexString()}`;

const scene = new THREE.Scene();
scene.background = new THREE.Color(paletteColour.background());

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 1000);
camera.position.set(95, 70, 105);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label', '3D model; drag to orbit, right-drag to pan, and use the wheel to zoom');
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
controls.screenSpacePanning = true;
controls.minDistance = 8;
controls.maxDistance = 500;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.9;
controls.addEventListener('change', render);

const hemisphereLight = new THREE.HemisphereLight(
  themeColor('--paper', '#f8f2dd'), themeColor('--sage', '#66755a'), 2.2
);
scene.add(hemisphereLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 3.1);
keyLight.position.set(70, 110, 80);
keyLight.castShadow = true;
/* Models are normalised to 80 units, so the shadow camera has to be widened
   from its 10-unit default; left at the default it covers a small patch in the
   middle of the model and fills it with shadow acne. The biases keep flat faces
   from shadowing themselves. */
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -95;
keyLight.shadow.camera.right = 95;
keyLight.shadow.camera.top = 95;
keyLight.shadow.camera.bottom = -95;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 420;
keyLight.shadow.camera.updateProjectionMatrix();
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.8;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(themeColor('--menu-dim', '#8fcaa8'), 1.2);
fillLight.position.set(-80, 40, -60);
scene.add(fillLight);

/* Each preset is a set of light intensities and a key-light direction; the
   brightness slider scales all three intensities on top of the preset. */
const lightingPresets = {
  studio: { hemisphere: 2.2, key: 3.1, fill: 1.2, keyPosition: [70, 110, 80] },
  soft: { hemisphere: 3.4, key: 1.3, fill: 1.7, keyPosition: [40, 120, 70] },
  dramatic: { hemisphere: 0.6, key: 4.8, fill: 0.3, keyPosition: [110, 70, 25] },
  flat: { hemisphere: 4.2, key: 0.7, fill: 1, keyPosition: [0, 140, 10] }
};
let lightingPreset = 'studio';
let brightness = 1;

const grid = new THREE.GridHelper(140, 14, 0x276b47, 0x276b47);
grid.position.y = -42;
scene.add(grid);

let modelRoot = null;
let occtPromise = null;
/* Models start spinning when they load, unless the user has turned it off. */
let autoRotateWanted = true;

function applyViewerTheme() {
  scene.background.set(paletteColour.background());
  hemisphereLight.color.set(themeColor('--paper', '#f8f2dd'));
  hemisphereLight.groundColor.set(themeColor('--sage', '#66755a'));
  fillLight.color.set(themeColor('--menu-dim', '#8fcaa8'));
  applyGridColour();
  modelRoot?.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(entry => entry?.userData.themed).forEach(entry => entry.color.set(modelColour()));
  });
  syncColourInputs();
  render();
}

/* GridHelper keeps its two line colours in a vertex colour attribute and draws
   them through one material, so tinting the material would multiply the stored
   colours instead of replacing them. Write the colour into the attribute. */
function applyGridColour() {
  const colour = new THREE.Color(paletteColour.grid());
  const colours = grid.geometry.getAttribute('color');
  for (let index = 0; index < colours.count; index += 1) colours.setXYZ(index, colour.r, colour.g, colour.b);
  colours.needsUpdate = true;
}

function syncColourInputs() {
  Object.entries(colourInputs).forEach(([key, input]) => { input.value = asHex(paletteColour[key]()); });
}

function applyLighting() {
  const preset = lightingPresets[lightingPreset];
  hemisphereLight.intensity = preset.hemisphere * brightness;
  keyLight.intensity = preset.key * brightness;
  fillLight.intensity = preset.fill * brightness;
  keyLight.position.set(...preset.keyPosition);
  Object.keys(lightingPresets).forEach(name => setToggleState(document.getElementById(`light-${name}`), name === lightingPreset));
  render();
}

function setShadows(enabled) {
  keyLight.castShadow = enabled;
  renderer.shadowMap.enabled = enabled;
  scene.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(Boolean).forEach(entry => { entry.needsUpdate = true; });
  });
  setToggleState(shadowButton, enabled);
  render();
}

function setToggleState(button, enabled) {
  if (!button) return;
  button.querySelector('.mi-check').textContent = enabled ? '✓' : '';
  button.setAttribute('aria-pressed', String(enabled));
}

window.addEventListener('clackos-themechange', applyViewerTheme);

function render() {
  renderer.render(scene, camera);
}

/* Auto-rotation runs its own frame loop. OrbitControls keeps handling pointer
   input while it spins, so the user can still orbit, pan and zoom. */
let rotationFrame = null;

function spin() {
  if (!controls.autoRotate) {
    rotationFrame = null;
    return;
  }
  rotationFrame = requestAnimationFrame(spin);
  controls.update();
}

function setAutoRotate(enabled) {
  controls.autoRotate = enabled;
  setToggleState(rotateButton, enabled);
  if (enabled && rotationFrame === null) spin();
}

function setGridVisible(visible) {
  grid.visible = visible;
  gridButtons.forEach(button => setToggleState(button, visible));
  render();
}

function resize() {
  const width = Math.max(stage.clientWidth, 1);
  const height = Math.max(stage.clientHeight, 1);
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  render();
}

/* Models render in the accent colour. Passing no colour marks the material as
   themed, so it follows the palette and the Colours menu. Colours that come
   from the file itself — STEP part colours, STL vertex colours — win instead
   and are left alone; vertex colours need a white base so the file's colours
   are not tinted by the accent. */
const modelColour = () => new THREE.Color(paletteColour.model());

function material(color = null, options = {}) {
  const themed = color === null && !options.vertexColors;
  const entry = new THREE.MeshStandardMaterial({
    color: options.vertexColors ? 0xffffff : (color === null ? modelColour() : color),
    roughness: 0.62,
    metalness: options.metalness || 0,
    side: THREE.DoubleSide,
    vertexColors: Boolean(options.vertexColors),
    transparent: Boolean(options.transparent),
    opacity: options.opacity ?? 1
  });
  entry.userData.themed = themed;
  return entry;
}

function setModelColour(value) {
  overrides.model = value;
  modelRoot?.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(entry => entry?.userData.themed).forEach(entry => entry.color.set(modelColour()));
  });
  render();
}

function buildDemo() {
  const root = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(72, 3, 44), material());
  board.castShadow = true;
  board.receiveShadow = true;
  root.add(board);

  const chip = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 16), material());
  chip.position.set(4, 4, 0);
  chip.castShadow = true;
  root.add(chip);

  [[-27, -14], [-27, 14], [27, -14], [27, 14]].forEach(([x, z]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 6, 24), material(null, { metalness: 0.5 }));
    post.position.set(x, 4.5, z);
    post.castShadow = true;
    root.add(post);
  });

  [-12, 12].forEach(z => {
    const connector = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 7), material());
    connector.position.set(28, 5.5, z);
    connector.castShadow = true;
    root.add(connector);
  });

  const socket = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 7, 32), material(null, { metalness: 0.75 }));
  socket.position.set(-15, 5, 0);
  socket.castShadow = true;
  root.add(socket);
  return root;
}

function disposeObject(root) {
  root.traverse(object => {
    if (object.geometry) object.geometry.dispose();
    if (Array.isArray(object.material)) object.material.forEach(entry => entry.dispose());
    else if (object.material) object.material.dispose();
  });
}

function setModel(root) {
  normaliseModel(root);
  if (modelRoot) {
    scene.remove(modelRoot);
    disposeObject(modelRoot);
  }
  modelRoot = root;
  scene.add(modelRoot);
  modelRoot.traverse(object => {
    if (!object.isMesh) return;
    object.castShadow = true;
    object.receiveShadow = true;
  });
  fitView(true);
  setAutoRotate(autoRotateWanted);
}

function normaliseModel(root) {
  root.position.set(0, 0, 0);
  root.scale.setScalar(1);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) throw new Error('The model contains no visible geometry.');
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const largest = Math.max(size.x, size.y, size.z);
  if (!Number.isFinite(largest) || largest <= 0) throw new Error('The model has invalid dimensions.');
  const scale = 80 / largest;
  root.scale.setScalar(scale);
  root.position.copy(centre).multiplyScalar(-scale);
  root.updateMatrixWorld(true);
  const normalisedBox = new THREE.Box3().setFromObject(root);
  grid.position.y = normalisedBox.min.y - 1.5;
}

function fitView(resetDirection = false) {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const direction = resetDirection
    ? new THREE.Vector3(1, 0.72, 1).normalize()
    : camera.position.clone().sub(controls.target).normalize();
  const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
  const distance = Math.max(sphere.radius / Math.sin(halfFov), 30) * 1.18;
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(direction, distance);
  camera.near = Math.max(distance / 500, 0.05);
  camera.far = distance * 20;
  camera.updateProjectionMatrix();
  controls.update();
  render();
}

function setWireframe(enabled) {
  if (!modelRoot) return;
  modelRoot.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(Boolean).forEach(entry => { entry.wireframe = enabled; });
  });
  setToggleState(wireButton, enabled);
  render();
}

function geometryFromStepMesh(stepMesh) {
  const geometry = new THREE.BufferGeometry();
  const positions = stepMesh.attributes.position.array;
  const flatPositions = Array.isArray(positions[0]) ? positions.flat() : positions;
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(flatPositions, 3));
  if (stepMesh.attributes.normal) {
    const normals = stepMesh.attributes.normal.array;
    const flatNormals = Array.isArray(normals[0]) ? normals.flat() : normals;
    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(flatNormals, 3));
  } else {
    geometry.computeVertexNormals();
  }
  const index = stepMesh.index && stepMesh.index.array;
  if (index) geometry.setIndex(Array.isArray(index[0]) ? index.flat() : index);
  return geometry;
}

async function loadOcct() {
  if (occtPromise) return occtPromise;
  occtPromise = (async () => {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('The STEP importer could not be downloaded.'));
      document.head.appendChild(script);
    });
    return window.occtimportjs({
      locateFile: file => file.endsWith('.wasm')
        ? 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.wasm'
        : file
    });
  })().catch(error => {
    occtPromise = null;
    throw error;
  });
  return occtPromise;
}

async function parseStl(buffer) {
  const geometry = new STLLoader().parse(buffer);
  if (!geometry.getAttribute('normal')) geometry.computeVertexNormals();
  const hasColors = Boolean(geometry.hasColors);
  const root = new THREE.Group();
  root.add(new THREE.Mesh(geometry, material(null, {
    vertexColors: hasColors,
    transparent: hasColors && geometry.alpha < 1,
    opacity: hasColors ? geometry.alpha : 1
  })));
  return {
    root,
    triangles: Math.floor(geometry.getAttribute('position').count / 3),
    ownColours: hasColors
  };
}

async function parseStep(buffer) {
  busy.textContent = 'Loading STEP engine…';
  const occt = await loadOcct();
  busy.textContent = 'Triangulating STEP model…';
  await new Promise(resolve => requestAnimationFrame(resolve));
  const result = occt.ReadStepFile(new Uint8Array(buffer), {
    linearUnit: 'millimeter',
    linearDeflectionType: 'bounding_box_ratio',
    linearDeflection: 0.002,
    angularDeflection: 0.5
  });
  if (!result.success) throw new Error('The STEP importer could not read this file.');

  const root = new THREE.Group();
  let triangles = 0;
  let ownColours = false;
  result.meshes.forEach(stepMesh => {
    const geometry = geometryFromStepMesh(stepMesh);
    /* STEP files may carry their own part colours, which take priority;
       anything without one follows the viewer's model colour. */
    const rgb = stepMesh.color?.map(value => value > 1 ? value / 255 : value);
    const colour = rgb ? new THREE.Color(rgb[0], rgb[1], rgb[2]) : null;
    ownColours = ownColours || Boolean(rgb);
    root.add(new THREE.Mesh(geometry, material(colour)));
    triangles += geometry.index ? geometry.index.count / 3 : geometry.getAttribute('position').count / 3;
  });
  return { root, triangles: Math.floor(triangles), parts: result.meshes.length, ownColours };
}

async function openFile(file) {
  const extension = file.name.split('.').pop().toLowerCase();
  if (!['stl', 'step', 'stp'].includes(extension)) {
    showMessage('Choose an STL, STEP or STP file.', true);
    return;
  }

  busy.textContent = 'Reading model…';
  busy.classList.add('visible');
  showMessage('Opening locally…');
  try {
    const buffer = await file.arrayBuffer();
    const parsed = extension === 'stl' ? await parseStl(buffer) : await parseStep(buffer);
    setModel(parsed.root);
    prompt.hidden = true;
    nameEl.textContent = file.name;
    fileNameEl.textContent = file.name;
    const format = extension === 'stl' ? 'STL' : 'STEP';
    const parts = parsed.parts ? ` · ${parsed.parts.toLocaleString()} parts` : '';
    const colours = parsed.ownColours ? ' · file colours' : '';
    statsEl.textContent = `${format} · ${parsed.triangles.toLocaleString()} triangles${parts}${colours}`;
    showMessage(parsed.ownColours
      ? 'Loaded locally — the model’s own colours are shown.'
      : 'Loaded locally — nothing was uploaded.');
    setWireframe(false);
  } catch (error) {
    console.error(error);
    showMessage(error.message || 'The model could not be opened.', true);
  } finally {
    busy.classList.remove('visible');
  }
}

function showMessage(text, error = false) {
  messageEl.textContent = text;
  messageEl.classList.toggle('error', error);
}

fileInput.addEventListener('change', () => {
  const [file] = fileInput.files;
  if (file) openFile(file);
});

['dragenter', 'dragover'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.add('dragging');
}));
['dragleave', 'drop'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.remove('dragging');
}));
stage.addEventListener('drop', event => {
  const [file] = event.dataTransfer.files;
  if (file) openFile(file);
});

function setLightingPreset(name) {
  lightingPreset = name;
  applyLighting();
}

function resetColours() {
  Object.keys(overrides).forEach(key => { overrides[key] = null; });
  applyViewerTheme();
}

document.addEventListener('viewer-command', event => {
  ({ open: () => fileInput.click(),
     fit: () => fitView(false),
     reset: () => fitView(true),
     wireframe: () => setWireframe(wireButton.getAttribute('aria-pressed') !== 'true'),
     autorotate: () => {
       autoRotateWanted = !controls.autoRotate;
       setAutoRotate(autoRotateWanted);
     },
     grid: () => setGridVisible(!grid.visible),
     'colours-reset': resetColours,
     'light-studio': () => setLightingPreset('studio'),
     'light-soft': () => setLightingPreset('soft'),
     'light-dramatic': () => setLightingPreset('dramatic'),
     'light-flat': () => setLightingPreset('flat'),
     shadows: () => setShadows(shadowButton.getAttribute('aria-pressed') !== 'true')
   })[event.detail]?.();
});

colourInputs.model.addEventListener('input', event => setModelColour(event.target.value));
colourInputs.grid.addEventListener('input', event => {
  overrides.grid = event.target.value;
  applyGridColour();
  render();
});
colourInputs.background.addEventListener('input', event => {
  overrides.background = event.target.value;
  scene.background.set(overrides.background);
  render();
});
brightnessInput.addEventListener('input', event => {
  brightness = Number(event.target.value) / 100;
  applyLighting();
});

new ResizeObserver(resize).observe(stage);
setModel(buildDemo());
setGridVisible(true);
setShadows(true);
applyLighting();
applyGridColour();
syncColourInputs();
resize();
</script>
</body>
