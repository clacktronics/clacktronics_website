<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>3D Model Viewer — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
html, body, .viewer-app { height: 100%; min-height: 0; }
body { overflow: hidden; }
.viewer-app { display: flex; flex-direction: column; }
.viewer-file-name {
  margin-left: auto; align-self: center; max-width: 260px; padding: 0 8px;
  overflow: hidden; color: var(--sage); font-size: 11px;
  text-overflow: ellipsis; white-space: nowrap;
}
.rm-dd .mi-check { margin-left: auto; padding-left: 18px; color: var(--leaf-deep); }
.rm-dd button:hover .mi-check { color: var(--leaf); }
.rm-dd .mi-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px;
  color: var(--control-text); font-size: 12px;
}
.rm-dd .mi-row label { flex: 1; white-space: nowrap; }
.rm-dd .mi-row input[type="color"] {
  width: 46px; height: 22px; padding: 0; cursor: pointer;
  border: 1px solid var(--ink); border-radius: 3px; background: var(--paper);
}
.rm-dd .mi-row input[type="range"] { width: 108px; accent-color: var(--leaf-deep); cursor: pointer; }
.viewer-stage {
  position: relative; flex: 1; min-height: 260px; overflow: hidden;
  background: var(--paper-deep); outline: none;
}
.viewer-stage.dragging { box-shadow: inset 0 0 0 4px var(--leaf); }
.viewer-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.viewer-busy {
  position: absolute; inset: 0; z-index: 4; display: none;
  align-items: center; justify-content: center;
  color: var(--menu-text); background: color-mix(in srgb, var(--ink) 78%, transparent);
  font-size: 12px; letter-spacing: 0.04em;
}
.viewer-busy.visible { display: flex; }
.viewer-status {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  min-height: 34px; padding: 7px 14px; border-top: 1px solid var(--paper-line);
  color: var(--sage); background: var(--paper); font-size: 10.5px;
}
.viewer-status strong { color: var(--control-text); font-weight: 500; }
.viewer-message { flex: 1; min-width: 180px; }
.viewer-message.error { color: #9a3f35; }
.viewer-credit { margin-left: auto; white-space: nowrap; }
.viewer-credit a { color: var(--leaf-deep); }
@media (max-width: 620px) {
  .viewer-file-name { max-width: 40vw; }
  .viewer-credit { width: 100%; margin-left: 0; }
}
</style>
<script>
/* Menu behaviour is deliberately outside the module below: that module imports
   three.js over the network, and the menus should still open without it. */
document.addEventListener('DOMContentLoaded', () => {
  const menus = document.querySelectorAll('.rm');
  const closeMenus = () => menus.forEach(menu => menu.classList.remove('open'));
  menus.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
    event.stopPropagation();
    const open = menu.classList.contains('open');
    closeMenus();
    if (!open) menu.classList.add('open');
  }));
  /* Colour and slider rows stay put while they are being used, so their clicks
     never reach the bar handler or the document-level close handler. */
  document.querySelectorAll('.rm-dd .mi-row').forEach(row =>
    row.addEventListener('click', event => event.stopPropagation()));
  document.querySelector('.rm-bar').addEventListener('click', event => {
    const command = event.target.closest('[data-cmd]')?.dataset.cmd;
    if (!command) return;
    closeMenus();
    document.dispatchEvent(new CustomEvent('viewer-command', { detail: command }));
  });
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });
});
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="viewer-app">
  <nav class="rm-bar" aria-label="Model Viewer menu">
    <div class="rm">
      <button type="button">File</button>
      <div class="rm-dd">
        <button type="button" data-cmd="open"><span class="pixel-icon" data-icon="folder" aria-hidden="true"></span>Open model&hellip;</button>
      </div>
    </div>
    <div class="rm">
      <button type="button">View</button>
      <div class="rm-dd">
        <button type="button" data-cmd="fit"><span class="pixel-icon" data-icon="target" aria-hidden="true"></span>Fit to view</button>
        <button type="button" data-cmd="reset"><span class="pixel-icon" data-icon="reload" aria-hidden="true"></span>Reset view</button>
        <div class="sep"></div>
        <button type="button" data-cmd="wireframe" id="wireframe" aria-pressed="false"><span class="pixel-icon" data-icon="eye" aria-hidden="true"></span>Wireframe<span class="mi-check"></span></button>
        <button type="button" data-cmd="autorotate" id="autorotate" aria-pressed="true"><span class="pixel-icon" data-icon="repeat" aria-hidden="true"></span>Auto-rotate<span class="mi-check"></span></button>
        <button type="button" data-cmd="grid" id="grid-toggle" aria-pressed="true"><span class="pixel-icon" data-icon="grid-3x3" aria-hidden="true"></span>Show grid<span class="mi-check"></span></button>
      </div>
    </div>
    <div class="rm">
      <button type="button">Colours</button>
      <div class="rm-dd">
        <div class="mi-row">
          <label for="colour-model">Model</label>
          <input type="color" id="colour-model" value="#4fae7d">
        </div>
        <div class="mi-row">
          <label for="colour-grid">Grid</label>
          <input type="color" id="colour-grid" value="#276b47">
        </div>
        <div class="mi-row">
          <label for="colour-background">Background</label>
          <input type="color" id="colour-background" value="#f3ecd1">
        </div>
        <div class="sep"></div>
        <button type="button" data-cmd="grid" id="grid-toggle-colours" aria-pressed="true"><span class="pixel-icon" data-icon="grid-3x3" aria-hidden="true"></span>Show grid<span class="mi-check"></span></button>
        <button type="button" data-cmd="colours-reset"><span class="pixel-icon" data-icon="colors-swatch" aria-hidden="true"></span>Match ClackOS theme</button>
      </div>
    </div>
    <div class="rm">
      <button type="button">Lighting</button>
      <div class="rm-dd">
        <button type="button" data-cmd="light-studio" id="light-studio" aria-pressed="true"><span class="pixel-icon" data-icon="zap" aria-hidden="true"></span>Studio<span class="mi-check"></span></button>
        <button type="button" data-cmd="light-soft" id="light-soft" aria-pressed="false"><span class="pixel-icon" data-icon="circle" aria-hidden="true"></span>Soft box<span class="mi-check"></span></button>
        <button type="button" data-cmd="light-dramatic" id="light-dramatic" aria-pressed="false"><span class="pixel-icon" data-icon="invert" aria-hidden="true"></span>Dramatic<span class="mi-check"></span></button>
        <button type="button" data-cmd="light-flat" id="light-flat" aria-pressed="false"><span class="pixel-icon" data-icon="square" aria-hidden="true"></span>Flat<span class="mi-check"></span></button>
        <button type="button" data-cmd="light-unlit" id="light-unlit" aria-pressed="false"><span class="pixel-icon" data-icon="eye-off" aria-hidden="true"></span>No lighting<span class="mi-check"></span></button>
        <div class="sep"></div>
        <div class="mi-row">
          <label for="light-brightness">Brightness</label>
          <input type="range" id="light-brightness" min="40" max="200" step="5" value="100">
        </div>
        <button type="button" data-cmd="shadows" id="shadows" aria-pressed="true"><span class="pixel-icon" data-icon="eye" aria-hidden="true"></span>Shadows<span class="mi-check"></span></button>
        <div class="sep"></div>
        <div class="mi-row">
          <label for="colour-key">Key light</label>
          <input type="color" id="colour-key" value="#ffffff">
        </div>
        <div class="mi-row">
          <label for="colour-fill">Fill light</label>
          <input type="color" id="colour-fill" value="#8fcaa8">
        </div>
        <div class="mi-row">
          <label for="colour-sky">Sky</label>
          <input type="color" id="colour-sky" value="#f8f2dd">
        </div>
        <div class="mi-row">
          <label for="colour-ground">Ground bounce</label>
          <input type="color" id="colour-ground" value="#66755a">
        </div>
        <button type="button" data-cmd="lighting-reset"><span class="pixel-icon" data-icon="colors-swatch" aria-hidden="true"></span>Match ClackOS theme</button>
      </div>
    </div>
    <span class="viewer-file-name" id="viewer-file-name">PJ3410 round nut</span>
    <input id="model-file" type="file" accept=".stl,.step,.stp,.obj,.3mf" aria-label="Open an STL, STEP, OBJ or 3MF model" hidden>
  </nav>

  <main class="viewer-stage" id="viewer-stage" aria-label="Interactive 3D model viewport">
    <div class="viewer-busy" id="viewer-busy" role="status">Loading model…</div>
  </main>

  <footer class="viewer-status">
    <span><strong id="model-name">PJ3410 round nut</strong></span>
    <span id="model-stats">STL · sample</span>
    <span class="viewer-message" id="viewer-message">Ready — files stay in this browser.</span>
    <span class="viewer-credit">
      <a href="https://threejs.org/license/" target="_blank" rel="noreferrer">three.js · MIT</a>
      &nbsp;/&nbsp;
      <a href="https://github.com/kovacsv/occt-import-js" target="_blank" rel="noreferrer">OCCT importer · LGPL-2.1</a>
    </span>
  </footer>
</div>

<script type="module">
/* The scene, the loaders and the lighting rig live in assets/js/model-scene.js
   so the inline @[model] markdown embeds render exactly the same way; this file
   is the application shell around them — menus, status bar and file handling. */
import {
  createModelScene, LIGHTING_PRESETS, SCENE_COLOUR_KEYS, LIGHT_COLOUR_KEYS, asHex, formatFor, THREE
} from '../../assets/js/model-scene.js';

const stage = document.getElementById('viewer-stage');
const fileInput = document.getElementById('model-file');
const fileNameEl = document.getElementById('viewer-file-name');
const busy = document.getElementById('viewer-busy');
const nameEl = document.getElementById('model-name');
const statsEl = document.getElementById('model-stats');
const messageEl = document.getElementById('viewer-message');
const wireButton = document.getElementById('wireframe');
const rotateButton = document.getElementById('autorotate');
const gridButtons = [...document.querySelectorAll('[data-cmd="grid"]')];
const shadowButton = document.getElementById('shadows');
const colourInputs = {
  model: document.getElementById('colour-model'),
  grid: document.getElementById('colour-grid'),
  background: document.getElementById('colour-background'),
  key: document.getElementById('colour-key'),
  fill: document.getElementById('colour-fill'),
  sky: document.getElementById('colour-sky'),
  ground: document.getElementById('colour-ground')
};
const brightnessInput = document.getElementById('light-brightness');

const DEFAULT_MODEL_NAME = 'PJ3410 round nut';

const viewer = createModelScene(stage);

/* Models start spinning when they load, unless the user has turned it off. */
let autoRotateWanted = true;
let wireframeWanted = false;

function setToggleState(button, enabled) {
  if (!button) return;
  button.querySelector('.mi-check').textContent = enabled ? '✓' : '';
  button.setAttribute('aria-pressed', String(enabled));
}

function syncColourInputs() {
  Object.entries(colourInputs).forEach(([key, input]) => { input.value = asHex(viewer.colour(key)); });
}

function setWireframe(enabled) {
  wireframeWanted = enabled;
  viewer.setWireframe(enabled);
  setToggleState(wireButton, enabled);
}

function setAutoRotate(enabled) {
  viewer.setAutoRotate(enabled);
  setToggleState(rotateButton, enabled);
}

function setGridVisible(visible) {
  viewer.setGridVisible(visible);
  gridButtons.forEach(button => setToggleState(button, visible));
}

function setShadows(enabled) {
  viewer.setShadows(enabled);
  setToggleState(shadowButton, enabled);
}

function setLightingPreset(name) {
  viewer.setLightingPreset(name);
  Object.keys(LIGHTING_PRESETS).forEach(preset =>
    setToggleState(document.getElementById(`light-${preset}`), preset === name));
}

function setModel(root) {
  viewer.setModel(root);
  viewer.setWireframe(wireframeWanted);
  setAutoRotate(autoRotateWanted);
}

window.addEventListener('clackos-themechange', () => {
  viewer.refreshTheme();
  syncColourInputs();
});

function buildDemo() {
  const material = viewer.material;
  const root = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(72, 3, 44), material());
  board.castShadow = true;
  board.receiveShadow = true;
  root.add(board);

  const chip = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 16), material());
  chip.position.set(4, 4, 0);
  chip.castShadow = true;
  root.add(chip);

  [[-27, -14], [-27, 14], [27, -14], [27, 14]].forEach(([x, z]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 6, 24), material(null, { metalness: 0.5 }));
    post.position.set(x, 4.5, z);
    post.castShadow = true;
    root.add(post);
  });

  [-12, 12].forEach(z => {
    const connector = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 7), material());
    connector.position.set(28, 5.5, z);
    connector.castShadow = true;
    root.add(connector);
  });

  const socket = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 7, 32), material(null, { metalness: 0.75 }));
  socket.position.set(-15, 5, 0);
  socket.castShadow = true;
  root.add(socket);
  return root;
}

function showMessage(text, error = false) {
  messageEl.textContent = text;
  messageEl.classList.toggle('error', error);
}

async function openFile(file) {
  if (!formatFor(file.name)) {
    showMessage('Choose an STL, STEP, OBJ or 3MF file.', true);
    return;
  }

  busy.textContent = 'Reading model…';
  busy.classList.add('visible');
  showMessage('Opening locally…');
  try {
    const buffer = await file.arrayBuffer();
    const parsed = await viewer.parse(buffer, file.name, message => { busy.textContent = message; });
    wireframeWanted = false;
    setModel(parsed.root);
    setWireframe(false);
    nameEl.textContent = file.name;
    fileNameEl.textContent = file.name;
    const parts = parsed.parts ? ` · ${parsed.parts.toLocaleString()} parts` : '';
    const colours = parsed.ownColours ? ' · file colours' : '';
    statsEl.textContent = `${parsed.label} · ${parsed.triangles.toLocaleString()} triangles${parts}${colours}`;
    showMessage(parsed.ownColours
      ? 'Loaded locally — the model’s own colours are shown.'
      : 'Loaded locally — nothing was uploaded.');
  } catch (error) {
    console.error(error);
    showMessage(error.message || 'The model could not be opened.', true);
  } finally {
    busy.classList.remove('visible');
  }
}

fileInput.addEventListener('change', () => {
  const [file] = fileInput.files;
  if (file) openFile(file);
});

['dragenter', 'dragover'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.add('dragging');
}));
['dragleave', 'drop'].forEach(type => stage.addEventListener(type, event => {
  event.preventDefault();
  stage.classList.remove('dragging');
}));
stage.addEventListener('drop', event => {
  const [file] = event.dataTransfer.files;
  if (file) openFile(file);
});

function resetColours(keys) {
  keys.forEach(key => viewer.setColour(key, null));
  syncColourInputs();
}

document.addEventListener('viewer-command', event => {
  ({ open: () => fileInput.click(),
     fit: () => viewer.fitView(false),
     reset: () => viewer.fitView(true),
     wireframe: () => setWireframe(wireButton.getAttribute('aria-pressed') !== 'true'),
     autorotate: () => {
       autoRotateWanted = !viewer.autoRotate;
       setAutoRotate(autoRotateWanted);
     },
     grid: () => setGridVisible(!viewer.gridVisible),
     'colours-reset': () => resetColours(SCENE_COLOUR_KEYS),
     'lighting-reset': () => resetColours(LIGHT_COLOUR_KEYS),
     'light-studio': () => setLightingPreset('studio'),
     'light-soft': () => setLightingPreset('soft'),
     'light-dramatic': () => setLightingPreset('dramatic'),
     'light-flat': () => setLightingPreset('flat'),
     'light-unlit': () => setLightingPreset('unlit'),
     shadows: () => setShadows(shadowButton.getAttribute('aria-pressed') !== 'true')
   })[event.detail]?.();
});

Object.entries(colourInputs).forEach(([key, input]) =>
  input.addEventListener('input', event => viewer.setColour(key, event.target.value)));
brightnessInput.addEventListener('input', event =>
  viewer.setBrightness(Number(event.target.value) / 100));

/* The viewer opens on a real part — a PJ3410 jack round nut, triangulated from
   the STEP file so it loads without the STEP engine. The built demo assembly is
   the fallback if the file cannot be fetched. */
async function loadDefaultModel() {
  try {
    const response = await fetch('models/pj3410-round-nut.stl');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const parsed = await viewer.parse(await response.arrayBuffer(), 'pj3410-round-nut.stl');
    setModel(parsed.root);
    nameEl.textContent = DEFAULT_MODEL_NAME;
    fileNameEl.textContent = DEFAULT_MODEL_NAME;
    statsEl.textContent = `STL · ${parsed.triangles.toLocaleString()} triangles · sample`;
  } catch (error) {
    console.error(error);
    nameEl.textContent = 'Demo assembly';
    fileNameEl.textContent = 'Demo assembly';
    statsEl.textContent = '9 objects · sample';
  }
}

new ResizeObserver(() => viewer.resize()).observe(stage);
setModel(buildDemo());
setGridVisible(true);
setShadows(true);
setLightingPreset('studio');
syncColourInputs();
viewer.resize();
loadDefaultModel();
</script>
</body>
</html>
