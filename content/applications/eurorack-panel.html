    <script>
    (() => {
        const appRoot = window.ClackOSMountRoot || document.currentScript?.getRootNode() || document;
        const byId = id => appRoot.querySelector('#' + id);
        // --- State Management ---
        const state = {
            hp: 10,
            heightFormat: 128.5,
            tolerance: 0.3,
            holeStyle: 'oval',
            holeCountMode: 'auto',
            pcbHeight: 100,
            pcbTolerance: 0.5,
            showPanel: true,
            showPCB: true,
            layoutMode: 'overlaid', // 'overlaid' or 'sidebyside'
            kicadVersion: '10',
            projectName: 'Eurorack',
            pcbCount: 1,
            plating: {
                pth: true,
                fillFront: true,
                fillBack: true,
                railsExposed: true,
                connectGnd: true
            },
            guides: {
                x: { center: true, thirds: false, quarters: false, sixths: false, eighths: false },
                y: { center: true, thirds: false, quarters: false, sixths: false, eighths: false }
            }
        };

        // Board file format per KiCad release. Files tagged with a newer format version are
        // refused outright by older KiCad ("created with a more recent version"), and KiCad 7
        // has no `uuid` token at all — it wants `tstamp` instead.
        const KICAD_TARGETS = {
            '7':  { version: 20221018, schematicVersion: 20230121, generatorVersion: null,   useUuid: false },
            '8':  { version: 20240108, schematicVersion: 20231120, generatorVersion: '8.0',  useUuid: true },
            '9':  { version: 20241229, schematicVersion: 20250114, generatorVersion: '9.0',  useUuid: true },
            '10': { version: 20260206, schematicVersion: 20260306, generatorVersion: '10.0', useUuid: true }
        };

        // Pan/Zoom State
        let panX = 0, panY = 0, zoom = 1;
        let isDragging = false, startX = 0, startY = 0;
        let dragStartPanX = 0, dragStartPanY = 0, dragUnitsPerPixel = 1;
        let viewBoxAnimation = 0;
        let animateNextViewBox = false;

        // --- Math Helpers ---
        function getIrreducibleFractions(divisors) {
            const fractions = [];
            divisors.forEach(div => {
                for (let num = 1; num < div; num++) {
                    let isReducible = false;
                    for (let i = 2; i <= num; i++) {
                        if (num % i === 0 && div % i === 0) isReducible = true;
                    }
                    if (!isReducible) fractions.push(num / div);
                }
            });
            return [...new Set(fractions)].sort();
        }

        function getActiveGuideFractions(axisState) {
            let fractions = [];
            if (axisState.center) fractions.push(1/2);
            if (axisState.quarters) fractions.push(...getIrreducibleFractions([4]));
            if (axisState.thirds) fractions.push(...getIrreducibleFractions([3]));
            if (axisState.sixths) fractions.push(...getIrreducibleFractions([6]));
            if (axisState.eighths) fractions.push(...getIrreducibleFractions([8]));
            return fractions;
        }

        // --- Panel Math ---
        function calculatePanel() {
            const width = (state.hp * 5.08) - state.tolerance;
            const height = state.heightFormat;
            const holes = [];

            // Y positions (Doepfer standard is 3mm from top and bottom)
            const yTop = 3.0;
            const yBot = height - 3.0;

            let targetCount = 4;
            if (state.holeCountMode === 'auto') {
                targetCount = state.hp <= 8 ? 2 : 4;
            } else {
                targetCount = parseInt(state.holeCountMode);
            }

            const edgeOffset = 7.5;

            if (targetCount === 2) {
                let leftPoint = edgeOffset;
                if (state.hp <= 2) {
                    leftPoint = width / 2;
                }
                holes.push({ x: leftPoint, y: yTop });
                holes.push({ x: leftPoint, y: yBot });
            } else {
                holes.push({ x: edgeOffset, y: yTop });
                holes.push({ x: edgeOffset, y: yBot });

                let maxGridSteps = Math.floor((width - edgeOffset - 4) / 5.08);
                let rightHoleX = edgeOffset + (maxGridSteps * 5.08);

                holes.push({ x: rightHoleX, y: yTop });
                holes.push({ x: rightHoleX, y: yBot });

                if (targetCount === 6) {
                    let stepsToCenter = Math.round(((width / 2) - edgeOffset) / 5.08);
                    let xMid = edgeOffset + (stepsToCenter * 5.08);

                    if (xMid > edgeOffset + 1 && xMid < rightHoleX - 1) {
                        holes.push({ x: xMid, y: yTop });
                        holes.push({ x: xMid, y: yBot });
                    }
                }
            }

            return { width, height, holes };
        }

        // --- STREAMING_CHUNK: Pan, Zoom & Render... ---
        function applyTransform() {
            const masterGroup = byId('master-group');
            if (masterGroup) {
                masterGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoom})`);
            }
        }

        // How many viewBox units one screen pixel covers. preserveAspectRatio is "meet", so the
        // rendered scale is the smaller of the two axis ratios.
        function previewUnitsPerPixel() {
            const svg = byId('preview-svg');
            if (!svg) return 1;
            const viewBox = (svg.getAttribute('viewBox') || '').trim().split(/\s+/).map(Number);
            const rect = svg.getBoundingClientRect();
            if (viewBox.length !== 4 || viewBox.some(value => !Number.isFinite(value))) return 1;
            if (!(rect.width > 0) || !(rect.height > 0) || !(viewBox[2] > 0) || !(viewBox[3] > 0)) return 1;
            const scale = Math.min(rect.width / viewBox[2], rect.height / viewBox[3]);
            return scale > 0 ? 1 / scale : 1;
        }

        function applyViewBox(svg, target) {
            const targetValue = target.join(' ');
            const current = (svg.getAttribute('viewBox') || '').trim().split(/\s+/).map(Number);
            if (!animateNextViewBox || current.length !== 4 || current.some(value => !Number.isFinite(value))) {
                animateNextViewBox = false;
                svg.setAttribute('viewBox', targetValue);
                return;
            }

            animateNextViewBox = false;
            cancelAnimationFrame(viewBoxAnimation);
            const start = [...current];
            const startedAt = performance.now();
            const duration = 700;
            const frame = now => {
                const progress = Math.min(1, (now - startedAt) / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const values = start.map((value, index) => value + ((target[index] - value) * eased));
                svg.setAttribute('viewBox', values.join(' '));
                if (progress < 1) viewBoxAnimation = requestAnimationFrame(frame);
            };
            viewBoxAnimation = requestAnimationFrame(frame);
        }

        function updatePreview() {
            const metrics = calculatePanel();
            const pw = metrics.width;
            const ph = metrics.height;

            const pcbW = pw - (state.pcbTolerance * 2.0);
            const pcbH = state.pcbHeight;

            const dimBadge = byId('dimensions-badge');
            const boardTally = state.pcbCount > 1 ? ` ×${state.pcbCount}` : '';
            if (dimBadge) dimBadge.innerText = `Panel: ${pw.toFixed(1)}×${ph.toFixed(1)} | PCB: ${pcbW.toFixed(1)}×${pcbH.toFixed(1)}${boardTally}`;

            // Validate PCB height against the usable depth for the selected format.
            const heightInput = byId('pcb-height-input');
            const heightWarning = byId('pcb-height-warning');
            const previewCaution = byId('preview-caution');
            const maxPCBHeight = state.heightFormat === 39.65 ? 22.15 : (state.heightFormat === 43.2 ? 25.68 : 110);
            const formatName = state.heightFormat === 39.65 ? 'Intellijel 1U' : (state.heightFormat === 43.2 ? 'Pulp Logic 1U' : '3U');
            const heightTooLarge = state.pcbHeight > maxPCBHeight;
            if (heightInput && heightWarning) {
                heightWarning.textContent = heightTooLarge
                    ? `Too tall for ${formatName}; maximum ${maxPCBHeight.toFixed(2)} mm.`
                    : `Maximum for ${formatName}: ${maxPCBHeight.toFixed(2)} mm.`;
                if (heightTooLarge) {
                    heightInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
                    heightInput.classList.remove('border-gray-600', 'focus:ring-blue-500', 'focus:border-blue-500');
                    heightWarning.classList.add('text-red-400');
                    heightWarning.classList.remove('text-gray-500');
                } else {
                    heightInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
                    heightInput.classList.add('border-gray-600', 'focus:ring-blue-500', 'focus:border-blue-500');
                    heightWarning.classList.remove('text-red-400');
                    heightWarning.classList.add('text-gray-500');
                }
            }
            if (previewCaution) {
                previewCaution.hidden = !heightTooLarge;
                previewCaution.title = heightTooLarge
                    ? `PCB is ${state.pcbHeight.toFixed(2)} mm tall; ${formatName} supports up to ${maxPCBHeight.toFixed(2)} mm.`
                    : '';
            }

            let panelOffsetX = 0;
            let panelOffsetY = 0;
            let pcbOffsetX = 0;
            let pcbOffsetY = 0;
            let viewBoxW = 0;
            let viewBoxH = 0;

            // Extra boards are duplicates of the first: side by side they line up in a row, and
            // overlaid they fan out behind the panel so the count is readable at a glance.
            const boardCount = Math.max(1, state.pcbCount);
            const sideBySide = state.layoutMode === 'sidebyside';
            const boardGap = 18; // leaves room for the first board's height dimension
            const boardStep = pcbW + boardGap;
            // Overlaid mode is for checking one board against the panel, so it shows the jacks
            // and pots board only; the rest appear side by side.
            const visibleBoards = sideBySide ? boardCount : 1;
            const stackSpanW = pcbW + ((visibleBoards - 1) * boardStep);
            const stackSpanH = pcbH;

            if (sideBySide) {
                const gap = 15;
                if (state.showPanel && state.showPCB) {
                    panelOffsetX = 0;
                    panelOffsetY = Math.max(0, (pcbH - ph) / 2);
                    pcbOffsetX = pw + gap;
                    pcbOffsetY = Math.max(0, (ph - pcbH) / 2);
                    viewBoxW = pw + gap + stackSpanW;
                    viewBoxH = Math.max(ph, pcbH);
                } else if (state.showPanel) {
                    viewBoxW = pw; viewBoxH = ph;
                } else if (state.showPCB) {
                    viewBoxW = stackSpanW; viewBoxH = stackSpanH;
                }
            } else {
                if (state.showPanel && state.showPCB) {
                    panelOffsetX = 0;
                    panelOffsetY = Math.max(0, (pcbH - ph) / 2);
                    pcbOffsetX = (pw - pcbW) / 2;
                    pcbOffsetY = Math.max(0, (ph - pcbH) / 2);
                    viewBoxW = Math.max(pw, pcbOffsetX + stackSpanW);
                    viewBoxH = Math.max(ph, pcbOffsetY + stackSpanH);
                } else if (state.showPanel) {
                    viewBoxW = pw; viewBoxH = ph;
                } else if (state.showPCB) {
                    viewBoxW = stackSpanW; viewBoxH = stackSpanH;
                }
            }

            const panelGroup = byId('panel-group');
            const pcbGroup = byId('pcb-group');
            if (panelGroup) panelGroup.style.transform = `translate(${panelOffsetX}px, ${panelOffsetY}px)`;
            if (pcbGroup) pcbGroup.style.transform = `translate(${pcbOffsetX}px, ${pcbOffsetY}px)`;

            let panelOpacity = state.showPanel ? ((state.layoutMode === 'overlaid' && state.showPCB) ? 0.75 : 1.0) : 0;
            if (panelGroup) panelGroup.style.opacity = panelOpacity;
            if (pcbGroup) pcbGroup.style.opacity = state.showPCB ? 1.0 : 0;

            // Base ViewBox centering
            const padding = Math.max(viewBoxW, viewBoxH) * 0.15 + 15;
            const vX = -padding;
            const vY = -padding;
            const vW = viewBoxW + padding * 2;
            const vH = viewBoxH + padding * 2;
            const svgEl = byId('preview-svg');
            if (svgEl) applyViewBox(svgEl, [vX, vY, vW, vH]);

            // Panel Rendering
            let holesSVG = '';
            metrics.holes.forEach(hole => {
                const hx = hole.x;
                const hy = hole.y;
                if (state.plating.pth) {
                    if (state.holeStyle === 'oval') {
                        holesSVG += `<rect x="${hx - 2.3}" y="${hy - 1.8}" width="4.6" height="3.6" rx="1.8" fill="#b87333" />`;
                    } else {
                        holesSVG += `<circle cx="${hx}" cy="${hy}" r="1.8" fill="#b87333" />`;
                    }
                }
                if (state.holeStyle === 'oval') {
                    holesSVG += `<rect x="${hx - 2.1}" y="${hy - 1.6}" width="4.2" height="3.2" rx="1.6" class="fill-kicad-hole" />`;
                } else {
                    holesSVG += `<circle cx="${hx}" cy="${hy}" r="1.6" class="fill-kicad-hole" />`;
                }
            });

            const xFracs = getActiveGuideFractions(state.guides.x);
            const yFracs = getActiveGuideFractions(state.guides.y);

            let svgGuides = '';
            xFracs.forEach(f => {
                const gx = pw * f;
                svgGuides += `<line x1="${gx}" y1="0" x2="${gx}" y2="${ph}" stroke="#ec4899" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.8" />`;
            });
            yFracs.forEach(f => {
                const gy = ph * f;
                svgGuides += `<line x1="0" y1="${gy}" x2="${pw}" y2="${gy}" stroke="#ec4899" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.8" />`;
            });

            let frontFillSVG = '';
            if (state.plating.fillFront) {
                frontFillSVG = `<rect x="0.5" y="0.5" width="${pw - 1}" height="${ph - 1}" fill="none" stroke="#b87333" stroke-width="0.3" stroke-dasharray="1 1" opacity="0.7" />`;
            }

            // In overlaid mode, the panel width sits below the PCB width.
            const panelDimOffset = (state.layoutMode === 'overlaid' && state.showPCB) ? 18 : 7;
            const panelDimTextOffset = 5;
            let panelHtml = `
                <text x="${pw/2}" y="-3" fill="var(--ink)" font-size="3" font-weight="600" text-anchor="middle">${state.hp} HP PANEL</text>
                <rect x="0" y="0" width="${pw}" height="${ph}" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.5" rx="1" />
                ${frontFillSVG}
                ${svgGuides}
                ${holesSVG}
                <line x1="0" y1="${ph + panelDimOffset}" x2="${pw}" y2="${ph + panelDimOffset}" stroke="var(--ink)" stroke-width="0.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
                <line x1="0" y1="${ph}" x2="0" y2="${ph + panelDimOffset + 2}" stroke="var(--ink)" stroke-width="0.3" />
                <line x1="${pw}" y1="${ph}" x2="${pw}" y2="${ph + panelDimOffset + 2}" stroke="var(--ink)" stroke-width="0.3" />
                <text x="${pw/2}" y="${ph + panelDimOffset + panelDimTextOffset}" fill="var(--ink)" font-size="3.5" text-anchor="middle">${pw.toFixed(2)}</text>
                <line x1="${-panelDimOffset}" y1="0" x2="${-panelDimOffset}" y2="${ph}" stroke="var(--ink)" stroke-width="0.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
                <line x1="${-panelDimOffset - 2}" y1="0" x2="0" y2="0" stroke="var(--ink)" stroke-width="0.3" />
                <line x1="${-panelDimOffset - 2}" y1="${ph}" x2="0" y2="${ph}" stroke="var(--ink)" stroke-width="0.3" />
                <text x="${-panelDimOffset - panelDimTextOffset}" y="${ph/2}" fill="var(--ink)" font-size="3.5" text-anchor="middle" transform="rotate(-90 ${-panelDimOffset - panelDimTextOffset} ${ph/2})">${ph.toFixed(2)}</text>
            `;
            if (panelGroup) panelGroup.innerHTML = panelHtml;

            // PCB Rendering
            let pcbSvgGuides = '';
            const pcbOffsetXInside = state.pcbTolerance;
            const pcbOffsetYInside = (ph - pcbH) / 2;

            xFracs.forEach(f => {
                const localX = (pw * f) - pcbOffsetXInside;
                if (localX >= 0 && localX <= pcbW) {
                    pcbSvgGuides += `<line x1="${localX}" y1="0" x2="${localX}" y2="${pcbH}" stroke="#ec4899" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.6" />`;
                }
            });
            yFracs.forEach(f => {
                const localY = (ph * f) - pcbOffsetYInside;
                if (localY >= 0 && localY <= pcbH) {
                    pcbSvgGuides += `<line x1="0" y1="${localY}" x2="${pcbW}" y2="${localY}" stroke="#ec4899" stroke-width="0.3" stroke-dasharray="2,2" opacity="0.6" />`;
                }
            });

            const pcbDimOffset = 7;
            const pcbDimTextOffset = 5;
            // Put PCB height on the right so it remains distinct from the panel height.
            const pcbDimX = pcbW + pcbDimOffset;

            // Dimensions go on the first board only — the rest are identical copies of it — and
            // only side by side, where they have room. Overlaid they just clutter the panel.
            const pcbDimensionsHtml = `
                <line x1="0" y1="${pcbH + pcbDimOffset}" x2="${pcbW}" y2="${pcbH + pcbDimOffset}" stroke="var(--ink)" stroke-width="0.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
                <line x1="0" y1="${pcbH}" x2="0" y2="${pcbH + pcbDimOffset + 2}" stroke="var(--ink)" stroke-width="0.3" />
                <line x1="${pcbW}" y1="${pcbH}" x2="${pcbW}" y2="${pcbH + pcbDimOffset + 2}" stroke="var(--ink)" stroke-width="0.3" />
                <text x="${pcbW/2}" y="${pcbH + pcbDimOffset + pcbDimTextOffset}" fill="var(--ink)" font-size="3.5" text-anchor="middle">${pcbW.toFixed(2)}</text>
                <line x1="${pcbDimX}" y1="0" x2="${pcbDimX}" y2="${pcbH}" stroke="var(--ink)" stroke-width="0.3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
                <line x1="${pcbW}" y1="0" x2="${pcbDimX + 2}" y2="0" stroke="var(--ink)" stroke-width="0.3" />
                <line x1="${pcbW}" y1="${pcbH}" x2="${pcbDimX + 2}" y2="${pcbH}" stroke="var(--ink)" stroke-width="0.3" />
                <text x="${pcbDimX + pcbDimTextOffset}" y="${pcbH/2}" fill="var(--ink)" font-size="3.5" text-anchor="middle" transform="rotate(-90 ${pcbDimX + pcbDimTextOffset} ${pcbH/2})">${pcbH.toFixed(2)}</text>`;

            const boardLabel = index => boardCount === 1 ? 'MAIN PCB' : (index === 0 ? 'JACK / POTS' : `PCB ${index}`);

            let pcbHtml = '';
            // Drawn back to front so the first board — the one carrying the dimensions — sits on top.
            for (let index = visibleBoards - 1; index >= 0; index--) {
                // Titled above the board, matching the panel. Overlaid there is nowhere to put a
                // caption that is not on top of the panel, so the board goes untitled.
                const title = sideBySide
                    ? `<text x="${pcbW/2}" y="-3" fill="var(--ink)" font-size="3" font-weight="600" text-anchor="middle">${boardLabel(index)}</text>`
                    : '';
                pcbHtml += `
                <g transform="translate(${index * boardStep}, 0)">
                    ${title}
                    <rect x="0" y="0" width="${pcbW}" height="${pcbH}" fill="#064e3b" stroke="var(--ink)" stroke-width="0.5" />
                    ${pcbSvgGuides}
                    ${(index === 0 && sideBySide) ? pcbDimensionsHtml : ''}
                </g>`;
            }
            if (pcbGroup) pcbGroup.innerHTML = pcbHtml;
        }

        // --- STREAMING_CHUNK: KiCAD Generation... ---
        function generateUUID() {
            return crypto.randomUUID();
        }

        function kicadTarget() {
            return KICAD_TARGETS[state.kicadVersion] || KICAD_TARGETS['10'];
        }

        // KiCad 8 renamed the per-item `tstamp` token to `uuid`; KiCad 7 only knows `tstamp`.
        function idTag() {
            const id = generateUUID();
            return kicadTarget().useUuid ? `(uuid "${id}")` : `(tstamp ${id})`;
        }

        function kicadHeader(generatorName) {
            const target = kicadTarget();
            // `generator_version` arrived with KiCad 8; KiCad 7 rejects the token.
            const genVersion = target.generatorVersion ? ` (generator_version "${target.generatorVersion}")` : '';
            return `(kicad_pcb (version ${target.version}) (generator "${generatorName}")${genVersion}`;
        }

        // Canonical KiCad layer indices — non-copper layers are matched by name, but keeping the
        // numbers correct avoids surprises. Copper layers must come first.
        const KICAD_LAYERS = `  (layers
    (0 "F.Cu" signal)
    (31 "B.Cu" signal)
    (36 "B.SilkS" user "B.Silkscreen")
    (37 "F.SilkS" user "F.Silkscreen")
    (38 "B.Mask" user)
    (39 "F.Mask" user)
    (43 "Eco2.User" user "Dimensions")
    (44 "Edge.Cuts" user)
    (48 "B.Fab" user)
    (49 "F.Fab" user)
    (51 "User.2" user "Guides")
  )`;

        function generateKiCAD() {
            const metrics = calculatePanel();

            const pageCenterX = 148.5;
            const pageCenterY = 105.0;
            const offsetX = pageCenterX - (metrics.width / 2);
            const offsetY = pageCenterY - (metrics.height / 2);

            const isPTH = state.plating.pth;
            const padShape = state.holeStyle === 'oval' ? 'oval' : 'circle';
            let padSize = state.holeStyle === 'oval' ? '4.6 3.6' : '3.6 3.6';
            if (!isPTH) {
                padSize = state.holeStyle === 'oval' ? '4.2 3.2' : '3.2 3.2';
            }

            const drillDef = state.holeStyle === 'oval' ? 'oval 4.2 3.2' : '3.2';
            const padType = isPTH ? 'thru_hole' : 'np_thru_hole';
            const gndNetStr = state.plating.connectGnd ? '(net 1 "GND") (zone_connect 2)' : '';

            const footprints = metrics.holes.map(hole => `
  (footprint "MountingHole:MountingHole_3.2mm_M3" (layer "F.Cu")
    ${idTag()}
    (at ${(hole.x + offsetX).toFixed(4)} ${(hole.y + offsetY).toFixed(4)})
    (attr exclude_from_pos_files exclude_from_bom)
    (pad "1" ${padType} ${padShape} (at 0 0) (size ${padSize}) (drill ${drillDef}) (layers "*.Cu" "*.Mask") ${gndNetStr} ${idTag()})
  )`).join("");

            const dimLayer = 'Eco2.User';
            const dimensions = `
  (dimension (type aligned) (layer "${dimLayer}") ${idTag()}
    (pts (xy ${offsetX.toFixed(4)} ${offsetY.toFixed(4)}) (xy ${(metrics.width + offsetX).toFixed(4)} ${offsetY.toFixed(4)}))
    (height -5)
    (gr_text "${metrics.width.toFixed(2)} mm" (at ${(offsetX + metrics.width/2).toFixed(4)} ${(offsetY - 5).toFixed(4)}) (layer "${dimLayer}") ${idTag()}
      (effects (font (size 1.5 1.5) (thickness 0.3)))
    )
    (format (units 3) (units_format 1) (precision 2))
    (style (thickness 0.15))
  )`;

            let kicadGuides = "";
            const xFracs = getActiveGuideFractions(state.guides.x);
            const yFracs = getActiveGuideFractions(state.guides.y);

            xFracs.forEach(f => {
                const x = offsetX + (metrics.width * f);
                kicadGuides += `\n  (gr_line (start ${x.toFixed(4)} ${offsetY.toFixed(4)}) (end ${x.toFixed(4)} ${(metrics.height + offsetY).toFixed(4)}) (layer "User.2") ${idTag()} (stroke (width 0.15) (type solid)))`;
            });
            yFracs.forEach(f => {
                const y = offsetY + (metrics.height * f);
                kicadGuides += `\n  (gr_line (start ${offsetX.toFixed(4)} ${y.toFixed(4)}) (end ${(metrics.width + offsetX).toFixed(4)} ${y.toFixed(4)}) (layer "User.2") ${idTag()} (stroke (width 0.15) (type solid)))`;
            });

            let kicadZones = "";
            const zoneLayers = [];
            if (state.plating.fillFront) zoneLayers.push('"F.Cu"');
            if (state.plating.fillBack) zoneLayers.push('"B.Cu"');

            if (zoneLayers.length > 0) {
                const netNum = state.plating.connectGnd ? '1' : '0';
                const netName = state.plating.connectGnd ? 'GND' : '';
                kicadZones = `
  (zone (net ${netNum}) (net_name "${netName}") (layers ${zoneLayers.join(" ")}) ${idTag()}
    (hatch edge 0.5)
    (connect_pads (clearance 0.5))
    (min_thickness 0.25)
    (fill yes (thermal_gap 0.5) (thermal_bridge_width 0.5))
    (polygon
      (pts
        (xy ${(offsetX - 1).toFixed(4)} ${(offsetY - 1).toFixed(4)})
        (xy ${(offsetX + metrics.width + 1).toFixed(4)} ${(offsetY - 1).toFixed(4)})
        (xy ${(offsetX + metrics.width + 1).toFixed(4)} ${(offsetY + metrics.height + 1).toFixed(4)})
        (xy ${(offsetX - 1).toFixed(4)} ${(offsetY + metrics.height + 1).toFixed(4)})
      )
    )
  )`;
            }

            let maskRects = "";
            if (state.plating.railsExposed) {
                const topMaskY = offsetY + 10.0;
                const botMaskY = offsetY + metrics.height - 10.0;
                maskRects = `
  (gr_poly (pts (xy ${offsetX.toFixed(4)} ${offsetY.toFixed(4)}) (xy ${(offsetX + metrics.width).toFixed(4)} ${offsetY.toFixed(4)}) (xy ${(offsetX + metrics.width).toFixed(4)} ${topMaskY.toFixed(4)}) (xy ${offsetX.toFixed(4)} ${topMaskY.toFixed(4)})) (layer "B.Mask") ${idTag()} (stroke (width 0) (type solid)) (fill solid))
  (gr_poly (pts (xy ${offsetX.toFixed(4)} ${botMaskY.toFixed(4)}) (xy ${(offsetX + metrics.width).toFixed(4)} ${botMaskY.toFixed(4)}) (xy ${(offsetX + metrics.width).toFixed(4)} ${(offsetY + metrics.height).toFixed(4)}) (xy ${offsetX.toFixed(4)} ${(offsetY + metrics.height).toFixed(4)})) (layer "B.Mask") ${idTag()} (stroke (width 0) (type solid)) (fill solid))`;
            }

            const kicadPCB = `${kicadHeader('EurorackFaceplateGen')}
  (general
    (thickness 1.6)
  )
  (paper "A4")
${KICAD_LAYERS}
  (net 0 "")
  (net 1 "GND")
  ${footprints}${dimensions}${kicadGuides}${kicadZones}${maskRects}
  (gr_line (start ${offsetX.toFixed(4)} ${offsetY.toFixed(4)}) (end ${(metrics.width + offsetX).toFixed(4)} ${offsetY.toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${(metrics.width + offsetX).toFixed(4)} ${offsetY.toFixed(4)}) (end ${(metrics.width + offsetX).toFixed(4)} ${(metrics.height + offsetY).toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${(metrics.width + offsetX).toFixed(4)} ${(metrics.height + offsetY).toFixed(4)}) (end ${offsetX.toFixed(4)} ${(metrics.height + offsetY).toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${offsetX.toFixed(4)} ${(metrics.height + offsetY).toFixed(4)}) (end ${offsetX.toFixed(4)} ${offsetY.toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
)`;
            return kicadPCB;
        }

        function generateMainPCBKiCAD() {
            const metrics = calculatePanel();
            const pageCenterX = 148.5;
            const pageCenterY = 105.0;
            const panelOriginX = pageCenterX - (metrics.width / 2);
            const panelOriginY = pageCenterY - (metrics.height / 2);
            const pcbWidth = metrics.width - (state.pcbTolerance * 2.0);
            const pcbHeight = state.pcbHeight;
            const pcbOriginX = panelOriginX + state.pcbTolerance;
            const pcbOriginY = pageCenterY - (pcbHeight / 2);

            const edgeCuts = `
  (gr_line (start ${pcbOriginX.toFixed(4)} ${pcbOriginY.toFixed(4)}) (end ${(pcbOriginX + pcbWidth).toFixed(4)} ${pcbOriginY.toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${(pcbOriginX + pcbWidth).toFixed(4)} ${pcbOriginY.toFixed(4)}) (end ${(pcbOriginX + pcbWidth).toFixed(4)} ${(pcbOriginY + pcbHeight).toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${(pcbOriginX + pcbWidth).toFixed(4)} ${(pcbOriginY + pcbHeight).toFixed(4)}) (end ${pcbOriginX.toFixed(4)} ${(pcbOriginY + pcbHeight).toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))
  (gr_line (start ${pcbOriginX.toFixed(4)} ${(pcbOriginY + pcbHeight).toFixed(4)}) (end ${pcbOriginX.toFixed(4)} ${pcbOriginY.toFixed(4)}) (layer "Edge.Cuts") ${idTag()} (stroke (width 0.1) (type solid)))`;

            let ffab = `
  (gr_line (start ${panelOriginX.toFixed(4)} ${panelOriginY.toFixed(4)}) (end ${(panelOriginX + metrics.width).toFixed(4)} ${panelOriginY.toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type dash)))
  (gr_line (start ${(panelOriginX + metrics.width).toFixed(4)} ${panelOriginY.toFixed(4)}) (end ${(panelOriginX + metrics.width).toFixed(4)} ${(panelOriginY + metrics.height).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type dash)))
  (gr_line (start ${(panelOriginX + metrics.width).toFixed(4)} ${(panelOriginY + metrics.height).toFixed(4)}) (end ${panelOriginX.toFixed(4)} ${(panelOriginY + metrics.height).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type dash)))
  (gr_line (start ${panelOriginX.toFixed(4)} ${(panelOriginY + metrics.height).toFixed(4)}) (end ${panelOriginX.toFixed(4)} ${panelOriginY.toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type dash)))`;

            metrics.holes.forEach(hole => {
                const hx = panelOriginX + hole.x;
                const hy = panelOriginY + hole.y;
                if (state.holeStyle === 'oval') {
                    ffab += `
  (gr_line (start ${(hx - 0.5).toFixed(4)} ${(hy - 1.6).toFixed(4)}) (end ${(hx + 0.5).toFixed(4)} ${(hy - 1.6).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type solid)))
  (gr_line (start ${(hx - 0.5).toFixed(4)} ${(hy + 1.6).toFixed(4)}) (end ${(hx + 0.5).toFixed(4)} ${(hy + 1.6).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type solid)))
  (gr_arc (start ${(hx - 0.5).toFixed(4)} ${(hy - 1.6).toFixed(4)}) (mid ${(hx - 2.1).toFixed(4)} ${hy.toFixed(4)}) (end ${(hx - 0.5).toFixed(4)} ${(hy + 1.6).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type solid)))
  (gr_arc (start ${(hx + 0.5).toFixed(4)} ${(hy + 1.6).toFixed(4)}) (mid ${(hx + 2.1).toFixed(4)} ${hy.toFixed(4)}) (end ${(hx + 0.5).toFixed(4)} ${(hy - 1.6).toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type solid)))`;
                } else {
                    ffab += `\n  (gr_circle (center ${hx.toFixed(4)} ${hy.toFixed(4)}) (end ${(hx+1.6).toFixed(4)} ${hy.toFixed(4)}) (layer "F.Fab") ${idTag()} (stroke (width 0.15) (type solid)))`;
                }
            });

            const dimLayer = 'Eco2.User';
            const pcbDimensions = `
  (dimension (type aligned) (layer "${dimLayer}") ${idTag()}
    (pts (xy ${pcbOriginX.toFixed(4)} ${pcbOriginY.toFixed(4)}) (xy ${(pcbOriginX + pcbWidth).toFixed(4)} ${pcbOriginY.toFixed(4)}))
    (height -5)
    (gr_text "${pcbWidth.toFixed(2)} mm" (at ${(pcbOriginX + pcbWidth/2).toFixed(4)} ${(pcbOriginY - 5).toFixed(4)}) (layer "${dimLayer}") ${idTag()}
      (effects (font (size 1.5 1.5) (thickness 0.3)))
    )
    (format (units 3) (units_format 1) (precision 2))
    (style (thickness 0.15))
  )`;

            let kicadGuides = "";
            const xFracs = getActiveGuideFractions(state.guides.x);
            const yFracs = getActiveGuideFractions(state.guides.y);

            xFracs.forEach(f => {
                const x = panelOriginX + (metrics.width * f);
                kicadGuides += `\n  (gr_line (start ${x.toFixed(4)} ${pcbOriginY.toFixed(4)}) (end ${x.toFixed(4)} ${(pcbOriginY + pcbHeight).toFixed(4)}) (layer "User.2") ${idTag()} (stroke (width 0.15) (type solid)))`;
            });
            yFracs.forEach(f => {
                const y = panelOriginY + (metrics.height * f);
                kicadGuides += `\n  (gr_line (start ${pcbOriginX.toFixed(4)} ${y.toFixed(4)}) (end ${(pcbOriginX + pcbWidth).toFixed(4)} ${y.toFixed(4)}) (layer "User.2") ${idTag()} (stroke (width 0.15) (type solid)))`;
            });

            return `${kicadHeader('EurorackMainPCBGen')}
  (general
    (thickness 1.6)
  )
  (paper "A4")
${KICAD_LAYERS}${ffab}${edgeCuts}${pcbDimensions}${kicadGuides}
)`;
        }

        function generateProjectFile(baseName, sheetUuid) {
            // Mirrors KiCad's own blank project template; the schema version is deliberately the
            // oldest one so every release from 7 upwards migrates it without complaining.
            return JSON.stringify({
                board: { design_settings: { defaults: {}, diff_pair_dimensions: [], drc_exclusions: [], rules: {}, track_widths: [], via_dimensions: [] } },
                boards: [],
                libraries: { pinned_footprint_libs: [], pinned_symbol_libs: [] },
                meta: { filename: `${baseName}.kicad_pro`, version: 1 },
                net_settings: { classes: [], meta: { version: 0 } },
                pcbnew: { page_layout_descr_file: "" },
                sheets: [[sheetUuid, ""]],
                text_variables: {}
            }, null, 2) + '\n';
        }

        // An empty root sheet, so every folder is a complete KiCad project rather than a bare
        // board. The uuid has to match the `sheets` entry in the .kicad_pro.
        function generateSchematic(title) {
            const target = kicadTarget();
            const uuid = generateUUID();
            const modern = !!target.generatorVersion; // KiCad 8 onwards quotes these tokens
            const generator = modern ? '(generator "eeschema")' : '(generator eeschema)';
            const genVersion = modern ? ` (generator_version "${target.generatorVersion}")` : '';
            const uuidTag = modern ? `(uuid "${uuid}")` : `(uuid ${uuid})`;
            const content = `(kicad_sch (version ${target.schematicVersion}) ${generator}${genVersion}
  ${uuidTag}
  (paper "A4")
  (title_block
    (title "${title}")
  )
  (lib_symbols
  )
  (sheet_instances
    (path "/" (page "1"))
  )
)
`;
            return { uuid, content };
        }

        function generatePanelSVG() {
            const metrics = calculatePanel();
            let holesSVG = '';
            metrics.holes.forEach(hole => {
                if (state.holeStyle === 'oval') {
                    holesSVG += `<rect x="${(hole.x - 2.1).toFixed(4)}" y="${(hole.y - 1.6).toFixed(4)}" width="4.2" height="3.2" rx="1.6" fill="black" />`;
                } else {
                    holesSVG += `<circle cx="${hole.x.toFixed(4)}" cy="${hole.y.toFixed(4)}" r="1.6" fill="black" />`;
                }
            });
            return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n<svg width="${metrics.width}mm" height="${metrics.height}mm" viewBox="0 0 ${metrics.width} ${metrics.height}" xmlns="http://www.w3.org/2000/svg">\n<rect x="0" y="0" width="${metrics.width}" height="${metrics.height}" fill="none" stroke="black" stroke-width="0.1" />\n${holesSVG}\n</svg>`;
        }

        function formatSuffix() {
            return state.heightFormat === 39.65 ? "1U_Intellijel" : (state.heightFormat === 43.2 ? "1U_PulpLogic" : "3U");
        }

        function saveBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function triggerDownload() {
            saveBlob(new Blob([generateKiCAD()], { type: 'text/plain' }), `Panel_${state.hp}HP_${formatSuffix()}.kicad_pcb`);
        }

        function triggerSVGDownload() {
            saveBlob(new Blob([generatePanelSVG()], { type: 'image/svg+xml' }), `Panel_${state.hp}HP.svg`);
        }

        function triggerMainPCBDownload() {
            saveBlob(new Blob([generateMainPCBKiCAD()], { type: 'text/plain' }), `MainPCB_${state.hp}HP_${formatSuffix()}.kicad_pcb`);
        }

        // --- Minimal stored (uncompressed) zip writer ---
        let crcTable = null;
        function crc32(bytes) {
            if (!crcTable) {
                crcTable = new Uint32Array(256);
                for (let i = 0; i < 256; i++) {
                    let c = i;
                    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    crcTable[i] = c >>> 0;
                }
            }
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function buildZip(files) {
            const encoder = new TextEncoder();
            const now = new Date();
            const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
            const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

            const entries = files.map(file => {
                const name = encoder.encode(file.name);
                const data = encoder.encode(file.content);
                return { name, data, crc: crc32(data) };
            });

            let size = 0;
            entries.forEach(e => { size += 30 + e.name.length + e.data.length + 46 + e.name.length; });
            size += 22;

            const out = new Uint8Array(size);
            const view = new DataView(out.buffer);
            let offset = 0;
            const put = (bytes) => { out.set(bytes, offset); offset += bytes.length; };

            entries.forEach(entry => {
                entry.offset = offset;
                view.setUint32(offset, 0x04034B50, true);
                view.setUint16(offset + 4, 20, true);      // version needed
                view.setUint16(offset + 6, 0x0800, true);  // UTF-8 names
                view.setUint16(offset + 8, 0, true);       // stored, no compression
                view.setUint16(offset + 10, dosTime, true);
                view.setUint16(offset + 12, dosDate, true);
                view.setUint32(offset + 14, entry.crc, true);
                view.setUint32(offset + 18, entry.data.length, true);
                view.setUint32(offset + 22, entry.data.length, true);
                view.setUint16(offset + 26, entry.name.length, true);
                view.setUint16(offset + 28, 0, true);
                offset += 30;
                put(entry.name);
                put(entry.data);
            });

            const centralStart = offset;
            entries.forEach(entry => {
                view.setUint32(offset, 0x02014B50, true);
                view.setUint16(offset + 4, 20, true);      // version made by
                view.setUint16(offset + 6, 20, true);      // version needed
                view.setUint16(offset + 8, 0x0800, true);
                view.setUint16(offset + 10, 0, true);
                view.setUint16(offset + 12, dosTime, true);
                view.setUint16(offset + 14, dosDate, true);
                view.setUint32(offset + 16, entry.crc, true);
                view.setUint32(offset + 20, entry.data.length, true);
                view.setUint32(offset + 24, entry.data.length, true);
                view.setUint16(offset + 28, entry.name.length, true);
                view.setUint16(offset + 30, 0, true);      // extra length
                view.setUint16(offset + 32, 0, true);      // comment length
                view.setUint16(offset + 34, 0, true);      // disk number
                view.setUint16(offset + 36, 0, true);      // internal attrs
                view.setUint32(offset + 38, 0, true);      // external attrs
                view.setUint32(offset + 42, entry.offset, true);
                offset += 46;
                put(entry.name);
            });

            view.setUint32(offset, 0x06054B50, true);
            view.setUint16(offset + 4, 0, true);
            view.setUint16(offset + 6, 0, true);
            view.setUint16(offset + 8, entries.length, true);
            view.setUint16(offset + 10, entries.length, true);
            view.setUint32(offset + 12, offset - centralStart, true);
            view.setUint32(offset + 16, centralStart, true);
            view.setUint16(offset + 20, 0, true);

            return new Blob([out], { type: 'application/zip' });
        }

        function sanitiseProjectName(name) {
            const cleaned = (name || '').trim().replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^[._]+|[._]+$/g, '');
            return cleaned || 'Eurorack';
        }

        function formatName() {
            return state.heightFormat === 39.65 ? 'Intellijel 1U' : (state.heightFormat === 43.2 ? 'Pulp Logic 1U' : 'Standard 3U');
        }

        // The circuit board projects: the first carries the jacks and pots, any extras are
        // duplicates of it to develop separately.
        function pcbProjectNames(project) {
            const names = [`${project}_Jack_pots_PCB`];
            for (let i = 1; i < state.pcbCount; i++) names.push(`${project}_PCB_${i}`);
            return names;
        }

        function guideSummary(axisState) {
            const active = ['center', 'thirds', 'quarters', 'sixths', 'eighths'].filter(key => axisState[key]);
            if (!active.length) return 'none';
            return active.map(key => key === 'center' ? '1/2' : key).join(', ');
        }

        function buildReadme(project, folders) {
            const metrics = calculatePanel();
            const target = kicadTarget();
            const pcbWidth = metrics.width - (state.pcbTolerance * 2.0);
            const holeStyle = state.holeStyle === 'oval' ? 'M3 oval slot (3.2 x 4.2 mm)' : 'M3 round (3.2 mm)';
            const plating = [
                state.plating.pth ? 'plated through holes' : 'unplated holes',
                state.plating.fillFront ? 'front copper fill' : null,
                state.plating.fillBack ? 'back copper fill' : null,
                state.plating.railsExposed ? 'exposed back rails' : null,
                state.plating.connectGnd ? 'fills tied to GND' : null
            ].filter(Boolean).join(', ');

            const tree = folders.map(folder => {
                const lines = [`  ${folder.name}/`,
                    `    ${folder.name}.kicad_pro   KiCad project`,
                    `    ${folder.name}.kicad_pcb   board`,
                    `    ${folder.name}.kicad_sch   empty schematic, ready to draw in`];
                if (folder.svg) lines.push(`    ${folder.name}.svg         1:1 panel artwork for Inkscape or Illustrator`);
                return lines.join('\n');
            }).join('\n');

            return `${project} — Eurorack module project
Generated by the ClackOS Eurorack Panel Generator.

PANEL
  Width           ${state.hp} HP, ${metrics.width.toFixed(2)} mm wide (${state.tolerance} mm allowance removed)
  Height          ${metrics.height.toFixed(2)} mm (${formatName()})
  Mounting holes  ${metrics.holes.length} x ${holeStyle}
  Plating         ${plating}
  Guides          X: ${guideSummary(state.guides.x)}   Y: ${guideSummary(state.guides.y)}

CIRCUIT BOARDS (${state.pcbCount})
  Size            ${pcbWidth.toFixed(2)} x ${state.pcbHeight.toFixed(2)} mm (${state.pcbTolerance} mm/side allowance)
  The extra boards are duplicates of the first — same outline and guides, so
  they stack behind the panel. Develop each one separately.

FILES
${tree}
  README.txt

LAYERS
  Edge.Cuts   board outline
  User.2      alignment guides for jacks and pots
  Eco2.User   dimensions
  F.Fab       panel outline and hole positions, shown on the circuit boards

KICAD VERSION
  Written for KiCad ${state.kicadVersion} — board format ${target.version}, schematic format
  ${target.schematicVersion}. Newer releases open these files and offer to update them.
  Older releases refuse them outright, so if KiCad says the files were made
  with a more recent version, re-export with the KiCad version selector set
  to the release you actually run.

Open the .kicad_pro in each folder to start work.
`;
        }

        function triggerProjectDownload() {
            const project = sanitiseProjectName(state.projectName);
            const folders = [{ name: `${project}_panel`, board: generateKiCAD(), svg: generatePanelSVG() }];
            pcbProjectNames(project).forEach(name => {
                folders.push({ name, board: generateMainPCBKiCAD(), svg: null });
            });

            const files = [{ name: 'README.txt', content: buildReadme(project, folders) }];
            folders.forEach(folder => {
                const schematic = generateSchematic(folder.name);
                files.push({ name: `${folder.name}/${folder.name}.kicad_pro`, content: generateProjectFile(folder.name, schematic.uuid) });
                files.push({ name: `${folder.name}/${folder.name}.kicad_pcb`, content: folder.board });
                files.push({ name: `${folder.name}/${folder.name}.kicad_sch`, content: schematic.content });
                if (folder.svg) files.push({ name: `${folder.name}/${folder.name}.svg`, content: folder.svg });
            });

            saveBlob(buildZip(files), `${project}.zip`);
        }

        // --- STREAMING_CHUNK: Events Binding... ---
        function safeBind(id, event, handler) {
            const el = byId(id);
            if (el) el.addEventListener(event, handler);
        }

        function setupEventListeners() {
            appRoot.querySelectorAll('input[data-guide-axis]').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    state.guides[e.target.dataset.guideAxis][e.target.value] = e.target.checked;
                    updatePreview();
                });
            });

            safeBind('hp-input', 'input', e => { if (parseInt(e.target.value) > 0) { state.hp = parseInt(e.target.value); updatePreview(); } });
            safeBind('format-select', 'change', e => {
                state.heightFormat = parseFloat(e.target.value);
                if (state.heightFormat === 39.65) state.pcbHeight = 22.15;
                else if (state.heightFormat === 43.2) state.pcbHeight = 25.68;
                const heightInput = byId('pcb-height-input');
                if (heightInput) heightInput.value = state.pcbHeight;
                updatePreview();
            });
            safeBind('hole-select', 'change', e => { state.holeStyle = e.target.value; updatePreview(); });
            safeBind('hole-count-select', 'change', e => { state.holeCountMode = e.target.value; updatePreview(); });
            safeBind('tolerance-input', 'input', e => { if (!isNaN(parseFloat(e.target.value))) { state.tolerance = parseFloat(e.target.value); updatePreview(); } });
            safeBind('pcb-height-input', 'input', e => { if (!isNaN(parseFloat(e.target.value))) { state.pcbHeight = parseFloat(e.target.value); updatePreview(); } });
            safeBind('pcb-tolerance-input', 'input', e => { if (!isNaN(parseFloat(e.target.value))) { state.pcbTolerance = parseFloat(e.target.value); updatePreview(); } });

            safeBind('plating-pth', 'change', e => { state.plating.pth = e.target.checked; updatePreview(); });
            safeBind('plating-fill-front', 'change', e => { state.plating.fillFront = e.target.checked; updatePreview(); });
            safeBind('plating-fill-back', 'change', e => { state.plating.fillBack = e.target.checked; updatePreview(); });
            safeBind('plating-rails-exposed', 'change', e => { state.plating.railsExposed = e.target.checked; updatePreview(); });
            safeBind('plating-connect-gnd', 'change', e => { state.plating.connectGnd = e.target.checked; updatePreview(); });

            safeBind('kicad-version-select', 'change', e => { state.kicadVersion = e.target.value; });
            safeBind('project-name-input', 'input', e => { state.projectName = e.target.value; });
            safeBind('pcb-count-select', 'change', e => {
                state.pcbCount = parseInt(e.target.value, 10) || 1;
                animateNextViewBox = true;
                updatePreview();
            });

            // Keep at least one of the two visible: switching the last one off flips the other on.
            safeBind('show-panel-toggle', 'change', e => {
                state.showPanel = e.target.checked;
                if (!state.showPanel && !state.showPCB) {
                    state.showPCB = true;
                    const other = byId('show-pcb-toggle');
                    if (other) other.checked = true;
                }
                updatePreview();
            });
            safeBind('show-pcb-toggle', 'change', e => {
                state.showPCB = e.target.checked;
                if (!state.showPCB && !state.showPanel) {
                    state.showPanel = true;
                    const other = byId('show-panel-toggle');
                    if (other) other.checked = true;
                }
                updatePreview();
            });

            safeBind('layout-overlaid', 'click', () => {
                state.layoutMode = 'overlaid';
                animateNextViewBox = true;
                byId('layout-overlaid')?.classList.replace('bg-transparent', 'bg-gray-700');
                byId('layout-overlaid')?.classList.replace('text-gray-400', 'text-white');
                byId('layout-sidebyside')?.classList.replace('bg-gray-700', 'bg-transparent');
                byId('layout-sidebyside')?.classList.replace('text-white', 'text-gray-400');
                updatePreview();
            });

            safeBind('layout-sidebyside', 'click', () => {
                state.layoutMode = 'sidebyside';
                animateNextViewBox = true;
                byId('layout-sidebyside')?.classList.replace('bg-transparent', 'bg-gray-700');
                byId('layout-sidebyside')?.classList.replace('text-gray-400', 'text-white');
                byId('layout-overlaid')?.classList.replace('bg-gray-700', 'bg-transparent');
                byId('layout-overlaid')?.classList.replace('text-white', 'text-gray-400');
                updatePreview();
            });

            safeBind('download-panel-btn', 'click', triggerDownload);
            safeBind('download-svg-btn', 'click', triggerSVGDownload);
            safeBind('download-pcb-btn', 'click', triggerMainPCBDownload);
            safeBind('download-project-btn', 'click', triggerProjectDownload);

            // Pan and Zoom
            const container = byId('preview-container');
            const svgEl = byId('preview-svg');

            if (container && svgEl) {
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomFactor = 1.1;
                    if (e.deltaY < 0) zoom *= zoomFactor;
                    else zoom /= zoomFactor;
                    applyTransform();
                });

                container.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    isDragging = true;
                    // Pan lives in viewBox units, so convert the pointer delta into those units
                    // to keep the drag tracking the cursor 1:1 instead of racing ahead of it.
                    dragUnitsPerPixel = previewUnitsPerPixel();
                    startX = e.clientX;
                    startY = e.clientY;
                    dragStartPanX = panX;
                    dragStartPanY = panY;
                    svgEl.classList.replace('cursor-grab', 'cursor-grabbing');
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    panX = dragStartPanX + ((e.clientX - startX) * dragUnitsPerPixel);
                    panY = dragStartPanY + ((e.clientY - startY) * dragUnitsPerPixel);
                    applyTransform();
                });

                window.addEventListener('mouseup', () => {
                    isDragging = false;
                    svgEl.classList.replace('cursor-grabbing', 'cursor-grab');
                });

                container.addEventListener('dblclick', () => {
                    panX = 0; panY = 0; zoom = 1;
                    applyTransform();
                });
            }
        }

        // Browsers can restore form values across a reload, so trust the DOM over the defaults.
        function syncStateFromInputs() {
            const versionSelect = byId('kicad-version-select');
            if (versionSelect && KICAD_TARGETS[versionSelect.value]) state.kicadVersion = versionSelect.value;
            const projectInput = byId('project-name-input');
            if (projectInput) state.projectName = projectInput.value;
            const countSelect = byId('pcb-count-select');
            if (countSelect) state.pcbCount = parseInt(countSelect.value, 10) || 1;
        }

        setupEventListeners();
        syncStateFromInputs();
        updatePreview();
    })();
    </script>
</body>
</html>
