<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Appearance — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<script src="../../assets/js/backgrounds.js"></script>
<style>
.appearance-main { gap: 14px; }
.appearance-preview { height: 86px; border: 1px solid var(--ink); border-radius: 7px; background-color: var(--desktop); }
.appearance-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 12px; }
.appearance-row label { color: var(--control-text); font-weight: 500; }
.appearance-row select { width: 100%; }
.appearance-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
.appearance-actions .app-status { flex: 1; }
.appearance-buttons { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>
<div class="app">
  <main class="app-main appearance-main">
    <p class="app-lbl">Desktop appearance</p>
    <div class="appearance-preview" id="preview" aria-label="Background tile preview"></div>
    <div class="appearance-row"><label for="backgroundSelect">Background</label><select id="backgroundSelect"></select></div>
    <div class="appearance-row"><label for="themeSelect">Theme</label><select id="themeSelect"></select></div>
    <div class="appearance-actions">
      <p class="app-status" id="status">Loading website choices…</p>
      <div class="appearance-buttons">
        <button class="btn" id="cookieDefaultButton" title="Use this theme by default in this browser without changing the website">Set cookie default</button>
        <button class="btn" id="siteDefaultButton" title="Commit this theme as the website default through GitHub">Set to default…</button>
        <button class="btn primary" id="applyButton">Apply</button>
      </div>
    </div>
  </main>
</div>

<div class="paint-modal" id="siteDefaultModal" data-keep-open role="dialog" aria-modal="true" aria-labelledby="siteDefaultTitle">
  <form class="paint-modal-box paint-dialog" id="siteDefaultForm">
    <header><span id="siteDefaultTitle">Set website default theme</span><button type="button" data-close="siteDefaultModal" aria-label="Close">×</button></header>
    <div class="paint-dialog-body">
      <p class="app-status" id="siteDefaultSummary"></p>
      <label id="siteDefaultTokenRow">Fine-grained access token <span><input id="siteDefaultToken" type="password" autocomplete="off" required></span></label>
      <p class="app-status">Requires Contents read/write access for this repository. The token is kept only while this window remains open.</p>
      <p class="app-status" id="siteDefaultStatus"></p>
      <div class="paint-dialog-actions"><button type="button" class="btn ghost" data-close="siteDefaultModal">Cancel</button><button class="btn primary">Commit default</button></div>
    </div>
  </form>
</div>

<script>
(() => {
const appRoot = window.ClackOSMountRoot || document.currentScript?.getRootNode() || document;
const appBaseUrl = appRoot !== document ? new URL('content/applications/', location.href) : new URL('.', location.href);
const byId = id => appRoot.querySelector(`#${id}`);
const sendToClackOS = data => {
  if (appRoot !== document)
    appRoot.host.dispatchEvent(new CustomEvent('clackos-message', { detail: data, bubbles: true, composed: true }));
  else if (window.parent !== window) window.parent.postMessage(data, location.origin);
};
const THEME_KEY = 'clackos-theme';
const THEME_COOKIE = 'clackos-theme-default';
const WALLPAPER_KEY = 'clackos-wallpaper';
const CUSTOM_BG_KEY = 'clackos-custom-background';
const CUSTOM_BG_NAME = 'Custom paint tile';
const backgroundSelect = byId('backgroundSelect');
const themeSelect = byId('themeSelect');
const preview = byId('preview');
const status = byId('status');
let backgrounds = new Map();
let siteConfig = null;
let ghToken = '';

function addOption(select, value, label) {
  const option = document.createElement('option');
  option.value = value; option.textContent = label; select.appendChild(option);
}

function loadCustom() {
  try {
    const value = JSON.parse(localStorage.getItem(CUSTOM_BG_KEY));
    return value && /^data:image\/png;base64,/i.test(value.dataUrl || '') ? value : null;
  } catch { return null; }
}

function readCookie(name) {
  const prefix = encodeURIComponent(name) + '=';
  const item = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix));
  if (!item) return null;
  try { return decodeURIComponent(item.slice(prefix.length)); } catch { return null; }
}

function writeThemeCookie(theme) {
  document.cookie = `${encodeURIComponent(THEME_COOKIE)}=${encodeURIComponent(theme)}; Max-Age=31536000; Path=/; SameSite=Lax`;
}

function updatePreview() {
  const value = backgrounds.get(backgroundSelect.value);
  preview.style.backgroundImage = value ? `url("${value}")` : 'none';
}

async function load() {
  try {
    const response = await fetch(new URL(`../site.json?_clack=${Date.now()}`, appBaseUrl), { cache: 'no-store' });
    if (!response.ok) throw new Error(response.status);
    const site = await response.json();
    siteConfig = site;
    const websiteBackgrounds = await window.ClackOSBackgrounds.list(site);
    for (const item of websiteBackgrounds) {
      if (!/^[a-z0-9][a-z0-9._-]*\.(?:png|jpe?g|gif|webp|bmp)$/i.test(item.file || '')) continue;
      const url = new URL(`../../assets/backgrounds/${encodeURIComponent(item.file)}`, appBaseUrl).href;
      backgrounds.set(item.name, url); addOption(backgroundSelect, item.name, item.name);
    }
    const custom = loadCustom();
    if (custom) {
      backgrounds.set(CUSTOM_BG_NAME, custom.dataUrl);
      addOption(backgroundSelect, CUSTOM_BG_NAME, `${CUSTOM_BG_NAME} (${custom.name || 'paint-tile.png'})`);
    }
    for (const theme of [...new Set([site.theme, ...(site.themes || [])].filter(Boolean))]) addOption(themeSelect, theme, theme.replace(/\.css$/i, ''));
    let selectedBackground = site.background ? [...backgrounds.keys()].find(name => websiteBackgrounds.find(item => item.name === name)?.file === site.background) : '';
    const cookieTheme = readCookie(THEME_COOKIE);
    try {
      const savedBackground = localStorage.getItem(WALLPAPER_KEY);
      const savedTheme = localStorage.getItem(THEME_KEY) || cookieTheme;
      if (backgrounds.has(savedBackground)) selectedBackground = savedBackground;
      if ([...themeSelect.options].some(option => option.value === savedTheme)) themeSelect.value = savedTheme;
      else themeSelect.value = site.theme || themeSelect.options[0]?.value || '';
    } catch { themeSelect.value = [...themeSelect.options].some(option => option.value === cookieTheme) ? cookieTheme : site.theme || ''; }
    backgroundSelect.value = backgrounds.has(selectedBackground) ? selectedBackground : backgrounds.keys().next().value || '';
    updatePreview(); status.textContent = 'Choose a background and colour theme.';
  } catch (error) { status.textContent = `Could not load appearance settings (${error.message}).`; }
}

backgroundSelect.addEventListener('change', updatePreview);
byId('applyButton').addEventListener('click', () => {
  const wallpaper = backgroundSelect.value, theme = themeSelect.value;
  if (!backgrounds.has(wallpaper) || !theme) return;
  try {
    localStorage.setItem(WALLPAPER_KEY, wallpaper);
    localStorage.setItem(THEME_KEY, theme);
  } catch {}
  sendToClackOS({ type: 'clackos-appearance', wallpaper, theme });
  status.textContent = 'Appearance applied and saved for this browser.';
});

byId('cookieDefaultButton').addEventListener('click', () => {
  const theme = themeSelect.value;
  if (!theme) return;
  writeThemeCookie(theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  sendToClackOS({ type: 'clackos-appearance', theme });
  status.textContent = `${theme} is now this browser’s cookie default.`;
});

const b64utf8 = text => {
  const bytes = new TextEncoder().encode(text); let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
};
const fromB64 = value => new TextDecoder().decode(Uint8Array.from(atob(value.replace(/\n/g, '')), char => char.charCodeAt(0)));

async function openSiteDefault() {
  if (!siteConfig?.repo) { status.textContent = 'This website has no GitHub repository configured.'; return; }
  const theme = themeSelect.value;
  byId('siteDefaultSummary').textContent = `Set ${theme} as the default in ${siteConfig.repo} (${siteConfig.branch || 'main'}).`;
  byId('siteDefaultStatus').textContent = '';
  byId('siteDefaultToken').value = '';
  byId('siteDefaultTokenRow').style.display = ghToken ? 'none' : 'flex';
  byId('siteDefaultToken').required = !ghToken;
  byId('siteDefaultModal').classList.add('open');
  (ghToken ? appRoot.querySelector('#siteDefaultForm button.primary') : byId('siteDefaultToken')).focus();
}

async function commitSiteDefault(event) {
  event.preventDefault();
  const cfg = siteConfig, theme = themeSelect.value;
  const token = ghToken || byId('siteDefaultToken').value.trim();
  const commitStatus = byId('siteDefaultStatus');
  if (!cfg?.repo || !theme || !token) { commitStatus.textContent = 'A theme and access token are required.'; return; }
  const api = `https://api.github.com/repos/${cfg.repo}/contents/content/site.json`;
  const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  commitStatus.textContent = 'Reading the current website settings…';
  try {
    const currentResponse = await fetch(`${api}?ref=${encodeURIComponent(cfg.branch || 'main')}`, { headers });
    if (currentResponse.status === 401) throw new Error('Token was rejected (401).');
    if (!currentResponse.ok) throw new Error(`Could not read content/site.json (${currentResponse.status}).`);
    const current = await currentResponse.json();
    const remoteConfig = JSON.parse(fromB64(current.content));
    if (remoteConfig.theme === theme) {
      ghToken = token; commitStatus.textContent = `${theme} is already the website default.`;
      return;
    }
    remoteConfig.theme = theme;
    remoteConfig.themes = [...new Set([...(remoteConfig.themes || []), theme])];
    commitStatus.textContent = 'Committing the new website default…';
    const response = await fetch(api, {
      method: 'PUT', headers,
      body: JSON.stringify({
        message: `Set ${theme} as default website theme`,
        content: b64utf8(JSON.stringify(remoteConfig, null, 2) + '\n'),
        branch: cfg.branch || 'main', sha: current.sha
      })
    });
    if (response.status === 409) throw new Error('content/site.json changed on GitHub; reopen Appearance and try again.');
    if (!response.ok) throw new Error(`GitHub could not update the default (${response.status}): ${(await response.json()).message || ''}`);
    const result = await response.json();
    ghToken = token; siteConfig = remoteConfig;
    byId('siteDefaultModal').classList.remove('open');
    status.textContent = `Committed ${result.commit.sha.slice(0, 7)} — ${theme} is now the website default.`;
  } catch (error) { commitStatus.textContent = error.message; }
}

byId('siteDefaultButton').addEventListener('click', openSiteDefault);
byId('siteDefaultForm').addEventListener('submit', commitSiteDefault);
appRoot.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => byId(button.dataset.close).classList.remove('open')));
/* Modals marked data-keep-open hold typed-in work (tokens, commit details), so
 * they only close through the title bar × or Cancel. */
appRoot.querySelectorAll('.paint-modal:not([data-keep-open])').forEach(modal => modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('open'); }));

load();
})();
</script>
</body>
</html>
