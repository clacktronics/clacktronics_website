<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Sound Recorder — ClackOS</title>
<!-- crawler metadata — this app is a page in its own right, reachable from the
     plain mirror and linkable on its own, so it says what it is. -->
<meta name="robots" content="noindex,follow">
<meta name="description" content="Record audio from a microphone or input and save it locally.">
<link rel="canonical" href="https://clacktronics.co.uk/content/applications/recorder.html">
<meta property="og:site_name" content="Clacktronics">
<meta property="og:type" content="website">
<meta property="og:title" content="Sound Recorder — ClackOS">
<meta property="og:url" content="https://clacktronics.co.uk/content/applications/recorder.html">
<meta property="og:description" content="Record audio from a microphone or input and save it locally.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
/* compact, fixed-size layout */
.app-main { padding: 12px 14px 10px; gap: 10px; }
.rm-bar { padding: 0 6px; }
.rm > button { padding: 6px 10px; font-size: 11.5px; }
.rec-top { gap: 10px; }
.rec-counter { min-width: 72px; gap: 4px; }
.app-lbl { font-size: 9.5px; letter-spacing: 0.12em; }
.rec-pos, .rec-len { font-size: 11px; padding: 5px 7px; }
.rec-btns { gap: 6px; }
.rec-btns .btn { padding: 5px 8px; font-size: 11px; }
.rec-status { font-size: 10.5px; line-height: 1.4; min-height: 15px; margin-top: -2px; }
.app-panel { font-size: 10.5px; padding: 8px 10px; }
.rec-props { margin-top: 10px; }
</style>
<script src="../../assets/js/app-menu.js" defer></script>
<script src="../../assets/js/app-bar.js" defer></script>
<script src="../../assets/js/app-home.js" defer></script>
</head>
<body>
<div class="app">
  <div class="rm-bar">
    <div class="rm"><button>File</button><div class="rm-dd">
      <button data-cmd="new"><span class="pixel-icon" data-icon="file" aria-hidden="true"></span>New</button>
      <button data-cmd="open"><span class="pixel-icon" data-icon="folder" aria-hidden="true"></span>Open&hellip;</button>
      <button data-cmd="save" data-need="sound"><span class="pixel-icon" data-icon="save" aria-hidden="true"></span>Save</button>
      <button data-cmd="saveas" data-need="sound"><span class="pixel-icon" data-icon="download" aria-hidden="true"></span>Save As&hellip;</button>
      <button data-cmd="revert"><span class="pixel-icon" data-icon="reload" aria-hidden="true"></span>Revert</button>
      <div class="sep"></div>
      <button data-cmd="props"><span class="pixel-icon" data-icon="info-box" aria-hidden="true"></span>Properties</button>
    </div></div>
    <div class="rm"><button>Edit</button><div class="rm-dd">
      <button data-cmd="copy" data-need="sound"><span class="pixel-icon" data-icon="copy" aria-hidden="true"></span>Copy</button>
      <button data-cmd="paste-insert" data-need="clip"><span class="pixel-icon" data-icon="clipboard" aria-hidden="true"></span>Paste Insert</button>
      <button data-cmd="paste-mix" data-need="clip"><span class="pixel-icon" data-icon="plus-box" aria-hidden="true"></span>Paste Mix</button>
      <div class="sep"></div>
      <button data-cmd="insert-file"><span class="pixel-icon" data-icon="upload" aria-hidden="true"></span>Insert File&hellip;</button>
      <button data-cmd="mix-file"><span class="pixel-icon" data-icon="plus-box" aria-hidden="true"></span>Mix with File&hellip;</button>
      <div class="sep"></div>
      <button data-cmd="del-before" data-need="sound"><span class="pixel-icon" data-icon="trash" aria-hidden="true"></span>Delete Before Current Position</button>
      <button data-cmd="del-after" data-need="sound"><span class="pixel-icon" data-icon="trash" aria-hidden="true"></span>Delete After Current Position</button>
    </div></div>
    <div class="rm"><button>Effects</button><div class="rm-dd">
      <button data-cmd="vol-up" data-need="sound"><span class="pixel-icon" data-icon="volume" aria-hidden="true"></span>Increase Volume (by 25%)</button>
      <button data-cmd="vol-down" data-need="sound"><span class="pixel-icon" data-icon="volume" aria-hidden="true"></span>Decrease Volume</button>
      <div class="sep"></div>
      <button data-cmd="speed-up" data-need="sound"><span class="pixel-icon" data-icon="arrow-right" aria-hidden="true"></span>Increase Speed (by 100%)</button>
      <button data-cmd="speed-down" data-need="sound"><span class="pixel-icon" data-icon="arrow-left" aria-hidden="true"></span>Decrease Speed</button>
      <div class="sep"></div>
      <button data-cmd="echo" data-need="sound"><span class="pixel-icon" data-icon="repeat" aria-hidden="true"></span>Add Echo</button>
      <button data-cmd="reverse" data-need="sound"><span class="pixel-icon" data-icon="invert" aria-hidden="true"></span>Reverse</button>
    </div></div>
  </div>
  <div class="app-main">
    <div class="rec-top">
      <div class="rec-counter">
        <span class="app-lbl">Position:</span>
        <span class="rec-pos">0.00 sec.</span>
      </div>
      <canvas class="rec-scope" width="190" height="62" aria-label="Waveform display"></canvas>
      <div class="rec-counter">
        <span class="app-lbl">Length:</span>
        <span class="rec-len">0.00 sec.</span>
      </div>
    </div>
    <input class="rec-seek" type="range" min="0" max="1000" value="0" aria-label="Seek position">
    <div class="rec-btns">
      <button class="btn ghost" data-rec="rew" aria-label="Seek to start" title="Seek to start"><span class="pixel-icon icon-only" data-icon="arrow-bar-left" aria-hidden="true"></span></button>
      <button class="btn ghost" data-rec="fwd" aria-label="Seek to end" title="Seek to end"><span class="pixel-icon icon-only" data-icon="arrow-bar-right" aria-hidden="true"></span></button>
      <button class="btn ghost" data-rec="play" aria-label="Play" title="Play"><span class="pixel-icon icon-only" data-icon="play" aria-hidden="true"></span></button>
      <button class="btn ghost" data-rec="stop" aria-label="Stop" title="Stop"><span class="pixel-icon icon-only" data-icon="square" aria-hidden="true"></span></button>
      <button class="btn ghost rec-record" data-rec="rec" aria-label="Record" title="Record"><span class="pixel-icon icon-only" data-icon="circle" aria-hidden="true"></span></button>
    </div>
    <p class="app-status rec-status"></p>
    <div class="app-panel rec-props" hidden></div>
  </div>
</div>

<script>
(() => {
const appRoot = window.ClackOSMountRoot || document.currentScript?.getRootNode() || document;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---- audio helpers ---- */
function encodeWav(samples, rate) {
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}
async function decodeToMono(arrayBuffer, actx) {
  const buf = await actx.decodeAudioData(arrayBuffer);
  const ch = buf.numberOfChannels;
  const out = new Float32Array(buf.length);
  for (let c = 0; c < ch; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < buf.length; i++) out[i] += d[i] / ch;
  }
  return { samples: out, rate: buf.sampleRate };
}
function resampleLinear(src, srcRate, dstRate) {
  if (srcRate === dstRate) return src;
  const n = Math.round(src.length * dstRate / srcRate);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = i * srcRate / dstRate;
    const i0 = Math.floor(t), f = t - i0;
    out[i] = (src[i0] || 0) * (1 - f) + (src[i0 + 1] || 0) * f;
  }
  return out;
}

/* one clipboard shared by every recorder instance, whichever window or
 * tab it lives in, via BroadcastChannel */
let audioClipboard = null;
const clipBus = 'BroadcastChannel' in window ? new BroadcastChannel('clackos-audio-clipboard') : null;
if (clipBus) {
  clipBus.onmessage = e => {
    if (e.data.type === 'clip') {
      audioClipboard = { samples: new Float32Array(e.data.samples), rate: e.data.rate };
    } else if (e.data.type === 'clip?' && audioClipboard) {
      clipBus.postMessage({ type: 'clip', samples: audioClipboard.samples, rate: audioClipboard.rate });
    }
  };
  clipBus.postMessage({ type: 'clip?' });
}
const shareClip = () => {
  if (clipBus && audioClipboard)
    clipBus.postMessage({ type: 'clip', samples: audioClipboard.samples, rate: audioClipboard.rate });
};

/* ---- state ---- */
const posEl = appRoot.querySelector('.rec-pos');
const lenEl = appRoot.querySelector('.rec-len');
const status = appRoot.querySelector('.rec-status');
const canvas = appRoot.querySelector('.rec-scope');
const seek = appRoot.querySelector('.rec-seek');
const cx = canvas.getContext('2d');

let samples = null, rate = 48000, pos = 0;
let fileName = 'Untitled.wav';
let saved = null;                       /* snapshot for File -> Revert */
let audioCtx = null, analyser = null;
let recorder = null, stream = null, micSrc = null, chunks = [];
let source = null, playing = false, startAt = 0;
let raf = 0, recTimer = 0, playTimer = 0, recStart = 0;

const fmt = s => s.toFixed(2) + ' sec.';
const dur = () => samples ? samples.length / rate : 0;
const posIdx = () => Math.min(samples ? samples.length : 0, Math.round(pos * rate));
const clamp = x => Math.max(-1, Math.min(1, x));
const setPos = s => {
  posEl.textContent = fmt(s);
  seek.value = dur() ? Math.min(1000, s / dur() * 1000) : 0;
};
const refresh = () => {
  if (pos > dur()) pos = dur();
  lenEl.textContent = fmt(dur());
  setPos(pos);
};
const say = t => { status.textContent = t; };

/* ---- scope ---- */
const drawScope = data => {
  const w = canvas.width, h = canvas.height;
  cx.fillStyle = '#09140d';
  cx.fillRect(0, 0, w, h);
  cx.strokeStyle = '#4fae7d';
  cx.lineWidth = 2;
  cx.beginPath();
  if (!data) { cx.moveTo(0, h / 2); cx.lineTo(w, h / 2); }
  else for (let i = 0; i < data.length; i++) {
    const x = i / data.length * w, y = data[i] / 255 * h;
    i ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  cx.stroke();
};
const scopeLoop = () => {
  raf = requestAnimationFrame(scopeLoop);
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);
  drawScope(data);
};
const stopScope = () => { cancelAnimationFrame(raf); raf = 0; drawScope(null); };

/* the analyser is visualisation-only and never feeds the speakers,
 * so a live microphone can't feed back */
const ensureCtx = () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    rate = samples ? rate : audioCtx.sampleRate;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
};

/* ---- transport ---- */
async function record() {
  if (recorder || playing) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    say('Microphone unavailable or permission denied.');
    return;
  }
  ensureCtx();
  micSrc = audioCtx.createMediaStreamSource(stream);
  micSrc.connect(analyser);
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    micSrc.disconnect();
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    recorder = null;
    try {
      const dec = await decodeToMono(await blob.arrayBuffer(), audioCtx);
      /* like the original: the recording is inserted at the position */
      if (!samples || !samples.length) {
        samples = dec.samples;
        rate = dec.rate;
        pos = dur();
      } else {
        const add = resampleLinear(dec.samples, dec.rate, rate);
        const at = posIdx();
        const out = new Float32Array(samples.length + add.length);
        out.set(samples.subarray(0, at));
        out.set(add, at);
        out.set(samples.subarray(at), at + add.length);
        samples = out;
        pos = (at + add.length) / rate;
      }
      say(`Recorded ${fmt(dec.samples.length / dec.rate)} — inserted at position.`);
    } catch {
      say('Could not decode the recording.');
    }
    refresh();
  };
  recorder.start();
  recStart = performance.now();
  const base = dur(), basePos = pos;
  recTimer = setInterval(() => {
    const t = (performance.now() - recStart) / 1000;
    lenEl.textContent = fmt(base + t);
    posEl.textContent = fmt(basePos + t);
  }, 50);
  say('Recording…');
  if (!raf) scopeLoop();
}

function play() {
  if (!samples || !samples.length || recorder || playing) return;
  ensureCtx();
  const buf = audioCtx.createBuffer(1, samples.length, rate);
  buf.copyToChannel(samples, 0);
  source = audioCtx.createBufferSource();
  source.buffer = buf;
  source.connect(analyser);
  source.connect(audioCtx.destination);
  const offset = pos >= dur() - 0.01 ? 0 : pos;
  startAt = audioCtx.currentTime - offset;
  playing = true;
  say('Playing…');
  source.onended = () => {
    playing = false;
    clearInterval(playTimer);
    stopScope();
    pos = Math.min(dur(), audioCtx.currentTime - startAt);
    setPos(pos);
    say('Stopped.');
  };
  source.start(0, offset);
  if (!raf) scopeLoop();
  playTimer = setInterval(() => {
    pos = Math.min(dur(), audioCtx.currentTime - startAt);
    setPos(pos);
  }, 50);
}

const stopPlay = () => { if (source && playing) source.stop(); };
function stopAll() {
  if (recorder) {
    clearInterval(recTimer);
    recorder.stop();
    stopScope();
  } else {
    stopPlay();
  }
}

appRoot.querySelector('.rec-btns').addEventListener('click', e => {
  const btn = e.target.closest('[data-rec]');
  if (!btn) return;
  switch (btn.dataset.rec) {
    case 'rec': record(); break;
    case 'stop': stopAll(); break;
    case 'play': play(); break;
    case 'rew': stopPlay(); pos = 0; setPos(0); break;
    case 'fwd': stopPlay(); pos = dur(); setPos(pos); break;
  }
});
seek.addEventListener('input', () => {
  stopPlay();
  pos = seek.value / 1000 * dur();
  posEl.textContent = fmt(pos);
});

/* ---- edits ---- */
const snapshot = () => { saved = samples ? { samples: samples.slice(), rate, fileName } : null; };
function insertData(other, otherRate) {
  const add = resampleLinear(other, otherRate, rate);
  const at = posIdx();
  const out = new Float32Array((samples ? samples.length : 0) + add.length);
  if (samples) out.set(samples.subarray(0, at));
  out.set(add, at);
  if (samples) out.set(samples.subarray(at), at + add.length);
  samples = out;
  pos = (at + add.length) / rate;
}
function mixData(other, otherRate) {
  const add = resampleLinear(other, otherRate, rate);
  const at = posIdx();
  const out = new Float32Array(Math.max(samples ? samples.length : 0, at + add.length));
  if (samples) out.set(samples);
  for (let i = 0; i < add.length; i++) out[at + i] = clamp(out[at + i] + add[i]);
  samples = out;
}

const filePick = document.createElement('input');
filePick.type = 'file';
filePick.accept = 'audio/*,.wav';
let fileCb = null;
filePick.addEventListener('change', () => {
  const f = filePick.files[0];
  filePick.value = '';
  if (f && fileCb) fileCb(f);
});
const pickFile = cb => { fileCb = cb; filePick.click(); };
const decodeFile = async f => {
  ensureCtx();
  return decodeToMono(await f.arrayBuffer(), audioCtx);
};

function saveWav(as) {
  if (!samples || !samples.length) { say('Nothing to save.'); return; }
  if (as) {
    const n = prompt('Save as:', fileName);
    if (!n) return;
    fileName = /\.wav$/i.test(n) ? n : n + '.wav';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(encodeWav(samples, rate));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  snapshot();
  say(`Saved ${fileName} (downloaded).`);
}

function showProps() {
  const el = appRoot.querySelector('.rec-props');
  el.hidden = !el.hidden;
  if (el.hidden) return;
  el.innerHTML = samples && samples.length
    ? `<b>${esc(fileName)}</b><br>Length: ${fmt(dur())}<br>Sample rate: ${rate} Hz<br>` +
      `Format: 16-bit mono PCM (.wav)<br>Data size: ${(samples.length * 2 / 1024).toFixed(1)} KB`
    : 'No sound loaded.';
}

async function runCmd(cmd) {
  stopAll();
  switch (cmd) {
    case 'new':
      samples = new Float32Array(0);
      pos = 0;
      fileName = 'Untitled.wav';
      snapshot();
      refresh();
      say('New sound.');
      break;
    case 'open':
      pickFile(async f => {
        try {
          const dec = await decodeFile(f);
          samples = dec.samples;
          rate = dec.rate;
          pos = 0;
          fileName = f.name.replace(/\.[^.]+$/, '') + '.wav';
          snapshot();
          refresh();
          say(`Opened ${f.name}.`);
        } catch { say(`Could not decode ${f.name}.`); }
      });
      break;
    case 'save': saveWav(false); break;
    case 'saveas': saveWav(true); break;
    case 'revert':
      if (saved) {
        samples = saved.samples.slice();
        rate = saved.rate;
        fileName = saved.fileName;
      } else {
        samples = null;
      }
      pos = 0;
      refresh();
      say('Reverted to last saved sound.');
      break;
    case 'props': showProps(); break;
    case 'copy':
      audioClipboard = { samples: samples.slice(), rate };
      shareClip();
      say('Copied whole sound to the clipboard.');
      break;
    case 'paste-insert':
      insertData(audioClipboard.samples, audioClipboard.rate);
      refresh();
      say('Clipboard inserted at position.');
      break;
    case 'paste-mix':
      mixData(audioClipboard.samples, audioClipboard.rate);
      refresh();
      say('Clipboard mixed in at position.');
      break;
    case 'insert-file':
      pickFile(async f => {
        try {
          const dec = await decodeFile(f);
          insertData(dec.samples, dec.rate);
          refresh();
          say(`${f.name} inserted at position.`);
        } catch { say(`Could not decode ${f.name}.`); }
      });
      break;
    case 'mix-file':
      pickFile(async f => {
        try {
          const dec = await decodeFile(f);
          mixData(dec.samples, dec.rate);
          refresh();
          say(`${f.name} mixed in at position.`);
        } catch { say(`Could not decode ${f.name}.`); }
      });
      break;
    case 'del-before':
      samples = samples.slice(posIdx());
      pos = 0;
      refresh();
      say('Deleted everything before the position.');
      break;
    case 'del-after':
      samples = samples.slice(0, posIdx());
      pos = dur();
      refresh();
      say('Deleted everything after the position.');
      break;
    case 'vol-up': {
      const out = samples.slice();
      for (let i = 0; i < out.length; i++) out[i] = clamp(out[i] * 1.25);
      samples = out;
      say('Volume increased by 25%.');
      break;
    }
    case 'vol-down': {
      const out = samples.slice();
      for (let i = 0; i < out.length; i++) out[i] *= 0.8;
      samples = out;
      say('Volume decreased.');
      break;
    }
    case 'speed-up': {
      const out = new Float32Array(Math.floor(samples.length / 2));
      for (let i = 0; i < out.length; i++) out[i] = samples[i * 2];
      samples = out;
      refresh();
      say('Speed doubled (pitch goes up, like the original).');
      break;
    }
    case 'speed-down': {
      const out = new Float32Array(samples.length * 2);
      for (let i = 0; i < out.length; i++) {
        const t = i / 2, i0 = Math.floor(t), f = t - i0;
        out[i] = (samples[i0] || 0) * (1 - f) + (samples[i0 + 1] || 0) * f;
      }
      samples = out;
      refresh();
      say('Speed halved (pitch goes down, like the original).');
      break;
    }
    case 'echo': {
      const d = Math.round(0.2 * rate);
      const out = samples.slice();
      for (let i = d; i < out.length; i++) out[i] = clamp(out[i] + samples[i - d] * 0.5);
      samples = out;
      say('Echo added.');
      break;
    }
    case 'reverse':
      samples = samples.slice().reverse();
      say('Reversed.');
      break;
  }
}

/* ---- menu bar ---- */
const rms = appRoot.querySelectorAll('.rm');
const closeRm = () => rms.forEach(m => m.classList.remove('open'));
rms.forEach(m => {
  m.querySelector(':scope > button').addEventListener('click', e => {
    e.stopPropagation();
    const was = m.classList.contains('open');
    closeRm();
    if (!was) {
      const hasSound = !!(samples && samples.length);
      m.querySelectorAll('[data-need="sound"]').forEach(b => { b.disabled = !hasSound; });
      m.querySelectorAll('[data-need="clip"]').forEach(b => { b.disabled = !audioClipboard; });
      m.classList.add('open');
    }
  });
});
appRoot.querySelector('.rm-bar').addEventListener('click', e => {
  const cmd = e.target.closest('[data-cmd]');
  if (!cmd || cmd.disabled) return;
  closeRm();
  runCmd(cmd.dataset.cmd);
});
appRoot.addEventListener('click', closeRm);

if (appRoot !== document) appRoot.host.addEventListener('clackos-disconnect', () => {
  clearInterval(recTimer);
  clearInterval(playTimer);
  cancelAnimationFrame(raf);
  if (source) { source.onended = null; try { source.stop(); } catch {} }
  if (recorder && recorder.state !== 'inactive') { recorder.onstop = null; try { recorder.stop(); } catch {} }
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (audioCtx) audioCtx.close().catch(() => {});
  if (clipBus) clipBus.close();
}, { once: true });

drawScope(null);
})();
</script>
</body>
</html>
