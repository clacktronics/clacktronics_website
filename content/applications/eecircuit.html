<script>
/* skin the (same-origin) app without touching the vendored files */
const sim = document.getElementById('sim');
sim.addEventListener('load', () => {
  try {
    const doc = sim.contentDocument;
    const add = href => {
      const l = doc.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      doc.head.appendChild(l);
      return l;
    };
    add('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    add(new URL('../../assets/themes/clackos.css', location.href).href);
    const skin = add(new URL('../../assets/css/eecircuit-skin.css', location.href).href);
    setTimeout(() => doc.head.appendChild(skin), 2500);
  } catch (e) { console.warn('could not skin EEcircuit:', e); }
});
</script>
