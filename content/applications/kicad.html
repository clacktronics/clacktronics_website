<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>KiCAD Viewer — ClackOS</title>
<!-- crawler metadata — this app is a page in its own right, reachable from the
     plain mirror and linkable on its own, so it says what it is. -->
<meta name="description" content="View KiCad schematics and PCB layouts in the browser — open a .kicad_sch or .kicad_pcb file and pan, zoom and inspect it with no KiCad install.">
<link rel="canonical" href="https://clacktronics.co.uk/content/applications/kicad.html">
<meta property="og:site_name" content="Clacktronics">
<meta property="og:type" content="website">
<meta property="og:title" content="KiCAD Viewer — ClackOS">
<meta property="og:url" content="https://clacktronics.co.uk/content/applications/kicad.html">
<meta property="og:description" content="View KiCad schematics and PCB layouts in the browser — open a .kicad_sch or .kicad_pcb file and pan, zoom and inspect it with no KiCad install.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
.kv-status {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  min-height: 32px; padding: 6px 16px; border-bottom: 1px solid var(--paper-line);
  background: var(--paper-deep);
}
.kv-status .app-status { flex: 1; min-width: 200px; }
#viewer { flex: 1; min-height: 0; background: var(--paper); }
.kv-credit {
  padding: 6px 16px; font-size: 10.5px; color: var(--sage);
  border-top: 1px solid var(--paper-line); background: var(--paper-deep);
}
.kv-credit a { color: var(--leaf-deep); text-decoration: underline; }
.kv-credit a:hover { color: var(--leaf); }
#viewer kicanvas-embed { display: block; width: 100%; height: 100%; }
body.dragging #viewer { outline: 3px dashed var(--leaf-deep); outline-offset: -8px; }
</style>
</head>
<body>
<div class="app">
  <nav class="rm-bar" aria-label="KiCAD Viewer menu">
    <div class="rm">
      <button type="button">File</button>
      <div class="rm-dd">
        <button type="button" data-cmd="open"><span class="pixel-icon" data-icon="folder" aria-hidden="true"></span>Open KiCAD file&hellip;</button>
        <div class="sep"></div>
        <button type="button" data-cmd="example"><span class="pixel-icon" data-icon="circuit-board" aria-hidden="true"></span>Example schematic</button>
      </div>
    </div>
  </nav>
  <div class="kv-status">
    <span class="app-status" id="status">Open or drop .kicad_sch / .kicad_pcb files (several at once is fine).</span>
  </div>
  <div id="viewer"></div>
  <p class="kv-credit">Viewer:
    <a href="https://kicanvas.org/" target="_blank" rel="noopener">KiCanvas</a>
    by Alethea Katherine Flowers &amp; contributors · free software,
    <a href="../../vendor/kicanvas/LICENSE.md" target="_blank">MIT</a> ·
    <a href="https://github.com/theacodes/kicanvas" target="_blank" rel="noopener">source</a>
  </p>
</div>

<script type="module" src="../../vendor/kicanvas/kicanvas-clackos.js"></script>
<script>
(() => {
const viewer = document.getElementById('viewer');
const status = document.getElementById('status');

/* files: [{ src }] for URLs or [{ text }] for loaded content */
function show(files, label) {
  viewer.innerHTML = '';
  const emb = document.createElement('kicanvas-embed');
  emb.setAttribute('controls', 'full');
  for (const f of files) {
    const s = document.createElement('kicanvas-source');
    if (f.src) s.setAttribute('src', f.src);
    else s.textContent = f.text;
    emb.appendChild(s);
  }
  viewer.appendChild(emb);
  status.textContent = `Viewing ${label}.`;
}

async function showNamed(name) {
  try {
    const res = await fetch('kicad/' + name);
    if (!res.ok) throw new Error(res.status);
    show([{ text: await res.text() }], name);
  } catch (e) {
    status.textContent = `Could not load ${name} (${e.message}).`;
  }
}

async function showPicked(fileList) {
  const files = [...fileList].filter(f => /\.(kicad_sch|kicad_pcb|kicad_wks)$/i.test(f.name));
  if (!files.length) {
    status.textContent = 'No .kicad_sch / .kicad_pcb files there.';
    return;
  }
  show(await Promise.all(files.map(async f => ({ text: await f.text() }))),
    files.map(f => f.name).join(', '));
}

const picker = document.createElement('input');
picker.type = 'file';
picker.accept = '.kicad_sch,.kicad_pcb,.kicad_wks';
picker.multiple = true;
picker.addEventListener('change', () => { showPicked(picker.files); picker.value = ''; });

const menus = document.querySelectorAll('.rm');
const closeMenus = () => menus.forEach(menu => menu.classList.remove('open'));
menus.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
  event.stopPropagation();
  const open = menu.classList.contains('open');
  closeMenus();
  if (!open) menu.classList.add('open');
}));
document.querySelector('.rm-bar').addEventListener('click', event => {
  const command = event.target.closest('[data-cmd]')?.dataset.cmd;
  if (!command) return;
  closeMenus();
  ({ open: () => picker.click(), example: () => showNamed('example.kicad_sch') })[command]?.();
});
document.addEventListener('click', closeMenus);
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });

document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) showPicked(e.dataTransfer.files);
});

const wanted = new URLSearchParams(location.search).get('file');
if (wanted) showNamed(wanted);
})();
</script>
</body>
</html>
