<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Clacksweeper — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
.sweeper-app { height: 100%; min-height: 0; overflow: hidden; user-select: none; }
.sweeper-main { min-height: 0; padding: 10px 14px 9px; gap: 8px; }
.sweeper-head {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
  padding: 8px 12px; border: 1px solid var(--ink); border-radius: 7px;
  background: var(--paper-deep); box-shadow: inset 0 0 0 2px var(--paper);
}
.sweeper-counter { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sweeper-counter:last-child { justify-content: flex-end; }
.sweeper-counter .pixel-icon { width: 20px; height: 20px; color: var(--leaf-deep); }
.sweeper-digits {
  min-width: 62px; padding: 5px 8px; border: 1px solid var(--ink); border-radius: 5px;
  color: var(--accent-hover); background: var(--ink); font-size: 19px; font-weight: 600;
  line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .08em;
}
.sweeper-reset { padding: 5px 9px; line-height: 1; background: var(--paper); }
/* the classic faces, mines and flags are Unicode rather than pixel icons */
.sweeper-glyph {
  font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', sans-serif;
  line-height: 1; font-weight: 400;
}
.sweeper-reset .sweeper-glyph { display: block; font-size: 20px; }
.sweeper-board-wrap {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 3px;
}
.sweeper-board {
  --cell: 20px; display: grid; gap: 1px; padding: 2px;
  border: 1px solid var(--ink); border-radius: 5px; background: var(--ink);
  box-shadow: 4px 4px 0 color-mix(in srgb, var(--shadow) 18%, transparent);
}
.sweeper-cell {
  all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  width: var(--cell); height: var(--cell); cursor: pointer; overflow: hidden;
  border: 1px solid var(--ink); border-radius: 2px; background: var(--paper);
  box-shadow: inset -2px -2px 0 var(--paper-line), inset 2px 2px 0 #fffaf0;
  color: var(--ink); font: 600 calc(var(--cell) * .62)/1 'IBM Plex Mono', monospace;
}
.sweeper-cell:hover:not(.revealed) { background: var(--paper-deep); }
.sweeper-cell:focus-visible { position: relative; z-index: 2; outline: 2px solid var(--accent-hover); outline-offset: -3px; }
.sweeper-cell.revealed { cursor: default; border-color: var(--paper-line); background: var(--paper-deep); box-shadow: none; }
.sweeper-cell.flagged { color: var(--leaf-deep); }
.sweeper-cell.questioned { color: var(--sage); }
.sweeper-cell.mine { color: var(--ink); background: color-mix(in srgb, var(--leaf) 30%, var(--paper)); }
.sweeper-cell.exploded { color: #fff; background: #a04a3a; border-color: #722f27; }
.sweeper-cell.wrong { color: #a04a3a; text-decoration: line-through; }
.sweeper-cell[data-near="1"] { color: #276b47; }
.sweeper-cell[data-near="2"] { color: #3f6d36; }
.sweeper-cell[data-near="3"] { color: #a04a3a; }
.sweeper-cell[data-near="4"] { color: #414b82; }
.sweeper-cell[data-near="5"] { color: #7c3c31; }
.sweeper-cell[data-near="6"] { color: #287579; }
.sweeper-cell[data-near="7"] { color: #3b3b3b; }
.sweeper-cell[data-near="8"] { color: #747474; }
.sweeper-cell .pixel-icon { width: 72%; height: 72%; }
.sweeper-cell .sweeper-glyph { font-size: calc(var(--cell) * .58); }
.sweeper-counter .sweeper-glyph { font-size: 17px; }
/* two lines are always reserved so a longer hint never resizes the window */
.sweeper-status { height: 2.9em; line-height: 1.45; text-align: center; }
.sweeper-modal {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  padding: 18px; background: color-mix(in srgb, var(--ink) 40%, transparent); user-select: text;
}
.sweeper-modal.open { display: flex; }
.sweeper-dialog {
  width: min(410px, 92%); max-height: 90%; overflow: auto; border: 2px solid var(--ink);
  border-radius: 8px; background: var(--paper); box-shadow: 7px 7px 0 color-mix(in srgb, var(--shadow) 32%, transparent);
}
.sweeper-dialog header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 11px; color: var(--menu-text); background: var(--ink);
}
.sweeper-dialog header h2 { font-size: 12px; font-weight: 600; }
.sweeper-dialog header button { all: unset; cursor: pointer; line-height: 0; }
.sweeper-dialog header .pixel-icon { width: 17px; height: 17px; }
.sweeper-dialog-body { display: flex; flex-direction: column; gap: 12px; padding: 15px; line-height: 1.55; }
.sweeper-dialog-body label { display: grid; grid-template-columns: 1fr 95px; align-items: center; gap: 14px; }
.sweeper-dialog-body input[type="number"] {
  width: 95px; padding: 6px 8px; border: 1px solid var(--ink); border-radius: 5px;
  color: var(--control-text); background: var(--paper-deep); font: inherit;
}
.sweeper-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.sweeper-times { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sweeper-times th, .sweeper-times td { padding: 5px 7px; border-bottom: 1px solid var(--paper-line); text-align: left; }
.sweeper-times td:last-child { text-align: right; }
.rm-dd .menu-check { width: 15px; display: inline-block; text-align: center; font-weight: 600; }
@media (max-width: 520px) {
  .sweeper-main { padding-inline: 7px; }
  .sweeper-head { gap: 6px; padding-inline: 7px; }
  .sweeper-counter > .pixel-icon, .sweeper-counter > .sweeper-glyph { display: none; }
}
</style>
</head>
<body>
<div class="app sweeper-app">
  <div class="rm-bar">
    <div class="rm"><button>Game</button><div class="rm-dd">
      <button data-cmd="new"><span class="pixel-icon" data-icon="reload" aria-hidden="true"></span>New <span style="margin-left:auto;color:var(--sage)">F2</span></button>
      <div class="sep"></div>
      <button data-level="beginner"><span class="menu-check" aria-hidden="true"></span>Beginner</button>
      <button data-level="intermediate"><span class="menu-check" aria-hidden="true"></span>Intermediate</button>
      <button data-level="expert"><span class="menu-check" aria-hidden="true"></span>Expert</button>
      <button data-cmd="custom"><span class="menu-check" aria-hidden="true"></span>Custom&hellip;</button>
      <div class="sep"></div>
      <button data-toggle="marks"><span class="menu-check" aria-hidden="true"></span>Marks (?)</button>
      <button data-toggle="sound"><span class="menu-check" aria-hidden="true"></span>Sound</button>
      <div class="sep"></div>
      <button data-cmd="times"><span class="pixel-icon" data-icon="analytics" aria-hidden="true"></span>Best Times&hellip;</button>
    </div></div>
    <div class="rm"><button>Help</button><div class="rm-dd">
      <button data-cmd="help"><span class="pixel-icon" data-icon="info-box" aria-hidden="true"></span>How to Play</button>
      <button data-cmd="about"><span class="pixel-icon" data-icon="grid-3x3" aria-hidden="true"></span>About Clacksweeper</button>
    </div></div>
  </div>

  <main class="app-main sweeper-main">
    <section class="sweeper-head" aria-label="Game status">
      <div class="sweeper-counter" title="Mines remaining">
        <span class="sweeper-glyph" aria-hidden="true">&#128163;</span>
        <span class="sweeper-digits sweeper-mines" aria-label="Mines remaining">010</span>
      </div>
      <button class="btn ghost sweeper-reset" data-face="ready" aria-label="Start a new game" title="New game (F2)">
        <span class="sweeper-glyph" aria-hidden="true">&#128578;</span>
      </button>
      <div class="sweeper-counter" title="Elapsed time">
        <span class="pixel-icon" data-icon="analytics" aria-hidden="true"></span>
        <span class="sweeper-digits sweeper-time" aria-label="Elapsed time">000</span>
      </div>
    </section>
    <div class="sweeper-board-wrap">
      <div class="sweeper-board" role="grid" aria-label="Clacksweeper board"></div>
    </div>
    <p class="app-status sweeper-status" aria-live="polite">Clear the board without disturbing a clack mine.</p>
  </main>

  <div class="sweeper-modal modal" role="presentation" aria-hidden="true">
    <section class="sweeper-dialog" role="dialog" aria-modal="true" aria-labelledby="sweeper-dialog-title">
      <header><h2 id="sweeper-dialog-title">Clacksweeper</h2><button data-dialog-close aria-label="Close"><span class="pixel-icon" data-icon="close" aria-hidden="true"></span></button></header>
      <div class="sweeper-dialog-body"></div>
    </section>
  </div>
</div>

<script>
(() => {
const appRoot = window.ClackOSMountRoot || document.currentScript?.getRootNode() || document;
const boardEl = appRoot.querySelector('.sweeper-board');
const minesEl = appRoot.querySelector('.sweeper-mines');
const timeEl = appRoot.querySelector('.sweeper-time');
const statusEl = appRoot.querySelector('.sweeper-status');
const resetEl = appRoot.querySelector('.sweeper-reset');
const modal = appRoot.querySelector('.sweeper-modal');
const barEl = appRoot.querySelector('.rm-bar');
const mainEl = appRoot.querySelector('.sweeper-main');
const headEl = appRoot.querySelector('.sweeper-head');
const wrapEl = appRoot.querySelector('.sweeper-board-wrap');
const dialogTitle = appRoot.querySelector('#sweeper-dialog-title');
const dialogBody = appRoot.querySelector('.sweeper-dialog-body');

const LEVELS = {
  beginner: { rows: 9, cols: 9, mines: 10, label: 'Beginner' },
  intermediate: { rows: 16, cols: 16, mines: 40, label: 'Intermediate' },
  expert: { rows: 16, cols: 30, mines: 99, label: 'Expert' }
};
const SETTINGS_KEY = 'clacksweeper-settings-v1';
const TIMES_KEY = 'clacksweeper-best-times-v1';
const defaults = { level: 'beginner', custom: { rows: 12, cols: 18, mines: 36 }, marks: true, sound: true };
const loadJSON = (key, fallback) => {
  try { return { ...fallback, ...JSON.parse(localStorage.getItem(key) || '{}') }; } catch { return { ...fallback }; }
};
let settings = loadJSON(SETTINGS_KEY, defaults);
settings.custom = { ...defaults.custom, ...(settings.custom || {}) };
let bestTimes = loadJSON(TIMES_KEY, {});
let config, cells = [], state = 'ready', opened = 0, flags = 0, elapsed = 0, timer = 0, focusIndex = 0;

const saveSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} };
const saveTimes = () => { try { localStorage.setItem(TIMES_KEY, JSON.stringify(bestTimes)); } catch {} };
const pad = n => {
  n = Math.max(-99, Math.min(999, n));
  return n < 0 ? '-' + String(Math.abs(n)).padStart(2, '0') : String(n).padStart(3, '0');
};
const currentConfig = () => settings.level === 'custom'
  ? { ...settings.custom, label: 'Custom' }
  : { ...LEVELS[settings.level] || LEVELS.beginner };
const indexOf = (row, col) => row * config.cols + col;
const around = index => {
  const row = Math.floor(index / config.cols), col = index % config.cols, result = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const r = row + dr, c = col + dc;
    if ((dr || dc) && r >= 0 && r < config.rows && c >= 0 && c < config.cols) result.push(indexOf(r, c));
  }
  return result;
};
const setStatus = text => { statusEl.textContent = text; };
const stopTimer = () => { clearInterval(timer); timer = 0; };
const updateCounters = () => {
  minesEl.textContent = pad(config.mines - flags);
  timeEl.textContent = pad(elapsed);
};
const announceCell = index => {
  const cell = cells[index];
  if (cell.mine) return `Row ${cell.row + 1}, column ${cell.col + 1}, mine`;
  if (cell.open) return `Row ${cell.row + 1}, column ${cell.col + 1}, ${cell.near || 'no'} adjacent mines`;
  if (cell.mark === 'flag') return `Row ${cell.row + 1}, column ${cell.col + 1}, flagged`;
  if (cell.mark === 'question') return `Row ${cell.row + 1}, column ${cell.col + 1}, question mark`;
  return `Row ${cell.row + 1}, column ${cell.col + 1}, covered`;
};

function beep(kind) {
  if (!settings.sound) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = kind === 'lose' ? 105 : kind === 'win' ? 620 : 260;
    gain.gain.setValueAtTime(.035, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + (kind === 'open' ? .035 : .18));
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + (kind === 'open' ? .04 : .2));
    osc.onended = () => ctx.close().catch(() => {});
  } catch {}
}

/* classic Minesweeper glyphs, as Unicode rather than pixel icons */
const GLYPH = { mine: '\u{1F4A3}', flag: '\u{1F6A9}', wrong: '❌' };
const FACE = { ready: '\u{1F642}', won: '\u{1F60E}', lost: '\u{1F635}' };
const glyph = name => `<span class="sweeper-glyph" aria-hidden="true">${GLYPH[name]}</span>`;

function cellContents(cell) {
  if (cell.open && cell.mine) return glyph('mine');
  if (cell.open) return cell.near ? String(cell.near) : '';
  if (cell.wrong) return glyph('wrong');
  if (cell.mark === 'flag') return glyph('flag');
  if (cell.mark === 'question') return '?';
  return '';
}
function setFace(face) {
  resetEl.dataset.face = face;
  resetEl.querySelector('.sweeper-glyph').textContent = FACE[face];
}
function renderCell(index) {
  const cell = cells[index], el = cell.el;
  el.className = 'sweeper-cell';
  if (cell.open) el.classList.add('revealed');
  if (cell.open && cell.mine) el.classList.add('mine');
  if (cell.exploded) el.classList.add('exploded');
  if (cell.wrong) el.classList.add('wrong');
  if (!cell.open && cell.mark === 'flag') el.classList.add('flagged');
  if (!cell.open && cell.mark === 'question') el.classList.add('questioned');
  if (cell.open && cell.near) el.dataset.near = cell.near;
  else delete el.dataset.near;
  el.innerHTML = cellContents(cell);
  el.setAttribute('aria-label', announceCell(index));
  el.setAttribute('aria-pressed', cell.open ? 'true' : 'false');
}

/* Cells keep a comfortable size and the window grows to suit; they only shrink
 * when the board would otherwise not fit on screen at all. */
const CELL_IDEAL = 26, CELL_MIN = 14;
function cellSizeFor(rows, cols) {
  /* rough allowance for the window frame, menu bar, status line and padding */
  const roomW = Math.max(220, (window.innerWidth || 1024) - 90);
  const roomH = Math.max(180, (window.innerHeight || 768) - 210);
  return Math.max(CELL_MIN, Math.min(CELL_IDEAL, Math.floor(roomW / cols) - 1, Math.floor(roomH / rows) - 1));
}

const cssPx = (style, prop) => parseFloat(style.getPropertyValue(prop)) || 0;
/* width an element wants when nothing is stretching it */
function naturalWidth(el) {
  const previous = el.style.width;
  el.style.width = 'max-content';
  const width = el.getBoundingClientRect().width;
  el.style.width = previous;
  return Math.ceil(width);
}
/* The board sets the window size rather than the other way round: measure what
 * this layout needs and ask ClackOS to wrap its frame around it. */
function fitWindow() {
  const host = appRoot === document ? null : appRoot.host;
  if (!host || !boardEl.offsetWidth) return;
  const main = getComputedStyle(mainEl), wrap = getComputedStyle(wrapEl);
  const mainX = cssPx(main, 'padding-left') + cssPx(main, 'padding-right');
  const mainY = cssPx(main, 'padding-top') + cssPx(main, 'padding-bottom');
  const wrapX = cssPx(wrap, 'padding-left') + cssPx(wrap, 'padding-right');
  const wrapY = cssPx(wrap, 'padding-top') + cssPx(wrap, 'padding-bottom');
  const gaps = cssPx(main, 'row-gap') * 2;
  const width = Math.max(
    naturalWidth(barEl),
    mainX + Math.max(boardEl.offsetWidth + wrapX, naturalWidth(headEl))
  );
  const height = barEl.offsetHeight + mainY + gaps
    + headEl.offsetHeight + boardEl.offsetHeight + wrapY + statusEl.offsetHeight;
  host.dispatchEvent(new CustomEvent('clackos-resize', {
    bubbles: true, composed: true, detail: { width, height }
  }));
}

function newGame() {
  stopTimer();
  config = currentConfig();
  state = 'ready'; opened = 0; flags = 0; elapsed = 0; focusIndex = 0;
  boardEl.innerHTML = '';
  boardEl.style.setProperty('--cell', cellSizeFor(config.rows, config.cols) + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${config.cols}, var(--cell))`;
  boardEl.setAttribute('aria-rowcount', config.rows);
  boardEl.setAttribute('aria-colcount', config.cols);
  cells = Array.from({ length: config.rows * config.cols }, (_, index) => {
    const row = Math.floor(index / config.cols), col = index % config.cols;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'sweeper-cell'; el.dataset.index = index;
    el.setAttribute('role', 'gridcell'); el.setAttribute('aria-rowindex', row + 1); el.setAttribute('aria-colindex', col + 1);
    el.tabIndex = index ? -1 : 0;
    boardEl.appendChild(el);
    const cell = { row, col, mine: false, near: 0, open: false, mark: '', exploded: false, wrong: false, el };
    el.setAttribute('aria-label', `Row ${row + 1}, column ${col + 1}, covered`);
    return cell;
  });
  setFace('ready');
  updateCounters(); updateMenuChecks();
  setStatus(`${config.label}: ${config.cols} × ${config.rows}, ${config.mines} mines.`);
  fitWindow();
}

function layMines(safeIndex) {
  const protectedCells = new Set([safeIndex, ...around(safeIndex)]);
  if (cells.length - protectedCells.size < config.mines) { protectedCells.clear(); protectedCells.add(safeIndex); }
  const choices = cells.map((_, i) => i).filter(i => !protectedCells.has(i));
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  choices.slice(0, config.mines).forEach(i => { cells[i].mine = true; });
  cells.forEach((cell, i) => { cell.near = around(i).filter(n => cells[n].mine).length; });
}
function startTimer() {
  if (timer) return;
  timer = setInterval(() => { if (elapsed < 999) { elapsed++; updateCounters(); } }, 1000);
}
function revealArea(start) {
  const queue = [start], seen = new Set();
  while (queue.length) {
    const index = queue.shift();
    if (seen.has(index)) continue;
    seen.add(index);
    const cell = cells[index];
    if (cell.open || cell.mark === 'flag' || cell.mine) continue;
    if (cell.mark === 'question') cell.mark = '';
    cell.open = true; opened++; renderCell(index);
    if (!cell.near) around(index).forEach(next => queue.push(next));
  }
}
function reveal(index) {
  if (state === 'won' || state === 'lost') return;
  const cell = cells[index];
  if (cell.mark === 'flag') return;
  if (cell.open) { chord(index); return; }
  if (state === 'ready') { layMines(index); state = 'playing'; startTimer(); }
  if (cell.mine) { lose(index); return; }
  if (cell.mark) cell.mark = '';
  revealArea(index); beep('open');
  if (opened === cells.length - config.mines) win();
  else setStatus(cell.near ? `${cell.near} mine${cell.near === 1 ? '' : 's'} nearby.` : 'Clear — keep sweeping.');
}
function mark(index) {
  if (state === 'won' || state === 'lost' || cells[index].open) return;
  const cell = cells[index];
  if (!cell.mark) { cell.mark = 'flag'; flags++; }
  else if (cell.mark === 'flag' && settings.marks) { cell.mark = 'question'; flags--; }
  else { if (cell.mark === 'flag') flags--; cell.mark = ''; }
  renderCell(index); updateCounters(); beep('open');
}
function chord(index) {
  const cell = cells[index];
  if (!cell.open || !cell.near || state !== 'playing') return;
  const neighbours = around(index);
  if (neighbours.filter(i => cells[i].mark === 'flag').length !== cell.near) {
    setStatus(`Place ${cell.near} flag${cell.near === 1 ? '' : 's'} around this number to clear its neighbours.`); return;
  }
  const hidden = neighbours.filter(i => !cells[i].open && cells[i].mark !== 'flag');
  const mine = hidden.find(i => cells[i].mine);
  if (mine !== undefined) { lose(mine); return; }
  hidden.forEach(revealArea); beep('open');
  if (opened === cells.length - config.mines) win();
}
function lose(index) {
  state = 'lost'; stopTimer(); cells[index].exploded = true;
  cells.forEach((cell, i) => { if (cell.mine) cell.open = true; else if (cell.mark === 'flag') cell.wrong = true; renderCell(i); });
  setFace('lost');
  setStatus('Clack! A mine got you. Press F2 to try again.'); beep('lose');
}
function win() {
  state = 'won'; stopTimer(); flags = config.mines;
  cells.forEach((cell, i) => { if (cell.mine) cell.mark = 'flag'; renderCell(i); });
  setFace('won');
  updateCounters(); setStatus(`Board cleared in ${elapsed} second${elapsed === 1 ? '' : 's'}!`); beep('win');
  if (settings.level !== 'custom' && (!bestTimes[settings.level] || elapsed < bestTimes[settings.level])) {
    bestTimes[settings.level] = elapsed; saveTimes();
    setStatus(`New ${LEVELS[settings.level].label} record: ${elapsed} second${elapsed === 1 ? '' : 's'}!`);
  }
}

function focusCell(index) {
  index = Math.max(0, Math.min(cells.length - 1, index));
  cells[focusIndex].el.tabIndex = -1; focusIndex = index;
  cells[focusIndex].el.tabIndex = 0; cells[focusIndex].el.focus();
}
boardEl.addEventListener('click', event => {
  const el = event.target.closest('.sweeper-cell');
  if (!el) return;
  focusIndex = Number(el.dataset.index); reveal(focusIndex);
});
boardEl.addEventListener('contextmenu', event => {
  const el = event.target.closest('.sweeper-cell');
  if (!el) return;
  event.preventDefault(); focusIndex = Number(el.dataset.index); mark(focusIndex);
});
boardEl.addEventListener('auxclick', event => {
  const el = event.target.closest('.sweeper-cell');
  if (el && event.button === 1) { event.preventDefault(); chord(Number(el.dataset.index)); }
});
boardEl.addEventListener('keydown', event => {
  const key = event.key.toLowerCase(), col = focusIndex % config.cols;
  if (key === 'arrowleft') focusCell(col ? focusIndex - 1 : focusIndex);
  else if (key === 'arrowright') focusCell(col < config.cols - 1 ? focusIndex + 1 : focusIndex);
  else if (key === 'arrowup') focusCell(focusIndex - config.cols);
  else if (key === 'arrowdown') focusCell(focusIndex + config.cols);
  else if (key === 'f') mark(focusIndex);
  else if (key === '?' || key === '/') {
    if (!cells[focusIndex].open) {
      if (cells[focusIndex].mark === 'flag') flags--;
      cells[focusIndex].mark = 'question'; renderCell(focusIndex); updateCounters();
    }
  }
  else if (key === 'enter' || key === ' ') reveal(focusIndex);
  else return;
  event.preventDefault();
});
resetEl.addEventListener('click', newGame);

function closeDialog() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); dialogBody.innerHTML = ''; }
function openDialog(title, html, setup) {
  dialogTitle.textContent = title; dialogBody.innerHTML = html;
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
  if (setup) setup(dialogBody);
  const focusable = dialogBody.querySelector('input, button');
  (focusable || appRoot.querySelector('[data-dialog-close]')).focus();
}
appRoot.querySelector('[data-dialog-close]').addEventListener('click', closeDialog);
modal.addEventListener('pointerdown', event => { if (event.target === modal) closeDialog(); });

function customDialog() {
  const c = settings.custom;
  openDialog('Custom Board', `
    <label>Width (5–30)<input name="cols" type="number" min="5" max="30" value="${c.cols}"></label>
    <label>Height (5–16)<input name="rows" type="number" min="5" max="16" value="${c.rows}"></label>
    <label>Mines<input name="mines" type="number" min="1" max="479" value="${c.mines}"></label>
    <p class="app-status">Custom games do not count towards best times.</p>
    <div class="sweeper-dialog-actions"><button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-apply>Start game</button></div>`, body => {
      body.querySelector('[data-cancel]').addEventListener('click', closeDialog);
      body.querySelector('[data-apply]').addEventListener('click', () => {
        const rows = Math.max(5, Math.min(16, Number(body.querySelector('[name="rows"]').value) || c.rows));
        const cols = Math.max(5, Math.min(30, Number(body.querySelector('[name="cols"]').value) || c.cols));
        const mines = Math.max(1, Math.min(rows * cols - 1, Number(body.querySelector('[name="mines"]').value) || c.mines));
        settings.custom = { rows, cols, mines }; settings.level = 'custom'; saveSettings(); closeDialog(); newGame();
      });
    });
}
function timesDialog() {
  const row = key => `<tr><th>${LEVELS[key].label}</th><td>${bestTimes[key] == null ? '—' : `${bestTimes[key]} sec`}</td></tr>`;
  openDialog('Best Times', `<table class="sweeper-times">${row('beginner')}${row('intermediate')}${row('expert')}</table>
    <div class="sweeper-dialog-actions"><button class="btn ghost" data-reset-times>Reset times</button><button class="btn primary" data-ok>OK</button></div>`, body => {
      body.querySelector('[data-ok]').addEventListener('click', closeDialog);
      body.querySelector('[data-reset-times]').addEventListener('click', () => { bestTimes = {}; saveTimes(); timesDialog(); });
    });
}
function helpDialog() {
  openDialog('How to Play', `<p>Reveal every empty square without opening a mine. Numbers show how many mines touch that square.</p>
    <p><b>Left-click</b> to reveal. <b>Right-click</b> to place a flag, then a question mark. Click a revealed number after placing the matching number of flags to clear its neighbours.</p>
    <p><b>Keyboard:</b> arrows move, Space or Enter reveals, F marks, and F2 starts again. Your first reveal is always safe.</p>
    <div class="sweeper-dialog-actions"><button class="btn primary" data-ok>Got it</button></div>`, body => body.querySelector('[data-ok]').addEventListener('click', closeDialog));
}
function aboutDialog() {
  openDialog('About Clacksweeper', `<p><b>Clacksweeper</b></p><p>A ClackOS take on the classic mine-clearing puzzle, built with the system palette and bundled Pixelarticons.</p>
    <div class="sweeper-dialog-actions"><button class="btn primary" data-ok>OK</button></div>`, body => body.querySelector('[data-ok]').addEventListener('click', closeDialog));
}

const rms = appRoot.querySelectorAll('.rm');
const closeMenus = () => rms.forEach(menu => menu.classList.remove('open'));
function updateMenuChecks() {
  appRoot.querySelectorAll('[data-level]').forEach(button => {
    button.querySelector('.menu-check').textContent = settings.level === button.dataset.level ? '✓' : '';
  });
  appRoot.querySelector('[data-cmd="custom"] .menu-check').textContent = settings.level === 'custom' ? '✓' : '';
  appRoot.querySelector('[data-toggle="marks"] .menu-check').textContent = settings.marks ? '✓' : '';
  appRoot.querySelector('[data-toggle="sound"] .menu-check').textContent = settings.sound ? '✓' : '';
}
rms.forEach(menu => menu.querySelector(':scope > button').addEventListener('click', event => {
  event.stopPropagation(); const open = menu.classList.contains('open'); closeMenus();
  if (!open) { updateMenuChecks(); menu.classList.add('open'); }
}));
appRoot.querySelector('.rm-bar').addEventListener('click', event => {
  const button = event.target.closest('[data-cmd], [data-level], [data-toggle]');
  if (!button) return;
  closeMenus();
  if (button.dataset.level) { settings.level = button.dataset.level; saveSettings(); newGame(); }
  else if (button.dataset.toggle) { settings[button.dataset.toggle] = !settings[button.dataset.toggle]; saveSettings(); updateMenuChecks(); }
  else if (button.dataset.cmd === 'new') newGame();
  else if (button.dataset.cmd === 'custom') customDialog();
  else if (button.dataset.cmd === 'times') timesDialog();
  else if (button.dataset.cmd === 'help') helpDialog();
  else if (button.dataset.cmd === 'about') aboutDialog();
});
appRoot.addEventListener('click', closeMenus);

const keyTarget = appRoot === document ? window : appRoot;
keyTarget.addEventListener('keydown', event => {
  if (event.key === 'F2') { event.preventDefault(); newGame(); }
  else if (event.key === 'Escape' && modal.classList.contains('open')) closeDialog();
});
if (appRoot !== document) appRoot.host.addEventListener('clackos-disconnect', stopTimer, { once: true });
newGame();
/* the first measure runs before the webfont lands, so take it again after */
document.fonts?.ready.then(fitWindow).catch(() => {});
})();
</script>
</body>
</html>
