<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>QBasic 1.1 — ClackOS</title>
<link rel="stylesheet" href="../../vendor/js-dos/js-dos.css">
<style>
html, body, #qbasic {
  width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000;
}
body { font-family: "IBM Plex Mono", Consolas, monospace; }
#qbasic { position: absolute; inset: 0; }
#qbasic canvas { image-rendering: pixelated; }
.boot {
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
  background: #0000a8; color: #fff; transition: opacity 120ms linear;
}
.boot.ready { opacity: 0; pointer-events: none; }
.boot-panel {
  width: min(380px, calc(100vw - 48px)); padding: 20px 24px;
  border: 2px solid #fff; box-shadow: 8px 8px 0 #000; text-align: center;
}
.boot h1 { margin: 0 0 14px; font-size: 22px; font-weight: 400; }
.boot p { margin: 0; font-size: 13px; line-height: 1.5; }
.boot .detail { margin-top: 9px; color: #c8c8c8; }
.boot.error { background: #181818; }
.boot.error .detail { color: #ffb4a8; }
.boot button {
  display: none; margin: 18px auto 0; padding: 6px 18px; color: #000;
  background: #c8c8c8; border: 2px outset #fff; font: inherit; cursor: pointer;
}
.boot.error button { display: block; }
</style>
</head>
<body>
<div id="qbasic" role="application" aria-label="QBasic 1.1"></div>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-panel">
    <h1>QBasic 1.1</h1>
    <p id="boot-status">Starting QBasic…</p>
    <p class="detail" id="boot-detail">Preparing the program.</p>
    <button id="retry" type="button">Retry</button>
  </div>
</div>

<script src="../../vendor/js-dos/js-dos.js"></script>
<script>
(() => {
  const root = document.getElementById('qbasic');
  const boot = document.getElementById('boot');
  const status = document.getElementById('boot-status');
  const detail = document.getElementById('boot-detail');
  const retry = document.getElementById('retry');

  const dosboxConf = `
[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[render]
aspect=true
scaler=none

[cpu]
core=auto
cputype=auto
cycles=fixed 12000

[mixer]
nosound=true

[autoexec]
@echo off
mount c .
c:
QBASIC.EXE
`;

  let revealed = false;
  let startupTimer = 0;

  function reveal() {
    if (revealed) return;
    revealed = true;
    window.clearTimeout(startupTimer);
    boot.classList.add('ready');
    boot.setAttribute('aria-hidden', 'true');
    window.setTimeout(() => boot.remove(), 150);
  }

  function waitForQBasic(ci) {
    const deadline = performance.now() + 15000;
    const check = async () => {
      try {
        const frame = await ci.screenshot();
        const pixels = frame.data;
        let blue = 0;
        const samples = Math.max(1, Math.floor(pixels.length / 4 / 5000));
        let total = 0;
        for (let i = 0; i < pixels.length; i += 4 * samples) {
          total++;
          if (pixels[i + 2] > 70 && pixels[i + 2] > pixels[i] + 25 && pixels[i + 2] > pixels[i + 1] + 25) blue++;
        }
        if (blue / total > 0.12) return reveal();
      } catch {}
      if (performance.now() >= deadline) return reveal();
      window.setTimeout(check, 100);
    };
    check();
  }

  async function start() {
    try {
      status.textContent = 'Starting QBasic…';
      detail.textContent = 'Loading the program.';
      const response = await fetch('qbasic/QBASIC.EXE');
      if (!response.ok) throw new Error(`QBASIC.EXE could not be loaded (${response.status}).`);
      const executable = new Uint8Array(await response.arrayBuffer());
      detail.textContent = 'Launching QBasic.';

      Dos(root, {
        dosboxConf,
        initFs: [{ path: 'QBASIC.EXE', contents: executable }],
        pathPrefix: '../../vendor/js-dos/emulators/',
        backend: 'dosbox',
        backendLocked: true,
        workerThread: true,
        autoStart: true,
        countDownStart: 0,
        kiosk: true,
        autoSave: true,
        mouseCapture: false,
        noCursor: false,
        renderAspect: '4/3',
        renderBackend: 'canvas',
        imageRendering: 'pixelated',
        onEvent(event, ci) {
          if (event === 'ci-ready') waitForQBasic(ci);
        }
      });
      startupTimer = window.setTimeout(() => {
        if (revealed) return;
        boot.classList.add('error');
        status.textContent = 'QBasic is taking too long to start.';
        detail.textContent = 'Check the browser console or retry the launch.';
      }, 30000);
    } catch (error) {
      boot.classList.add('error');
      status.textContent = 'QBasic could not start.';
      detail.textContent = error && error.message ? error.message : String(error);
    }
  }

  retry.addEventListener('click', () => location.reload());
  start();
})();
</script>
</body>
</html>
