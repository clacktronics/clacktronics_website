<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Simulator — ClackOS</title>
<style>
html, body { height: 100%; margin: 0; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.err {
  font-family: monospace; padding: 24px; color: #14231a; background: #f8f2dd;
}
</style>
<script src="../../vendor/circuitjs1/lz-string.min.js"></script>
</head>
<body>
<iframe id="sim" title="CircuitJS1 circuit simulator"></iframe>
<script>
/* ClackOS wrapper for the vendored, unmodified CircuitJS1 build.
 * Theming is done entirely with CircuitJS1's own startup parameters.
 *
 * Query options for this page:
 *   ?circuit=<name>  loads content/applications/circuits/<name>
 *   ?ctz=<data>      passes a compressed circuit straight through
 */
(async () => {
  const params = new URLSearchParams({
    whiteBackground: 'true',
    positiveColor: '#276b47',   /* leaf-deep for positive voltage */
    negativeColor: '#a04a3a',   /* muted red for negative */
    neutralColor: '#66755a',    /* sage for ground/neutral */
    selectColor: '#4fae7d',     /* leaf for selection */
    currentColor: '#a8841f',    /* dark amber current dots (visible on white) */
    euroResistors: 'true'
  });
  const q = new URLSearchParams(location.search);
  if (q.get('ctz')) {
    params.set('ctz', q.get('ctz'));
  } else if (q.get('circuit')) {
    try {
      const res = await fetch('circuits/' + q.get('circuit'));
      if (!res.ok) throw new Error(res.status);
      params.set('ctz', LZString.compressToEncodedURIComponent(await res.text()));
    } catch (e) {
      document.body.innerHTML =
        `<p class="err">Could not load circuit "${q.get('circuit')}" (${e.message}).</p>`;
      return;
    }
  }
  document.getElementById('sim').src =
    '../../vendor/circuitjs1/circuitjs.html?' + params.toString();
})();
</script>
</body>
</html>
