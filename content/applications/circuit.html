<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Simulator — ClackOS</title>
<style>
html, body { height: 100%; margin: 0; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.err {
  font-family: monospace; padding: 24px; color: #14231a; background: #f8f2dd;
}
</style>
<script src="../../vendor/circuitjs1/lz-string.min.js"></script>
</head>
<body>
<iframe id="sim" title="CircuitJS1 circuit simulator"></iframe>
<script>
/* ClackOS wrapper for the vendored, unmodified CircuitJS1 build.
 * Theming is done entirely with CircuitJS1's own startup parameters.
 *
 * Query options for this page:
 *   ?circuit=<name>  loads content/applications/circuits/<name>
 *   ?ctz=<data>      passes a compressed circuit straight through
 */
(async () => {
  const params = new URLSearchParams({
    whiteBackground: 'true',    /* painted white; the skin multiplies it to paper-cream */
    positiveColor: '#00c000',   /* bright green positive voltage */
    negativeColor: '#ea0000',   /* bright red negative voltage */
    neutralColor: '#66755a',    /* sage for ground/neutral */
    selectColor: '#4fae7d',     /* leaf for selection */
    currentColor: '#a8841f',    /* dark amber current dots */
    euroResistors: 'true'
  });
  const q = new URLSearchParams(location.search);
  if (q.get('ctz')) {
    params.set('ctz', q.get('ctz'));
  } else if (q.get('circuit')) {
    try {
      const res = await fetch('circuits/' + q.get('circuit'));
      if (!res.ok) throw new Error(res.status);
      params.set('ctz', LZString.compressToEncodedURIComponent(await res.text()));
    } catch (e) {
      document.body.innerHTML =
        `<p class="err">Could not load circuit "${q.get('circuit')}" (${e.message}).</p>`;
      return;
    }
  }
  const sim = document.getElementById('sim');
  /* skin the (same-origin) simulator GUI without touching the vendor tree:
   * inject the ClackOS stylesheet and fonts, and re-append after GWT has
   * injected its own theme so ours stays last in the cascade */
  sim.addEventListener('load', () => {
    try {
      const doc = sim.contentDocument;
      const add = href => {
        const l = doc.createElement('link');
        l.rel = 'stylesheet';
        l.href = href;
        doc.head.appendChild(l);
        return l;
      };
      add('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      const skin = add(new URL('../../assets/css/circuitjs-skin.css', location.href).href);
      setTimeout(() => doc.head.appendChild(skin), 2000);
      /* credit + licence for the (unmodified) vendored simulator */
      const credit = doc.createElement('div');
      credit.className = 'clackos-credit';
      credit.innerHTML =
        'Simulator: <a href="https://www.falstad.com/circuit/" target="_blank" rel="noopener">CircuitJS1</a> ' +
        'by Paul Falstad, JS port by Iain Sharp &amp; contributors.<br>' +
        'Free software, <a href="' + new URL('../../vendor/circuitjs1/COPYING.txt', location.href).href +
        '" target="_blank">GPL&nbsp;v2</a> · ' +
        '<a href="https://github.com/pfalstad/circuitjs1" target="_blank" rel="noopener">source</a>';
      doc.body.appendChild(credit);
    } catch (e) { console.warn('could not skin simulator:', e); }
  });
  sim.src = '../../vendor/circuitjs1/circuitjs.html?' + params.toString();
})();
</script>
</body>
</html>
