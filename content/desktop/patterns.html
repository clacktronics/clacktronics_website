<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Desktop — Edit Pattern — ClackOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body>
<div class="app">
  <div class="app-main">
    <div class="pat-head">
      <label>Name <input type="text" class="pat-name" maxlength="24" placeholder="My pattern"></label>
      <select class="pat-sel" aria-label="Saved patterns"></select>
    </div>
    <div class="pat-main">
      <div>
        <p class="app-lbl">Sample</p>
        <div class="pat-sample"></div>
      </div>
      <div>
        <p class="app-lbl">Pixels — click or drag to flip</p>
        <div class="pat-grid" aria-label="8 by 8 pattern grid"></div>
      </div>
    </div>
    <div class="pat-btns">
      <button class="btn primary" data-pat="apply">Apply to desktop</button>
      <button class="btn ghost" data-pat="add">Add</button>
      <button class="btn ghost" data-pat="remove">Remove</button>
      <button class="btn ghost" data-pat="clear">Clear</button>
    </div>
    <p class="app-status pat-hint">Add saves the pattern under its name (overwriting a pattern with
    the same name); saved patterns appear in the ClackOS Desktop menu. Apply also saves, then sets
    the desktop wallpaper. Patterns live in this browser's storage.</p>
  </div>
</div>

<script>
(() => {
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const PAT_KEY = 'clackos-patterns';
const WP_KEY = 'clackos-wallpaper';
const PAT_FG = '#7c7355', PAT_BG = '#e3ddc6';
/* names owned by the built-in wallpapers in the ClackOS desktop */
const BUILTIN = ['Sand dots', 'Pebbles', 'Cracked earth', 'Fern weave', 'Circuit trace', 'Terrazzo'];

function loadPatterns() {
  try { return JSON.parse(localStorage.getItem(PAT_KEY)) || {}; } catch { return {}; }
}
function savePatterns(map) {
  try { localStorage.setItem(PAT_KEY, JSON.stringify(map)); } catch {}
}

let rows = new Array(8).fill(0);
const grid = document.querySelector('.pat-grid');
const cells = [];
for (let i = 0; i < 64; i++) {
  const c = document.createElement('button');
  c.className = 'pat-cell';
  c.setAttribute('aria-label', `pixel column ${i % 8 + 1}, row ${(i >> 3) + 1}`);
  grid.appendChild(c);
  cells.push(c);
}
const sample = document.querySelector('.pat-sample');
const nameInput = document.querySelector('.pat-name');
const sel = document.querySelector('.pat-sel');
const status = document.querySelector('.pat-hint');

const bit = i => (rows[i >> 3] >> (7 - (i % 8))) & 1;
const flip = (i, v) => {
  const mask = 1 << (7 - (i % 8));
  rows[i >> 3] = v ? rows[i >> 3] | mask : rows[i >> 3] & ~mask;
};
const tileSvg = () => {
  let px = '';
  rows.forEach((row, y) => {
    for (let x = 0; x < 8; x++)
      if ((row >> (7 - x)) & 1)
        px += `<rect x='${x * 2}' y='${y * 2}' width='2' height='2' fill='${PAT_FG}'/>`;
  });
  return `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'>${px}</svg>`)}")`;
};
const render = () => {
  cells.forEach((c, i) => c.classList.toggle('on', !!bit(i)));
  sample.style.backgroundColor = PAT_BG;
  sample.style.backgroundImage = tileSvg();
};
const refreshSel = () => {
  sel.innerHTML = '<option value="">Saved patterns…</option>' +
    Object.keys(loadPatterns()).map(n => `<option>${esc(n)}</option>`).join('');
};

/* click to toggle, drag to paint with the first cell's new value */
let paint = null;
grid.addEventListener('pointerdown', e => {
  const i = cells.indexOf(e.target);
  if (i < 0) return;
  paint = !bit(i);
  flip(i, paint);
  render();
});
grid.addEventListener('pointerover', e => {
  if (paint === null || !(e.buttons & 1)) return;
  const i = cells.indexOf(e.target);
  if (i >= 0) { flip(i, paint); render(); }
});
window.addEventListener('pointerup', () => { paint = null; });

sel.addEventListener('change', () => {
  const saved = loadPatterns()[sel.value];
  if (saved) { rows = saved.slice(); nameInput.value = sel.value; render(); }
});

document.querySelector('.pat-btns').addEventListener('click', e => {
  const act = e.target.dataset.pat;
  if (!act) return;
  const name = nameInput.value.trim();
  const store = loadPatterns();
  if (act === 'clear') { rows = new Array(8).fill(0); render(); return; }
  if (act === 'remove') {
    if (!name || !store[name]) return;
    delete store[name];
    savePatterns(store);
    refreshSel();
    /* if the desktop is currently wearing it, fall back to the default;
     * the ClackOS desktop picks this up through the storage event */
    try {
      if (localStorage.getItem(WP_KEY) === name) localStorage.setItem(WP_KEY, 'Sand dots');
    } catch {}
    return;
  }
  /* add + apply both save under the given name */
  const finalName = name || 'Untitled';
  if (BUILTIN.includes(finalName)) {
    nameInput.value = '';
    nameInput.placeholder = `"${finalName}" is a built-in`;
    return;
  }
  store[finalName] = rows.slice();
  savePatterns(store);
  refreshSel();
  sel.value = finalName;
  nameInput.value = finalName;
  if (act === 'apply') {
    try { localStorage.setItem(WP_KEY, finalName); } catch {}
    status.textContent = window.parent === window
      ? `"${finalName}" saved and set as the desktop wallpaper — it shows next time the desktop loads.`
      : `"${finalName}" applied to the desktop.`;
  }
});

refreshSel();
render();
})();
</script>
</body>
</html>
